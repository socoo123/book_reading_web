<svg xmlns="http://www.w3.org/2000/svg" width="720" height="536" viewBox="0 0 720 536" role="img" aria-labelledby="title desc">
  <title id="title">同一元素的边界与内部模型</title>
  <desc id="desc">边界模型列出可见行为、交换数据、端口与质量承诺。内部模型在保持这些承诺的同时增加子元素与协作关系；子元素又可以按需继续精化。此图不指定 Yinzer 的下一层设计。</desc>
  <!-- Original, editable hand-written SVG. The export is an identical web copy. -->
  <style>
    :root { color-scheme: light dark; --bg: #fcfbf8; --text: #292824; --muted: #655f55; --line: #81786a; --box: #efede7; --focus: #f3e9d9; --accent: #9a4d32; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; } }
    :root[data-theme='dark'] { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; }
    text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .heading { font-size: 22px; font-weight: 600; }
    .sub { font-size: 16px; fill: var(--muted); }
    .label { font-size: 20px; font-weight: 600; text-anchor: middle; }
    .detail { font-size: 16px; text-anchor: middle; fill: var(--muted); }
    .node { fill: var(--box); stroke: var(--line); stroke-width: 1.2; }
    .focus { fill: var(--focus); stroke: var(--accent); stroke-width: 1.4; }
    .scope { fill: none; stroke: var(--line); stroke-width: 1.3; stroke-dasharray: 6 5; }
    .arrow { fill: none; stroke: var(--accent); stroke-width: 1.8; marker-end: url(#arrow); }
    .link { stroke: var(--line); stroke-width: 1.8; }
  </style>
  <script><![CDATA[
    try {
      const theme = localStorage.getItem('reading-notes-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch {}
  ]]></script>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--accent)"/></marker></defs>
  <rect width="720" height="536" rx="10" fill="var(--bg)"/>
  <text class="heading" x="30" y="38">细节可以增加，边界承诺不能丢失</text>
  <text class="sub" x="30" y="67">两种模型描述同一个元素，不是两个开发阶段</text>

  <rect class="focus" x="75" y="91" width="570" height="89" rx="7"/>
  <text class="label" x="360" y="125">边界模型：使用者需要知道什么</text>
  <text class="detail" x="360" y="156">可见行为 · 交换数据 · 端口 · 质量承诺</text>

  <path class="arrow" d="M360 190V247"/>
  <text class="sub" x="385" y="224">精化：增加实现细节</text>

  <rect class="scope" x="55" y="259" width="610" height="155" rx="8"/>
  <text class="label" x="360" y="292">内部模型：由哪些部分协作实现</text>
  <rect class="node" x="90" y="318" width="220" height="66" rx="6"/>
  <text class="label" x="200" y="347">子元素 A 的边界</text>
  <text class="detail" x="200" y="371">暂不暴露内部</text>
  <rect class="node" x="410" y="318" width="220" height="66" rx="6"/>
  <text class="label" x="520" y="347">子元素 B 的边界</text>
  <text class="detail" x="520" y="371">暂不暴露内部</text>
  <path class="link" d="M310 351H410"/>
  <text class="detail" x="360" y="337">协作</text>

  <path class="arrow" d="M200 394V449"/>
  <text class="sub" x="224" y="440">按需要继续展开</text>
  <rect class="node" x="90" y="461" width="220" height="44" rx="6"/>
  <text class="label" x="200" y="490">子元素 A 的内部</text>
  <text class="sub" x="365" y="485">可在足够清楚时停止精化。</text>
</svg>
