<svg xmlns="http://www.w3.org/2000/svg" width="720" height="490" viewBox="0 0 720 490" role="img" aria-labelledby="title desc">
  <title id="title">回调方向不等于模块依赖方向</title>
  <desc id="desc">界面模块使用核心任务与核心定义的进度接口，并实现和登记回调对象。核心任务只依赖自身模块中的接口。实线表示代码依赖，虚线上行表示运行回调，不表示核心依赖具体界面类。</desc>
  <!-- Original editable SVG; the exported web copy is identical. -->
  <style>
    :root { color-scheme: light dark; --bg: #fcfbf8; --text: #292824; --muted: #655f55; --line: #81786a; --box: #efede7; --focus: #f3e9d9; --accent: #9a4d32; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; } }
    :root[data-theme='dark'] { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; }
    text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .heading { font-size: 22px; font-weight: 600; } .sub { font-size: 16px; fill: var(--muted); }
    .node { fill: var(--box); stroke: var(--line); stroke-width: 1.3; }
    .boundary { fill: none; stroke: var(--line); stroke-width: 1.3; }
    .label { font-size: 21px; font-weight: 600; text-anchor: middle; }
    .detail { font-size: 16px; text-anchor: middle; fill: var(--muted); }
    .relation { font-size: 17px; } .dependency { fill: none; stroke: var(--line); stroke-width: 1.8; marker-end: url(#arrow); }
    .runtime { fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-dasharray: 7 5; marker-end: url(#callback); }
  </style>
  <script><![CDATA[
    try {
      const theme = localStorage.getItem('reading-notes-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch {}
  ]]></script>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--line)"/></marker>
    <marker id="callback" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--accent)"/></marker>
  </defs>
  <rect width="720" height="490" rx="10" fill="var(--bg)"/>
  <text class="heading" x="30" y="35">回调向上，核心仍不依赖界面实现</text>
  <text class="sub" x="30" y="64">关键是接口归属与登记方式，不是调用箭头朝哪边</text>
  <rect class="node" x="155" y="100" width="480" height="85" rx="7"/>
  <text class="label" x="395" y="131">界面模块 UI</text>
  <text class="detail" x="395" y="161">实现 ProgressListener，再登记给 CoreJob</text>
  <path class="dependency" d="M250 185V320"/>
  <text class="relation" x="269" y="235">使用任务</text>
  <path class="dependency" d="M540 185V320"/>
  <text class="relation" x="554" y="235">依赖接口</text>
  <rect class="boundary" x="90" y="285" width="585" height="128" rx="7"/>
  <text class="sub" x="109" y="310">核心模块 Core · 自己定义回调契约</text>
  <rect class="node" x="155" y="330" width="200" height="65" rx="6"/>
  <text class="label" x="255" y="358">CoreJob</text>
  <text class="detail" x="255" y="383">执行任务</text>
  <path class="dependency" d="M355 362H425"/>
  <rect class="node" x="435" y="330" width="210" height="65" rx="6"/>
  <text class="label" x="540" y="358">ProgressListener</text>
  <text class="detail" x="540" y="383">核心定义的接口</text>
  <path class="runtime" d="M155 362H65V142H145"/>
  <text class="relation" x="45" y="269" transform="rotate(-90 45 269)">运行回调 report()</text>
  <text class="sub" x="30" y="450">实线：代码依赖　　虚线：通过已登记对象发生的运行调用</text>
  <text class="sub" x="30" y="476">示意不规定回调线程与生命周期；类名为笔记解释性命名。</text>
</svg>
