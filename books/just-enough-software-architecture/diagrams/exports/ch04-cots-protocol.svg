<svg xmlns="http://www.w3.org/2000/svg" width="720" height="636" viewBox="0 0 720 636" role="img" aria-labelledby="title desc">
  <title id="title">适配消息与轮询，不凭连线假定并发</title>
  <desc id="desc">播放器核心在外部通过异步消息发来命令。渲染播放进程内，NextGenVideo 主动询问命令适配器，适配器读取队列并返回翻译后的命令。状态通过同一进程中的状态适配器异步送回核心。适配器没有独立进程或线程的承诺。</desc>
  <!-- Original editable explanatory SVG; the export is an identical web copy. -->
  <style>
    :root { color-scheme: light dark; --bg: #fcfbf8; --text: #292824; --muted: #655f55; --line: #81786a; --box: #efede7; --focus: #f3e9d9; --accent: #9a4d32; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; } }
    :root[data-theme='dark'] { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; }
    text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .heading { font-size: 22px; font-weight: 600; }
    .sub { font-size: 16px; fill: var(--muted); }
    .node { fill: var(--box); stroke: var(--line); stroke-width: 1.2; }
    .focus { fill: var(--focus); stroke: var(--accent); stroke-width: 1.4; }
    .boundary { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 3 5; }
    .label { font-size: 18px; font-weight: 600; text-anchor: middle; }
    .detail { font-size: 16px; fill: var(--muted); text-anchor: middle; }
    .arrow { fill: none; stroke: var(--line); stroke-width: 1.7; marker-end: url(#arrow); }
    .async { fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-dasharray: 7 4; marker-end: url(#accent-arrow); }
  </style>
  <script><![CDATA[
    try {
      const theme = localStorage.getItem('reading-notes-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch {}
  ]]></script>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--line)"/></marker>
    <marker id="accent-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--accent)"/></marker>
  </defs>
  <rect width="720" height="636" rx="10" fill="var(--bg)"/>
  <text class="heading" x="30" y="40">适配消息与轮询，不凭连线假定并发</text>
  <text class="sub" x="30" y="70">只放大控制协议；媒体缓冲和显示路径省略</text>
  <rect class="boundary" x="266" y="104" width="424" height="380" rx="8"/>
  <text class="sub" x="282" y="120">渲染／播放：同一个顶层进程</text>

  <rect class="node" x="30" y="168" width="200" height="80" rx="7"/>
  <text class="label" x="130" y="200">播放器核心</text>
  <text class="detail" x="130" y="229">另一个顶层进程</text>
  <rect class="node" x="294" y="168" width="166" height="80" rx="7"/>
  <text class="label" x="377" y="200">命令适配器</text>
  <text class="detail" x="377" y="229">读队列、翻译</text>
  <rect class="focus" x="506" y="168" width="166" height="80" rx="7"/>
  <text class="label" x="589" y="200">NextGenVideo</text>
  <text class="detail" x="589" y="229">拥有主循环</text>

  <path class="async" d="M238 208H286"/>
  <text class="detail" x="260" y="194">命令</text>
  <path class="arrow" d="M536 160V150H430V160"/>
  <text class="detail" x="481" y="142">① 轮询调用</text>
  <path class="arrow" d="M430 256V278H536V256"/>
  <text class="detail" x="481" y="301">② 返回命令</text>

  <rect class="node" x="506" y="364" width="166" height="80" rx="7"/>
  <text class="label" x="589" y="397">状态适配器</text>
  <text class="detail" x="589" y="426">写回状态</text>
  <path class="arrow" d="M617 256V356"/>
  <text class="sub" x="623" y="327">报告</text>
  <text class="sub" x="623" y="349">状态</text>
  <path class="async" d="M498 404H130V256"/>
  <rect x="211" y="387" width="242" height="27" fill="var(--bg)"/>
  <text class="detail" x="332" y="406">状态消息（异步）</text>
  <text class="sub" x="282" y="338">没有为内部适配器</text>
  <text class="sub" x="282" y="362">承诺独立线程</text>
  <text class="detail" x="478" y="469">实线：调用或返回；虚线箭头：异步消息</text>

  <rect class="focus" x="30" y="510" width="660" height="100" rx="8"/>
  <text class="label" x="360" y="542">队列是异步的 ≠ 内部调用不会阻塞</text>
  <text class="detail" x="360" y="570">条件性反例：查不到命令时若一直等待，</text>
  <text class="detail" x="360" y="594">NextGenVideo 的播放主循环也可能停下。</text>
</svg>
