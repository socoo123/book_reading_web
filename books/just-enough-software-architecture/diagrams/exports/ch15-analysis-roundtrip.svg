<svg xmlns="http://www.w3.org/2000/svg" width="720" height="780" viewBox="0 0 720 780" role="img" aria-labelledby="title desc">
  <title id="title">形式化分析的六步往返</title>
  <desc id="desc">从简化架构模型、映射工具词汇、写成输入语言、构造断言，到运行检查和反向解释。箭头表示工作顺序。虚假反例要求补回实际约束后重查；满足结果也必须带回假设与检查范围。</desc>
  <!-- Original editable SVG; the exported web copy is identical. -->
  <style>
    :root { color-scheme: light dark; --bg: #fcfbf8; --text: #292824; --muted: #655f55; --line: #81786a; --box: #efede7; --focus: #f3e9d9; --accent: #9a4d32; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; } }
    :root[data-theme='dark'] { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; }
    text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .heading { font-size: 22px; font-weight: 600; }
    .sub { font-size: 16px; fill: var(--muted); }
    .node { fill: var(--box); stroke: var(--line); stroke-width: 1.3; }
    .focus { fill: var(--focus); stroke: var(--accent); stroke-width: 1.4; }
    .label { font-size: 20px; font-weight: 600; }
    .detail { font-size: 16px; fill: var(--muted); }
    .number { font-size: 22px; font-weight: 600; text-anchor: middle; fill: var(--accent); }
    .step { fill: none; stroke: var(--line); stroke-width: 1.8; marker-end: url(#arrow); }
  </style>
  <script><![CDATA[
    try {
      const theme = localStorage.getItem('reading-notes-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch {}
  ]]></script>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--line)"/></marker></defs>
  <rect width="720" height="780" rx="10" fill="var(--bg)"/>
  <text class="heading" x="30" y="35">工具检查之前和之后，都还有建模工作</text>
  <text class="sub" x="30" y="64">箭头表示分析顺序，不表示系统运行时通信</text>

  <rect class="node" x="66" y="88" width="588" height="70" rx="7"/>
  <text class="number" x="101" y="132">1</text>
  <text class="label" x="135" y="116">简化模型</text>
  <text class="detail" x="135" y="143">减少规模，同时保留待查性质所需的对应。</text>
  <path class="step" d="M360 163V182"/>
  <rect class="node" x="66" y="190" width="588" height="70" rx="7"/>
  <text class="number" x="101" y="234">2</text>
  <text class="label" x="135" y="218">映射到工具词汇</text>
  <text class="detail" x="135" y="245">将领域元素转换为图、集合或状态等基本元素。</text>
  <path class="step" d="M360 265V284"/>
  <rect class="node" x="66" y="292" width="588" height="70" rx="7"/>
  <text class="number" x="101" y="336">3</text>
  <text class="label" x="135" y="320">写成输入语言</text>
  <text class="detail" x="135" y="347">语法能读入，还要确认含义没有在转换中改变。</text>
  <path class="step" d="M360 367V386"/>
  <rect class="node" x="66" y="394" width="588" height="70" rx="7"/>
  <text class="number" x="101" y="438">4</text>
  <text class="label" x="135" y="422">构造待查断言</text>
  <text class="detail" x="135" y="449">明确要检查什么，以及它依赖的假设。</text>
  <path class="step" d="M360 469V488"/>
  <rect class="focus" x="66" y="496" width="588" height="70" rx="7"/>
  <text class="number" x="101" y="540">5</text>
  <text class="label" x="135" y="524">运行检查</text>
  <text class="detail" x="135" y="551">按所用方法与设定范围，取得满足结论或反例。</text>
  <path class="step" d="M360 571V590"/>
  <rect class="node" x="66" y="598" width="588" height="70" rx="7"/>
  <text class="number" x="101" y="642">6</text>
  <text class="label" x="135" y="626">反向解释结果</text>
  <text class="detail" x="135" y="653">还原成架构问题，核对假设、映射和检查范围。</text>

  <text class="sub" x="30" y="710">虚假反例：补回实际存在的约束，再分析；不能随意排除真实失败。</text>
  <text class="sub" x="30" y="739">满足结果：仍要保留假设与范围，不能自动推广到整个实现。</text>
  <text class="sub" x="30" y="767">本图为工作过程说明，没有运行形式化工具。</text>
</svg>
