<svg xmlns="http://www.w3.org/2000/svg" width="720" height="416" viewBox="0 0 720 416" role="img" aria-labelledby="title desc">
  <title id="title">边界保持稳定，内部设计可以替换</title>
  <desc id="desc">栈使用者理解 push、pop，以及栈顶、空和满的可见约定。封装边界之后可以选择数组加游标，或链表加栈顶引用。两种方案是替代实现，必须满足同一份边界承诺，不是两个处理阶段。此图为笔记假设。</desc>
  <!-- Original, editable hand-written SVG. The export is an identical web copy. -->
  <style>
    :root { color-scheme: light dark; --bg: #fcfbf8; --text: #292824; --muted: #655f55; --line: #81786a; --box: #efede7; --focus: #f3e9d9; --accent: #9a4d32; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; } }
    :root[data-theme='dark'] { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; }
    text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .heading { font-size: 22px; font-weight: 600; }
    .sub { font-size: 16px; fill: var(--muted); }
    .label { font-size: 20px; font-weight: 600; text-anchor: middle; }
    .detail { font-size: 16px; text-anchor: middle; fill: var(--muted); }
    .node { fill: var(--box); stroke: var(--line); stroke-width: 1.2; }
    .focus { fill: var(--focus); stroke: var(--accent); stroke-width: 1.4; }
    .scope { fill: none; stroke: var(--line); stroke-width: 1.3; stroke-dasharray: 6 5; }
  </style>
  <script><![CDATA[
    try {
      const theme = localStorage.getItem('reading-notes-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch {}
  ]]></script>
  <rect width="720" height="416" rx="10" fill="var(--bg)"/>
  <text class="heading" x="30" y="38">使用者依赖承诺，不依赖存储结构</text>
  <text class="sub" x="30" y="67">以栈为例：两种内部方案都要符合相同的可见模型</text>

  <rect class="focus" x="65" y="91" width="590" height="104" rx="7"/>
  <text class="label" x="360" y="125">边界：push / pop</text>
  <text class="detail" x="360" y="155">栈顶 · 元素顺序 · 空 / 满 · 操作前后条件</text>
  <text class="detail" x="360" y="180">使用者只需掌握这些可见约定</text>

  <rect class="scope" x="45" y="221" width="630" height="159" rx="8"/>
  <text class="detail" x="360" y="248">隐藏的设计秘密：内部如何保存栈</text>
  <rect class="node" x="75" y="267" width="240" height="84" rx="6"/>
  <text class="label" x="195" y="299">方案 A：数组</text>
  <text class="detail" x="195" y="328">用游标标记栈顶</text>
  <text class="detail" x="360" y="314">或</text>
  <rect class="node" x="405" y="267" width="240" height="84" rx="6"/>
  <text class="label" x="525" y="299">方案 B：链表</text>
  <text class="detail" x="525" y="328">用引用指向栈顶</text>
  <text class="sub" x="65" y="405">笔记假设：替换内部选择，不改变已承诺的行为与质量。</text>
</svg>
