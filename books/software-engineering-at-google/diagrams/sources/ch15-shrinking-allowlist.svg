<svg xmlns="http://www.w3.org/2000/svg" width="720" height="424" viewBox="0 0 720 424" role="img" aria-labelledby="title desc">
  <title id="title">迁移以后收缩旧目标的可见性允许列表</title>
  <desc id="desc">从左向右读两个阶段。起初 A、B、C 都获准依赖旧构建目标。A 迁移以后，允许列表移除 A，只保留 B、C；A 若重新添加旧依赖，构建检查会拒绝。实线表示获准依赖，打叉虚线表示不再允许的旧依赖。允许列表是许可范围，不证明仍有活跃调用。</desc>
  <!-- Original editable hand-written SVG; the web export is an identical copy. -->
  <style>
    :root { color-scheme: light dark; --bg: #fcfbf8; --text: #292824; --muted: #655f55; --line: #81786a; --box: #efede7; --focus: #f3e9d9; --accent: #9a4d32; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; } }
    :root[data-theme='dark'] { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; }
    text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .heading { font-size: 22px; font-weight: 600; }
    .sub { font-size: 15px; fill: var(--muted); }
    .stage { font-size: 17px; font-weight: 600; text-anchor: middle; }
    .label { font-size: 18px; text-anchor: middle; }
    .note { font-size: 14px; fill: var(--muted); text-anchor: middle; }
    .panel { fill: none; stroke: var(--line); stroke-width: 1; }
    .node { fill: var(--box); stroke: var(--line); stroke-width: 1.2; }
    .target { fill: var(--focus); stroke: var(--accent); stroke-width: 1.3; }
    .edge { fill: none; stroke: var(--line); stroke-width: 1.7; marker-end: url(#arrow); }
    .blocked { fill: none; stroke: var(--line); stroke-width: 1.6; stroke-dasharray: 5 4; }
  </style>
  <!-- Image mode inherits the page's color scheme; standalone mode reads its saved choice. -->
  <script><![CDATA[
    try {
      const theme = localStorage.getItem('reading-notes-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch {}
  ]]></script>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--line)"/></marker></defs>
  <rect width="720" height="424" rx="10" fill="var(--bg)"/>
  <text class="heading" x="24" y="38">迁走一个，就收回一个接入许可</text>
  <text class="sub" x="24" y="66">构建可见性控制：让已经迁走的调用方无法悄悄回到旧目标</text>
  <rect class="panel" x="24" y="94" width="312" height="292" rx="8"/>
  <text class="stage" x="180" y="125">阶段一：保留既有调用方</text>
  <rect class="node" x="48" y="165" width="64" height="40" rx="5"/>
  <rect class="node" x="148" y="165" width="64" height="40" rx="5"/>
  <rect class="node" x="248" y="165" width="64" height="40" rx="5"/>
  <text class="label" x="80" y="191">A</text>
  <text class="label" x="180" y="191">B</text>
  <text class="label" x="280" y="191">C</text>
  <path class="edge" d="M80 205V223H130V240"/>
  <path class="edge" d="M180 205V240"/>
  <path class="edge" d="M280 205V223H230V240"/>
  <rect class="target" x="102" y="248" width="156" height="52" rx="6"/>
  <text class="label" x="180" y="280">旧构建目标</text>
  <text class="stage" x="180" y="337">允许列表：A、B、C</text>
  <text class="note" x="180" y="365">为已有使用保留过渡通道</text>
  <path class="edge" d="M345 246H375"/>
  <rect class="panel" x="384" y="94" width="312" height="292" rx="8"/>
  <text class="stage" x="540" y="125">阶段二：A 迁移后移除许可</text>
  <text class="note" x="440" y="154">已迁走</text>
  <rect class="node" x="408" y="165" width="64" height="40" rx="5"/>
  <rect class="node" x="508" y="165" width="64" height="40" rx="5"/>
  <rect class="node" x="608" y="165" width="64" height="40" rx="5"/>
  <text class="label" x="440" y="191">A</text>
  <text class="label" x="540" y="191">B</text>
  <text class="label" x="640" y="191">C</text>
  <path class="blocked" d="M440 205V223H490V240"/>
  <path d="m461 216 14 14m0-14-14 14" fill="none" stroke="var(--accent)" stroke-width="2.6"/>
  <path class="edge" d="M540 205V240"/>
  <path class="edge" d="M640 205V223H590V240"/>
  <rect class="target" x="462" y="248" width="156" height="52" rx="6"/>
  <text class="label" x="540" y="280">旧构建目标</text>
  <text class="stage" x="540" y="337">允许列表：B、C</text>
  <text class="note" x="540" y="365">A 再次添加旧依赖 → 构建拒绝</text>
  <text class="sub" x="24" y="412">实线：获准依赖　　打叉虚线：已不允许的旧依赖</text>
</svg>
