<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-labelledby="title desc">
  <title id="title">先清理已有实例，再启用编译错误</title>
  <desc id="desc">上方从左向右依次为全库发现已有问题、生成并验证修复、提交清理建立新基线、启用编译错误。下方表示规则启用后的持续约束：新增同类问题会导致编译失败，需要修改后重试。箭头表示阶段推进或反馈关系。</desc>
  <!-- Original editable hand-written SVG; web export is an identical copy. -->
  <style>
    :root { color-scheme: light dark; --bg: #fcfbf8; --text: #292824; --muted: #655f55; --line: #81786a; --box: #efede7; --focus: #f3e9d9; --accent: #9a4d32; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; } }
    :root[data-theme='dark'] { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; }
    text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .heading { font-size: 22px; font-weight: 600; }
    .sub { font-size: 15px; fill: var(--muted); }
    .label { font-size: 18px; font-weight: 600; text-anchor: middle; }
    .body { font-size: 15px; text-anchor: middle; }
    .node { fill: var(--box); stroke: var(--line); stroke-width: 1.3; }
    .focus { fill: var(--focus); stroke: var(--accent); stroke-width: 1.3; }
    .flow { fill: none; stroke: var(--line); stroke-width: 1.8; marker-end: url(#arrow); }
    .link { fill: none; stroke: var(--accent); stroke-width: 1.8; marker-end: url(#accent-arrow); }
  </style>
  <script><![CDATA[
    try {
      const theme = localStorage.getItem('reading-notes-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch {}
  ]]></script>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--line)"/></marker>
    <marker id="accent-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--accent)"/></marker>
  </defs>
  <rect width="720" height="350" rx="10" fill="var(--bg)"/>
  <text class="heading" x="24" y="38">先承担迁移成本，再维持新的基线</text>
  <text class="sub" x="24" y="68">上方：规则上线过程　　下方：启用后的持续约束</text>
  <rect class="node" x="24" y="103" width="140" height="100" rx="7"/>
  <text class="label" x="94" y="139">发现旧实例</text>
  <text class="body" x="94" y="176">全库批量分析</text>
  <rect class="node" x="200" y="103" width="140" height="100" rx="7"/>
  <text class="label" x="270" y="139">生成并验证</text>
  <text class="body" x="270" y="176">修复补丁 + 测试</text>
  <rect class="node" x="376" y="103" width="140" height="100" rx="7"/>
  <text class="label" x="446" y="139">提交清理</text>
  <text class="body" x="446" y="176">建立干净基线</text>
  <rect class="focus" x="552" y="103" width="140" height="100" rx="7"/>
  <text class="label" x="622" y="139">启用编译错误</text>
  <text class="body" x="622" y="176">不再接受新实例</text>
  <path class="flow" d="M164 153H191"/>
  <path class="flow" d="M340 153H367"/>
  <path class="flow" d="M516 153H543"/>
  <rect class="node" x="24" y="255" width="270" height="62" rx="7"/>
  <text class="label" x="159" y="292">后续新增同类问题</text>
  <rect class="focus" x="376" y="255" width="316" height="62" rx="7"/>
  <text class="label" x="534" y="292">编译失败 → 修改后重试</text>
  <path class="flow" d="M294 286H367"/>
  <path class="link" d="M622 203V246"/>
</svg>
