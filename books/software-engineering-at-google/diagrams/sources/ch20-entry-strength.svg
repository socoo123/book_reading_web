<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">四个分析入口的强制程度与对检查的要求</title>
  <desc id="desc">从左到右依次是编辑器、代码评审、提交前检查和编译器，强制程度逐渐增强。编辑器就地提示，通常要在 1 秒内返回，还要容忍未写完的代码；代码评审是书中的公共主入口，给出建议，作者可以解释后不改，分析可以等几分钟，新检查的有效误报要低于 10%；提交前检查阻止提交，在发送评审与提交时运行，失败要让修改者能够解决；编译器让构建直接失败，在本地构建时运行，不容有效误报。越往右越难绕过，误判与含糊消息造成的阻塞也越直接。虚线框中的全库浏览另成一类，供安全团队和准备清理的人查看全部已有实例。</desc>
  <!-- Original editable hand-written SVG; web export is an identical copy. -->
  <style>
    :root { color-scheme: light dark; --bg: #fcfbf8; --text: #292824; --muted: #655f55; --line: #81786a; --box: #efede7; --focus: #f3e9d9; --accent: #9a4d32; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; } }
    :root[data-theme='dark'] { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; }
    text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .heading { font-size: 22px; font-weight: 600; }
    .sub { font-size: 15px; fill: var(--muted); }
    .label { font-size: 18px; font-weight: 600; text-anchor: middle; }
    .body { font-size: 15px; text-anchor: middle; }
    .note { font-size: 14px; fill: var(--muted); text-anchor: middle; }
    .node { fill: var(--box); stroke: var(--line); stroke-width: 1.3; }
    .focus { fill: var(--focus); stroke: var(--accent); stroke-width: 1.4; }
    .aside { fill: none; stroke: var(--line); stroke-width: 1.3; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: var(--line); stroke-width: 1.8; marker-end: url(#arrow); }
    .divider { stroke: var(--line); stroke-width: 1; }
  </style>
  <script><![CDATA[
    try {
      const theme = localStorage.getItem('reading-notes-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch {}
  ]]></script>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--line)"/></marker></defs>
  <rect width="720" height="400" rx="10" fill="var(--bg)"/>
  <text class="heading" x="28" y="40">越难绕过的入口，对检查的要求越高</text>
  <text class="sub" x="28" y="69">每格依次是：发现问题后怎样、何时运行、对检查的要求</text>

  <rect class="node" x="28" y="106" width="154" height="150" rx="7"/>
  <text class="label" x="105" y="136">编辑器</text>
  <path class="divider" d="M44 150H166"/>
  <text class="body" x="105" y="178">就地提示</text>
  <text class="body" x="105" y="206">通常 1 秒内</text>
  <text class="body" x="105" y="234">要容忍未写完的代码</text>

  <text class="note" x="275" y="96">书中的公共主入口</text>
  <rect class="focus" x="198" y="106" width="154" height="150" rx="7"/>
  <text class="label" x="275" y="136">代码评审</text>
  <path class="divider" d="M214 150H336"/>
  <text class="body" x="275" y="178">建议，可解释后不改</text>
  <text class="body" x="275" y="206">可等几分钟</text>
  <text class="body" x="275" y="234">有效误报 &lt; 10%</text>

  <rect class="node" x="368" y="106" width="154" height="150" rx="7"/>
  <text class="label" x="445" y="136">提交前检查</text>
  <path class="divider" d="M384 150H506"/>
  <text class="body" x="445" y="178">阻止提交</text>
  <text class="body" x="445" y="206">发送评审与提交时</text>
  <text class="body" x="445" y="234">失败要让人能解决</text>

  <rect class="node" x="538" y="106" width="154" height="150" rx="7"/>
  <text class="label" x="615" y="136">编译器</text>
  <path class="divider" d="M554 150H676"/>
  <text class="body" x="615" y="178">构建直接失败</text>
  <text class="body" x="615" y="206">本地构建时</text>
  <text class="body" x="615" y="234">不容有效误报</text>

  <path class="flow" d="M28 284H684"/>
  <text class="note" x="360" y="310">越往右越难绕过，误判与含糊消息造成的阻塞也越直接</text>

  <rect class="aside" x="28" y="330" width="664" height="46" rx="7"/>
  <text class="body" x="360" y="359">全库浏览另成一类：供安全团队和准备清理的人查看全部已有实例</text>
</svg>
