<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">共同迁移规则，独立执行分片</title>
  <desc id="desc">一套可重跑的迁移规则生成分片 A 和分片 B。两片各自经过测试以及评审与提交，不要求彼此同时进入主干。若发生失败或冲突，可以在新基线上重新生成受影响分片；前提是分片独立或者依赖已经通过兼容层处理。</desc>
  <!-- Original editable hand-written SVG; web export is an identical copy. -->
  <style>
    :root { color-scheme: light dark; --bg: #fcfbf8; --text: #292824; --muted: #655f55; --line: #81786a; --box: #efede7; --focus: #f3e9d9; --accent: #9a4d32; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; } }
    :root[data-theme='dark'] { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; }
    text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .heading { font-size: 22px; font-weight: 600; }
    .sub { font-size: 15px; fill: var(--muted); }
    .label { font-size: 18px; font-weight: 600; text-anchor: middle; }
    .body { font-size: 16px; text-anchor: middle; }
    .note { font-size: 14px; fill: var(--muted); text-anchor: middle; }
    .node { fill: var(--box); stroke: var(--line); stroke-width: 1.3; }
    .focus { fill: var(--focus); stroke: var(--accent); stroke-width: 1.4; }
    .flow { fill: none; stroke: var(--line); stroke-width: 1.8; marker-end: url(#arrow); }
    .divider { stroke: var(--line); stroke-width: 1; stroke-dasharray: 4 4; }
  </style>
  <script><![CDATA[
    try {
      const theme = localStorage.getItem('reading-notes-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch {}
  ]]></script>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--line)"/></marker></defs>
  <rect width="720" height="400" rx="10" fill="var(--bg)"/>
  <text class="heading" x="28" y="40">整体有共同目标，每片有独立的落地路径</text>
  <text class="sub" x="28" y="69">前提：分片独立，或跨片依赖已由兼容桥处理</text>
  <rect class="focus" x="28" y="114" width="144" height="162" rx="7"/>
  <text class="label" x="100" y="162">可重跑规则</text>
  <text class="body" x="100" y="192">生成目标修改</text>
  <text class="note" x="100" y="222">按项目与所有权</text>
  <text class="note" x="100" y="244">划分提交边界</text>
  <rect class="node" x="218" y="112" width="126" height="72" rx="7"/>
  <text class="label" x="281" y="154">分片 A</text>
  <rect class="node" x="392" y="112" width="126" height="72" rx="7"/>
  <text class="body" x="455" y="154">测试 A</text>
  <rect class="node" x="566" y="112" width="126" height="72" rx="7"/>
  <text class="body" x="629" y="142">评审 A</text>
  <text class="body" x="629" y="167">提交 A</text>
  <rect class="node" x="218" y="232" width="126" height="72" rx="7"/>
  <text class="label" x="281" y="274">分片 B</text>
  <rect class="node" x="392" y="232" width="126" height="72" rx="7"/>
  <text class="body" x="455" y="274">测试 B</text>
  <rect class="node" x="566" y="232" width="126" height="72" rx="7"/>
  <text class="body" x="629" y="262">评审 B</text>
  <text class="body" x="629" y="287">提交 B</text>
  <path class="flow" d="M172 170H195V148H209"/>
  <path class="flow" d="M172 220H195V268H209"/>
  <path class="flow" d="M344 148H383"/>
  <path class="flow" d="M518 148H557"/>
  <path class="flow" d="M344 268H383"/>
  <path class="flow" d="M518 268H557"/>
  <path class="divider" d="M218 208H692"/>
  <text class="sub" x="28" y="349">失败或冲突：调查原因，在新基线上重生成受影响分片</text>
  <text class="sub" x="28" y="378">不必为普通局部冲突保住一份手工补丁，也不必等待所有分片一起完成</text>
</svg>
