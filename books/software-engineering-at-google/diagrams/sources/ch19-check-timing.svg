<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">两类自动检查在评审流程中的位置</title>
  <desc id="desc">中间一行是评审流程：上传快照、发起评审、评论与修改、发起提交。上方的分析器（如 Tricorder）在首个快照和之后每个新快照上传时运行，结果显示在状态标签与 diff 中，供作者当场处理，用虚线表示。下方的 presubmit 在请求评审和提交时运行，包括项目测试、局部约定检查和添加知会列表；失败则不能发出评审或不能提交，用实线表示。评审者认为某条分析发现必须处理时，可用 Please fix 把它转成未解决评论。</desc>
  <!-- Original editable hand-written SVG; web export is an identical copy. -->
  <style>
    :root { color-scheme: light dark; --bg: #fcfbf8; --text: #292824; --muted: #655f55; --line: #81786a; --box: #efede7; --focus: #f3e9d9; --accent: #9a4d32; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; } }
    :root[data-theme='dark'] { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; }
    text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .heading { font-size: 22px; font-weight: 600; }
    .sub { font-size: 15px; fill: var(--muted); }
    .label { font-size: 17px; font-weight: 600; text-anchor: middle; }
    .body { font-size: 16px; text-anchor: middle; }
    .note { font-size: 14px; fill: var(--muted); }
    .end { text-anchor: end; }
    .node { fill: var(--box); stroke: var(--line); stroke-width: 1.3; }
    .clue { fill: var(--box); stroke: var(--line); stroke-width: 1.4; stroke-dasharray: 6 4; }
    .gate { fill: var(--focus); stroke: var(--accent); stroke-width: 1.4; }
    .flow { fill: none; stroke: var(--line); stroke-width: 1.8; marker-end: url(#arrow); }
    .dashed { stroke-dasharray: 5 5; }
  </style>
  <script><![CDATA[
    try {
      const theme = localStorage.getItem('reading-notes-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch {}
  ]]></script>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--line)"/></marker></defs>
  <rect width="720" height="440" rx="10" fill="var(--bg)"/>
  <text class="heading" x="28" y="40">分析器随快照运行，presubmit 把守两道关口</text>
  <text class="sub" x="28" y="69">中间一行为评审流程；上方虚线：结果供作者处理；下方实线：失败即停在这一步</text>
  <rect class="clue" x="28" y="90" width="486" height="64" rx="7"/>
  <text class="label" x="271" y="117">分析器（如 Tricorder）：每次上传快照都运行</text>
  <text class="body" x="271" y="142">结果显示在状态标签与 diff 中，作者当场处理</text>
  <path class="flow dashed" d="M93 158V194"/>
  <text class="note" x="103" y="181">首个快照</text>
  <path class="flow dashed" d="M449 158V194"/>
  <text class="note" x="459" y="181">每个新快照</text>
  <rect class="node" x="28" y="204" width="130" height="66" rx="7"/>
  <text class="label" x="93" y="231">1　上传快照</text>
  <text class="body" x="93" y="256">作者自查 diff</text>
  <path class="flow" d="M162 237H196"/>
  <rect class="node" x="206" y="204" width="130" height="66" rx="7"/>
  <text class="label" x="271" y="231">2　发起评审</text>
  <text class="body" x="271" y="256">选定评审者</text>
  <path class="flow" d="M340 237H374"/>
  <rect class="node" x="384" y="204" width="130" height="66" rx="7"/>
  <text class="label" x="449" y="231">3　评论与修改</text>
  <text class="body" x="449" y="256">可往返多轮</text>
  <path class="flow" d="M518 237H552"/>
  <rect class="node" x="562" y="204" width="130" height="66" rx="7"/>
  <text class="label" x="627" y="231">4　发起提交</text>
  <text class="body" x="627" y="256">评审条件齐备后</text>
  <path class="flow" d="M271 314V280"/>
  <text class="note end" x="261" y="302">失败则不能发出评审</text>
  <path class="flow" d="M627 314V280"/>
  <text class="note end" x="617" y="302">失败则不能提交</text>
  <rect class="gate" x="206" y="318" width="486" height="64" rx="7"/>
  <text class="label" x="449" y="345">presubmit：请求评审与提交时运行</text>
  <text class="body" x="449" y="370">运行项目测试、检查局部约定、添加知会列表</text>
  <text class="note" x="28" y="416">分析发现本身是线索；评审者认为必须处理时，可用 Please fix 把它转成未解决评论</text>
</svg>
