<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-labelledby="title desc">
  <title id="title">先取得下游证据，再推进共同版本</title>
  <desc id="desc">待提交的上游改动进入专用测试环境，替换候选依赖后运行可见下游测试。通过的证据支持提交；发现失败时先修复下游或提供迁移工具，再重新验证。实线表示验证前进，虚线表示迁移重试。证据仅覆盖实际运行的用法，不证明未知或闭源用户全部安全。</desc>
  <!-- Original editable hand-written SVG; web export is an identical copy. -->
  <style>
    :root { color-scheme: light dark; --bg: #fcfbf8; --text: #292824; --muted: #655f55; --line: #81786a; --box: #efede7; --focus: #f3e9d9; --accent: #9a4d32; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; } }
    :root[data-theme='dark'] { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; }
    text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .heading { font-size: 22px; font-weight: 600; }
    .sub { font-size: 15px; fill: var(--muted); }
    .label { font-size: 18px; font-weight: 600; text-anchor: middle; }
    .body { font-size: 15px; text-anchor: middle; }
    .node { fill: var(--box); stroke: var(--line); stroke-width: 1.3; }
    .evidence { fill: var(--focus); stroke: var(--accent); stroke-width: 1.3; }
    .flow { fill: none; stroke: var(--line); stroke-width: 1.8; marker-end: url(#arrow); }
    .retry { fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-dasharray: 7 5; marker-end: url(#retry-arrow); }
    .retry-label { fill: var(--accent); font-size: 16px; }
  </style>
  <script><![CDATA[
    try {
      const theme = localStorage.getItem('reading-notes-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch {}
  ]]></script>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--line)"/></marker>
    <marker id="retry-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--accent)"/></marker>
  </defs>
  <rect width="720" height="390" rx="10" fill="var(--bg)"/>
  <text class="heading" x="28" y="40">先取得下游证据，再推进共同版本</text>
  <text class="sub" x="28" y="69">实线：验证前进；虚线：发现失败后迁移并重试</text>
  <rect class="node" x="28" y="111" width="180" height="104" rx="7"/>
  <text class="label" x="118" y="145">候选上游改动</text>
  <text class="body" x="118" y="175">待提交的版本</text>
  <text class="body" x="118" y="199">不是直接上线</text>
  <path class="flow" d="M208 163H250"/>
  <rect class="evidence" x="260" y="111" width="200" height="104" rx="7"/>
  <text class="label" x="360" y="145">CI 取得用法证据</text>
  <text class="body" x="360" y="175">替换候选依赖</text>
  <text class="body" x="360" y="199">运行可见下游测试</text>
  <path class="flow" d="M460 163H510"/>
  <rect class="node" x="520" y="111" width="172" height="104" rx="7"/>
  <text class="label" x="606" y="145">通过：支持提交</text>
  <text class="body" x="606" y="175">推进共同版本</text>
  <text class="body" x="606" y="199">记录已验证的范围</text>
  <path class="retry" d="M360 215V279H118V225"/>
  <text class="retry-label" x="384" y="251">失败：先修复下游</text>
  <text class="retry-label" x="384" y="279">或提供迁移工具</text>
  <text class="sub" x="28" y="334">前提：能找到下游 · 有可运行测试 · 有迁移责任与资源</text>
  <text class="sub" x="28" y="365">证据边界：仅覆盖已运行用法，未知和闭源用户仍有缺口</text>
</svg>
