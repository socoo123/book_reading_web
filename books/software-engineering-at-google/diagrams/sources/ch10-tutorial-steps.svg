<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" role="img" aria-labelledby="title desc">
  <title id="title">教程改写前后的步骤编号</title>
  <desc id="desc">原书教程示例改写前后对照，第 1、2 步（下载包、复制脚本）两版相同。改写前共 7 步：第 3 步执行脚本，第 4、5 步是系统自动与认证服务通信、初始化数据库 baz，第 6、7 步“执行 SQL 测试”和“输入这条 SQL”其实是同一个动作。改写后共 4 步：系统的自动过程并入第 3 步的说明，原第 6、7 步合成第 4 步，输入内容单独成行。实线框是用户要做的动作，虚线框和虚线箭头是系统自动发生的事。</desc>
  <!-- Original editable hand-written SVG; web export is an identical copy. -->
  <style>
    :root { color-scheme: light dark; --bg: #fcfbf8; --text: #292824; --muted: #655f55; --line: #81786a; --box: #efede7; --focus: #f3e9d9; --accent: #9a4d32; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; } }
    :root[data-theme='dark'] { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; }
    text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .heading { font-size: 22px; font-weight: 600; }
    .sub { font-size: 15px; fill: var(--muted); }
    .label { font-size: 18px; font-weight: 600; text-anchor: middle; }
    .row { font-size: 16px; }
    .num { font-weight: 700; }
    .body { font-size: 16px; text-anchor: middle; }
    .muted { font-size: 16px; fill: var(--muted); }
    .note { font-size: 14px; fill: var(--muted); text-anchor: middle; }
    .node { fill: var(--box); stroke: var(--line); stroke-width: 1.3; }
    .focus { fill: var(--focus); stroke: var(--accent); stroke-width: 1.4; }
    .auto { fill: var(--bg); stroke: var(--line); stroke-width: 1.3; stroke-dasharray: 5 5; }
    .flow { fill: none; stroke: var(--line); stroke-width: 1.8; marker-end: url(#arrow); }
    .dashed { stroke-dasharray: 5 5; }
  </style>
  <script><![CDATA[
    try {
      const theme = localStorage.getItem('reading-notes-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch {}
  ]]></script>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--line)"/></marker></defs>
  <rect width="720" height="430" rx="10" fill="var(--bg)"/>
  <text class="heading" x="28" y="40">让每个编号对应一次用户动作</text>
  <text class="sub" x="28" y="69">原书教程示例改写前后；第 1、2 步（下载包、复制脚本）两版相同</text>

  <text class="label" x="158" y="112">改写前：共 7 步</text>
  <text class="label" x="556" y="112">改写后：共 4 步</text>

  <rect class="node" x="28" y="130" width="260" height="40" rx="6"/>
  <text class="row" x="44" y="156"><tspan class="num">3</tspan>　执行脚本</text>
  <rect class="auto" x="28" y="180" width="260" height="40" rx="6"/>
  <text class="row" x="44" y="206"><tspan class="num">4</tspan>　系统与认证服务通信</text>
  <rect class="auto" x="28" y="230" width="260" height="40" rx="6"/>
  <text class="row" x="44" y="256"><tspan class="num">5</tspan>　系统初始化数据库 baz</text>
  <rect class="node" x="28" y="280" width="260" height="40" rx="6"/>
  <text class="row" x="44" y="306"><tspan class="num">6</tspan>　执行 SQL 测试 baz</text>
  <rect class="node" x="28" y="330" width="260" height="40" rx="6"/>
  <text class="row" x="44" y="356"><tspan class="num">7</tspan>　输入这条 SQL</text>

  <rect class="focus" x="420" y="130" width="272" height="140" rx="7"/>
  <text class="row" x="436" y="156"><tspan class="num">3</tspan>　在主目录执行脚本</text>
  <rect class="auto" x="436" y="176" width="240" height="84" rx="6"/>
  <text class="body" x="556" y="210">随后系统自动认证，</text>
  <text class="body" x="556" y="238">初始化 baz、打开输入 shell</text>
  <rect class="focus" x="420" y="280" width="272" height="90" rx="7"/>
  <text class="row" x="436" y="314"><tspan class="num">4</tspan>　执行 SQL 测试 baz</text>
  <text class="muted" x="436" y="348">输入内容单独成行</text>

  <path class="flow" d="M288 150H412"/>
  <path class="flow dashed" d="M288 200H428"/>
  <path class="flow dashed" d="M288 250H428"/>
  <text class="note" x="354" y="230">并入第 3 步说明</text>
  <path class="flow" d="M288 300H412"/>
  <path class="flow" d="M288 350H412"/>
  <text class="note" x="354" y="330">同一动作</text>

  <text class="note" x="360" y="406">实线框：用户要做的动作　　虚线框、虚线箭头：系统自动发生的事</text>
</svg>
