<svg xmlns="http://www.w3.org/2000/svg" width="720" height="418" viewBox="0 0 720 418" role="img" aria-labelledby="title desc">
  <title id="title">从真实交互录制到快速回放</title>
  <desc id="desc">上行是提交后的录制测试：被测客户端经过录制代理调用真实服务，并接收响应；测试通过后保存流量记录。下行是开发与提交前的回放测试：匹配器读取记录，按当前请求返回记录响应，不启动真实依赖。请求不能匹配时，需要重新录制。</desc>
  <!-- Original editable hand-written SVG; the web export is an identical copy. -->
  <style>
    :root { color-scheme: light dark; --bg: #fcfbf8; --text: #292824; --muted: #655f55; --line: #81786a; --box: #efede7; --focus: #f3e9d9; --accent: #9a4d32; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; } }
    :root[data-theme='dark'] { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; }
    text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .heading { font-size: 22px; font-weight: 600; }
    .sub { font-size: 15px; fill: var(--muted); }
    .label { font-size: 18px; font-weight: 600; text-anchor: middle; }
    .body { font-size: 16px; text-anchor: middle; }
    .node { fill: var(--box); stroke: var(--line); stroke-width: 1.2; }
    .focus { fill: var(--focus); stroke: var(--accent); stroke-width: 1.4; }
    .arrow { fill: none; stroke: var(--line); stroke-width: 1.8; marker-end: url(#arrow); }
    .call { fill: none; stroke: var(--line); stroke-width: 1.8; marker-start: url(#arrow); marker-end: url(#arrow); }
  </style>
  <!-- Image mode inherits the page's color scheme; standalone mode reads its saved choice. -->
  <script><![CDATA[
    try {
      const theme = localStorage.getItem('reading-notes-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch {}
  ]]></script>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8Z" fill="var(--line)"/></marker></defs>
  <rect width="720" height="418" rx="10" fill="var(--bg)"/>
  <text class="heading" x="28" y="39">较大测试记录真实交互，较小测试复用</text>
  <text class="sub" x="28" y="67">横向双箭头：请求与响应　　向下箭头：保存或读取流量记录</text>
  <text class="label" x="65" y="130">录制</text>
  <text class="sub" x="36" y="155">提交后</text>
  <rect class="node" x="120" y="99" width="150" height="76" rx="7"/>
  <text class="label" x="195" y="144">被测客户端</text>
  <path class="call" d="M280 137H320"/>
  <rect class="focus" x="330" y="99" width="150" height="76" rx="7"/>
  <text class="label" x="405" y="144">录制代理</text>
  <path class="call" d="M490 137H530"/>
  <rect class="node" x="540" y="99" width="152" height="76" rx="7"/>
  <text class="label" x="616" y="144">真实服务</text>
  <path class="arrow" d="M405 175V208"/>
  <rect class="focus" x="330" y="216" width="150" height="55" rx="7"/>
  <text class="body" x="405" y="250">流量记录</text>
  <text class="sub" x="491" y="245">测试通过后才生成／更新</text>
  <path class="arrow" d="M405 271V305"/>
  <text class="label" x="65" y="340">回放</text>
  <text class="sub" x="28" y="365">开发／提交前</text>
  <rect class="node" x="120" y="313" width="150" height="76" rx="7"/>
  <text class="label" x="195" y="358">被测客户端</text>
  <path class="call" d="M280 351H320"/>
  <rect class="focus" x="330" y="313" width="150" height="76" rx="7"/>
  <text class="label" x="405" y="358">回放匹配器</text>
  <text class="sub" x="505" y="337">不启动真实依赖</text>
  <text class="sub" x="505" y="362">请求未匹配时重新录制</text>
  <text class="sub" x="28" y="409">回放提供快速反馈；持续录制维持样本与真实行为的联系。</text>
</svg>
