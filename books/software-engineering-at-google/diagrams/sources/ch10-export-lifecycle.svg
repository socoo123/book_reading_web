<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">一次导出请求经历的阶段</title>
  <desc id="desc">假设导出服务的概念说明，从左往右：调用者提交带结算日的请求；快照就绪时创建任务、返回任务 ID，表示已受理；工作进程生成文件期间，调用者只能查询状态，还不能下载；文件就绪后状态变为完成，调用者才能下载。快照未就绪时返回错误，不创建任务。实线为正常路径，虚线为快照未就绪时的分支。</desc>
  <!-- Original editable hand-written SVG; web export is an identical copy. -->
  <style>
    :root { color-scheme: light dark; --bg: #fcfbf8; --text: #292824; --muted: #655f55; --line: #81786a; --box: #efede7; --focus: #f3e9d9; --accent: #9a4d32; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; } }
    :root[data-theme='dark'] { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; }
    text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .heading { font-size: 22px; font-weight: 600; }
    .sub { font-size: 15px; fill: var(--muted); }
    .label { font-size: 18px; font-weight: 600; text-anchor: middle; }
    .body { font-size: 16px; text-anchor: middle; }
    .note { font-size: 14px; fill: var(--muted); text-anchor: middle; }
    .note-start { font-size: 14px; fill: var(--muted); }
    .node { fill: var(--box); stroke: var(--line); stroke-width: 1.3; }
    .focus { fill: var(--focus); stroke: var(--accent); stroke-width: 1.4; }
    .flow { fill: none; stroke: var(--line); stroke-width: 1.8; marker-end: url(#arrow); }
    .branch { stroke-dasharray: 5 5; }
    .bracket { fill: none; stroke: var(--line); stroke-width: 1.3; }
  </style>
  <script><![CDATA[
    try {
      const theme = localStorage.getItem('reading-notes-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch {}
  ]]></script>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--line)"/></marker></defs>
  <rect width="720" height="400" rx="10" fill="var(--bg)"/>
  <text class="heading" x="28" y="40">“已受理”和“文件就绪”是两个阶段</text>
  <text class="sub" x="28" y="69">假设导出服务的概念说明：从左往右是一次导出请求经历的阶段</text>

  <rect class="node" x="28" y="118" width="132" height="78" rx="7"/>
  <text class="label" x="94" y="150">提交请求</text>
  <text class="body" x="94" y="178">附结算日</text>
  <path class="flow" d="M160 157H196"/>
  <text class="note" x="182" y="106">快照就绪</text>
  <rect class="focus" x="204" y="118" width="140" height="78" rx="7"/>
  <text class="label" x="274" y="150">任务已受理</text>
  <text class="body" x="274" y="178">返回任务 ID</text>
  <path class="flow" d="M344 157H380"/>
  <rect class="node" x="388" y="118" width="132" height="78" rx="7"/>
  <text class="label" x="454" y="150">生成文件</text>
  <text class="body" x="454" y="178">状态：生成中</text>
  <path class="flow" d="M520 157H556"/>
  <rect class="focus" x="564" y="118" width="128" height="78" rx="7"/>
  <text class="label" x="628" y="150">文件就绪</text>
  <text class="body" x="628" y="178">状态：完成</text>

  <path class="bracket" d="M344 206V216H564V206"/>
  <text class="note" x="454" y="240">这段时间只能查询状态，还不能下载</text>

  <path class="flow branch" d="M94 196V254"/>
  <text class="note-start" x="106" y="231">快照未就绪</text>
  <rect class="node branch" x="28" y="262" width="180" height="78" rx="7"/>
  <text class="label" x="118" y="294">返回错误</text>
  <text class="body" x="118" y="322">不创建任务</text>

  <path class="flow" d="M628 196V254"/>
  <rect class="node" x="564" y="262" width="128" height="78" rx="7"/>
  <text class="label" x="628" y="294">下载文件</text>
  <text class="body" x="628" y="322">此时才能取到</text>

  <text class="note" x="360" y="380">实线：正常路径　　虚线：快照未就绪时的分支</text>
</svg>
