<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
  <title id="title">批处理借用可回收的在线余量</title>
  <desc id="desc">假设总容量为一百，在线服务始终预留一百。平时在线实际使用三十，批处理借七十；在线突发到八十时，收回五十供在线使用，批处理保留二十。条形宽度表示实际占用，数字是解释用的假设。</desc>
  <!-- Original editable hand-written SVG; web export is an identical copy. -->
  <style>
    :root { color-scheme: light dark; --bg: #fcfbf8; --text: #292824; --muted: #655f55; --line: #81786a; --box: #efede7; --focus: #f3e9d9; --accent: #9a4d32; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; } }
    :root[data-theme='dark'] { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; }
    text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .heading { font-size: 22px; font-weight: 600; }
    .sub { font-size: 15px; fill: var(--muted); }
    .label { font-size: 17px; font-weight: 600; }
    .body { font-size: 17px; text-anchor: middle; }
    .note { font-size: 14px; fill: var(--muted); text-anchor: middle; }
    .batch { fill: var(--box); stroke: var(--line); stroke-width: 1.3; }
    .serving { fill: var(--focus); stroke: var(--accent); stroke-width: 1.4; }
    .flow { fill: none; stroke: var(--line); stroke-width: 1.8; marker-end: url(#arrow); }
  </style>
  <script><![CDATA[
    try {
      const theme = localStorage.getItem('reading-notes-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch {}
  ]]></script>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--line)"/></marker></defs>
  <rect width="720" height="380" rx="10" fill="var(--bg)"/>
  <text class="heading" x="28" y="40">借出空闲使用机会，不重复承诺容量</text>
  <text class="sub" x="28" y="69">假设总容量 100，只展示一种资源；柱条表示实际占用</text>
  <text class="label" x="28" y="112">平时：在线预留 100，实际只用 30</text>
  <rect class="serving" x="28" y="128" width="199.2" height="56"/>
  <rect class="batch" x="227.2" y="128" width="464.8" height="56"/>
  <text class="body" x="127.6" y="163">在线 30</text>
  <text class="body" x="459.6" y="163">可回收批处理 70</text>
  <path class="flow" d="M550 194V248"/>
  <text class="note" x="327" y="222">收回 50 单位资源，转供在线服务</text>
  <text class="label" x="28" y="242">突发：在线实际增到 80</text>
  <rect class="serving" x="28" y="258" width="531.2" height="56"/>
  <rect class="batch" x="559.2" y="258" width="132.8" height="56"/>
  <text class="body" x="293.6" y="293">在线 80</text>
  <text class="body" x="625.6" y="293">批处理 20</text>
  <text class="note" x="360" y="350">在线预留始终为 100；批处理必须承受暂停或实例终止</text>
</svg>
