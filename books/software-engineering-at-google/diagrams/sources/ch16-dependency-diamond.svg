<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">同名分叉把本可组合的依赖分成两套基础</title>
  <desc id="desc">左侧综合服务通过报表和计费模块分别依赖基础库 L 和未改名称的 L 分叉，虚线框表示同名但不保证兼容。右侧将修复纳入共同版本并完成迁移后，两条依赖路径到达同一基础库。所有箭头从使用者指向依赖。</desc>
  <!-- Original editable hand-written SVG; the web export is an identical copy. -->
  <style>
    :root { color-scheme: light dark; --bg: #fcfbf8; --text: #292824; --muted: #655f55; --line: #81786a; --box: #efede7; --focus: #f3e9d9; --accent: #9a4d32; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; } }
    :root[data-theme='dark'] { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; }
    text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .heading { font-size: 22px; font-weight: 600; }
    .sub { font-size: 15px; fill: var(--muted); }
    .panel { font-size: 17px; font-weight: 600; }
    .label { font-size: 16px; text-anchor: middle; }
    .note { font-size: 14px; fill: var(--muted); text-anchor: middle; }
    .node { fill: var(--box); stroke: var(--line); stroke-width: 1.3; }
    .focus { fill: var(--focus); stroke: var(--accent); stroke-width: 1.5; }
    .edge { fill: none; stroke: var(--line); stroke-width: 1.7; marker-end: url(#arrow); }
    .partition { fill: none; stroke: var(--accent); stroke-width: 1.4; stroke-dasharray: 6 5; }
  </style>
  <script><![CDATA[
    try {
      const theme = localStorage.getItem('reading-notes-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch {}
  ]]></script>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--line)"/></marker></defs>
  <rect width="720" height="440" rx="10" fill="var(--bg)"/>
  <text class="heading" x="28" y="39">依赖可以形成菱形，共同基础需要一致</text>
  <text class="sub" x="28" y="67">同一仓库中也可能存在同名分叉；箭头：使用者 → 依赖</text>
  <text class="panel" x="28" y="107">同名分叉：组合时出现分歧</text>
  <text class="panel" x="390" y="107">共同版本：修复并完成迁移</text>
  <path d="M360 91V382" stroke="var(--line)" stroke-opacity=".45"/>
  <rect class="node" x="113" y="127" width="132" height="48" rx="6"/>
  <text class="label" x="179" y="157">综合服务</text>
  <path class="edge" d="M149 175 105 213"/>
  <path class="edge" d="M209 175 253 213"/>
  <rect class="node" x="38" y="219" width="126" height="48" rx="6"/>
  <text class="label" x="101" y="249">报表</text>
  <rect class="node" x="194" y="219" width="126" height="48" rx="6"/>
  <text class="label" x="257" y="249">计费</text>
  <path class="edge" d="M101 267V308"/>
  <path class="edge" d="M257 267V308"/>
  <rect class="node" x="38" y="315" width="126" height="48" rx="6"/>
  <text class="label" x="101" y="345">基础库 L</text>
  <rect class="focus" x="194" y="315" width="126" height="48" rx="6"/>
  <text class="label" x="257" y="345">L 分叉</text>
  <rect class="partition" x="28" y="301" width="302" height="75" rx="8"/>
  <text class="note" x="179" y="397">相同名字，不保证兼容</text>
  <rect class="node" x="475" y="127" width="132" height="48" rx="6"/>
  <text class="label" x="541" y="157">综合服务</text>
  <path class="edge" d="M511 175 467 213"/>
  <path class="edge" d="M571 175 615 213"/>
  <rect class="node" x="400" y="219" width="126" height="48" rx="6"/>
  <text class="label" x="463" y="249">报表</text>
  <rect class="node" x="556" y="219" width="126" height="48" rx="6"/>
  <text class="label" x="619" y="249">计费</text>
  <path class="edge" d="M463 267 515 308"/>
  <path class="edge" d="M619 267 567 308"/>
  <rect class="focus" x="456" y="315" width="170" height="48" rx="6"/>
  <text class="label" x="541" y="345">共同基础库 L</text>
  <text class="note" x="541" y="397">两条路径使用同一版本</text>
  <text class="sub" x="28" y="427">假设例子：统一基础减少版本选择；组件行为仍需通过测试验证。</text>
</svg>
