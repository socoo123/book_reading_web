<svg xmlns="http://www.w3.org/2000/svg" width="720" height="424" viewBox="0 0 720 424" role="img" aria-labelledby="title desc">
  <title id="title">功能赶不上这一班，代价由谁承担</title>
  <desc id="desc">截止点到了，某个功能还没准备好，有三种处理。等下一班：本班准时出发，只有这个功能晚一班，这是多数情况下的选择。整班等它：挑入后重新构建与测试，所有就绪功能一起延后，发布工程师也要为此加班。匆忙带上：未成熟的功能直接到达用户，损害既有体验。按书中 Google Maps 的经验，发布足够频繁时，代价从上到下递增；下一班越近、越可信，第一种处理的代价越小。</desc>
  <style>
    :root { color-scheme: light dark; --bg: #fcfbf8; --text: #292824; --muted: #655f55; --line: #81786a; --box: #efede7; --focus: #f3e9d9; --accent: #9a4d32; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; } }
    :root[data-theme='dark'] { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; }
    text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .heading { font-size: 22px; font-weight: 600; }
    .sub { font-size: 15px; fill: var(--muted); }
    .label { font-size: 18px; font-weight: 600; text-anchor: middle; }
    .body { font-size: 16px; text-anchor: middle; }
    .note { font-size: 14px; fill: var(--muted); text-anchor: middle; }
    .node { fill: var(--box); stroke: var(--line); stroke-width: 1.3; }
    .focus { fill: var(--focus); stroke: var(--accent); stroke-width: 1.4; }
    .flow { fill: none; stroke: var(--line); stroke-width: 1.8; marker-end: url(#arrow); }
  </style>
  <script><![CDATA[
    try {
      const theme = localStorage.getItem('reading-notes-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch {}
  ]]></script>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--line)"/></marker></defs>
  <rect width="720" height="424" rx="10" fill="var(--bg)"/>
  <text class="heading" x="28" y="40">功能赶不上这一班，代价由谁承担</text>
  <text class="sub" x="28" y="69">书中 Google Maps 的经验：发布足够频繁时，三种处理的代价从上到下递增</text>
  <text class="note" x="104" y="104">怎样处理</text>
  <text class="note" x="358" y="104">直接后果</text>
  <text class="note" x="614" y="104">承担代价的是</text>

  <rect class="focus" x="28" y="118" width="152" height="72" rx="7"/>
  <text class="label" x="104" y="150">等下一班</text>
  <text class="note" x="104" y="175">多数情况的选择</text>
  <path class="flow" d="M186 154H218"/>
  <rect class="focus" x="228" y="118" width="260" height="72" rx="7"/>
  <text class="body" x="358" y="147">本班按时出发</text>
  <text class="body" x="358" y="174">这个功能晚一班</text>
  <path class="flow" d="M494 154H526"/>
  <rect class="focus" x="536" y="118" width="156" height="72" rx="7"/>
  <text class="body" x="614" y="160">只有这个功能</text>

  <rect class="node" x="28" y="206" width="152" height="72" rx="7"/>
  <text class="label" x="104" y="238">整班等它</text>
  <text class="note" x="104" y="263">为它推迟发布</text>
  <path class="flow" d="M186 242H218"/>
  <rect class="node" x="228" y="206" width="260" height="72" rx="7"/>
  <text class="body" x="358" y="235">挑入后重新构建与测试</text>
  <text class="body" x="358" y="262">所有就绪功能一起延后</text>
  <path class="flow" d="M494 242H526"/>
  <rect class="node" x="536" y="206" width="156" height="72" rx="7"/>
  <text class="body" x="614" y="235">所有就绪功能</text>
  <text class="body" x="614" y="262">和发布工程师</text>

  <rect class="node" x="28" y="294" width="152" height="72" rx="7"/>
  <text class="label" x="104" y="326">匆忙带上</text>
  <text class="note" x="104" y="351">没准备好也上车</text>
  <path class="flow" d="M186 330H218"/>
  <rect class="node" x="228" y="294" width="260" height="72" rx="7"/>
  <text class="body" x="358" y="323">未成熟的功能</text>
  <text class="body" x="358" y="350">直接到达用户</text>
  <path class="flow" d="M494 330H526"/>
  <rect class="node" x="536" y="294" width="156" height="72" rx="7"/>
  <text class="body" x="614" y="336">用户的既有体验</text>

  <text class="note" x="360" y="402">下一班越近、越可信，第一行的代价就越小</text>
</svg>
