<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
  <title id="title">被测系统形态：保真度与环境自足与隔离的取舍</title>
  <desc id="desc">从左到右是四种被测系统形态：单进程、单机多进程、多机独立、共享预发布或生产环境。越往右保真度越高，环境自足与隔离越弱。前三种独立启动，可按需创建，多个候选版本可并行验证；共享环境要等代码部署进去才能测试，还会受到其他使用者与数据的干扰。混合系统独立启动关注的服务，后端复用共享环境，虚线箭头表示它从两组各取一部分。</desc>
  <!-- Original editable hand-written SVG; web export is an identical copy. -->
  <style>
    :root { color-scheme: light dark; --bg: #fcfbf8; --text: #292824; --muted: #655f55; --line: #81786a; --box: #efede7; --focus: #f3e9d9; --accent: #9a4d32; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; } }
    :root[data-theme='dark'] { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; }
    text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .heading { font-size: 22px; font-weight: 600; }
    .sub { font-size: 15px; fill: var(--muted); }
    .label { font-size: 18px; font-weight: 600; text-anchor: middle; }
    .body { font-size: 16px; text-anchor: middle; }
    .tag { font-size: 14px; fill: var(--muted); }
    .note { font-size: 14px; fill: var(--muted); text-anchor: middle; }
    .node { fill: var(--box); stroke: var(--line); stroke-width: 1.3; }
    .focus { fill: var(--focus); stroke: var(--accent); stroke-width: 1.4; }
    .axis { fill: none; stroke: var(--line); stroke-width: 1.8; marker-start: url(#arrow); marker-end: url(#arrow); }
    .brace { fill: none; stroke: var(--line); stroke-width: 1.4; }
    .flow { fill: none; stroke: var(--line); stroke-width: 1.8; marker-end: url(#arrow); }
    .borrow { stroke-dasharray: 5 5; }
    .divider { stroke: var(--line); stroke-width: 1; stroke-dasharray: 4 4; }
  </style>
  <script><![CDATA[
    try {
      const theme = localStorage.getItem('reading-notes-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch {}
  ]]></script>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8Z" fill="var(--line)"/></marker></defs>
  <rect width="720" height="460" rx="10" fill="var(--bg)"/>
  <text class="heading" x="28" y="40">被测系统越接近生产，越难隔离干扰</text>
  <text class="sub" x="28" y="69">四种形态按保真度从低到高排列；混合系统从两组中各取一部分</text>

  <text class="tag" x="28" y="104">环境自足与隔离更强</text>
  <text class="tag" x="692" y="104" text-anchor="end">保真度更高</text>
  <path class="axis" d="M38 118H682"/>

  <rect class="node" x="28" y="136" width="154" height="112" rx="7"/>
  <text class="label" x="105" y="172">单进程</text>
  <text class="body" x="105" y="204">组件打成一个程序</text>
  <text class="body" x="105" y="230">进程边界已改变</text>

  <rect class="node" x="198" y="136" width="154" height="112" rx="7"/>
  <text class="label" x="275" y="172">单机多进程</text>
  <text class="body" x="275" y="204">真实程序分开运行</text>
  <text class="body" x="275" y="230">尽量沿用生产配置</text>

  <rect class="node" x="368" y="136" width="154" height="112" rx="7"/>
  <text class="label" x="445" y="172">多机独立</text>
  <text class="body" x="445" y="204">接近分布式部署</text>
  <text class="body" x="445" y="230">网络与机器更不稳</text>

  <rect class="node" x="538" y="136" width="154" height="112" rx="7"/>
  <text class="label" x="615" y="172">共享环境</text>
  <text class="body" x="615" y="204">预发布或生产</text>
  <text class="body" x="615" y="230">他人与数据会干扰</text>

  <path class="brace" d="M28 262V272H522V262M275 272V280"/>
  <text class="body" x="275" y="304">独立启动：按需创建，候选版本可并行验证</text>
  <path class="brace" d="M538 262V272H692V262M615 272V280"/>
  <text class="body" x="615" y="304">代码部署后才能测试</text>

  <path class="flow borrow" d="M364 314V334"/>
  <path class="flow borrow" d="M611 314V334"/>
  <rect class="focus" x="198" y="344" width="494" height="76" rx="7"/>
  <path class="divider" d="M530 354V410"/>
  <text class="label" x="364" y="374">混合系统</text>
  <text class="body" x="364" y="402">关注的服务独立启动</text>
  <text class="body" x="611" y="374">后端复用共享环境</text>
  <text class="note" x="611" y="402">复制全部依赖常不可行</text>

  <text class="note" x="360" y="446">实线括号：按能否在代码进入环境前测试分组　　虚线箭头：混合系统各取一部分</text>
</svg>
