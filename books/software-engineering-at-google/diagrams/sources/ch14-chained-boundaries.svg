<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-labelledby="title desc">
  <title id="title">通过持久化输入输出连接相邻组件测试</title>
  <desc id="desc">从左到右是 A 加 B、B 加 C、C 加 D 三个相邻组件测试。测试一保存 B 的输出样本，测试二读取它并保存 C 的输出样本，测试三读取 C 的样本。实线表示保存，虚线表示读取，各测试不依赖本轮执行先后；这些配对验证不证明整个系统的所有组合行为。</desc>
  <!-- Original editable hand-written SVG; the web export is an identical copy. -->
  <style>
    :root { color-scheme: light dark; --bg: #fcfbf8; --text: #292824; --muted: #655f55; --line: #81786a; --box: #efede7; --focus: #f3e9d9; --accent: #9a4d32; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; } }
    :root[data-theme='dark'] { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; }
    text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .heading { font-size: 22px; font-weight: 600; }
    .sub { font-size: 15px; fill: var(--muted); }
    .label { font-size: 18px; font-weight: 600; text-anchor: middle; }
    .body { font-size: 16px; text-anchor: middle; }
    .note { font-size: 14px; fill: var(--muted); text-anchor: middle; }
    .node { fill: var(--box); stroke: var(--line); stroke-width: 1.2; }
    .fixture { fill: var(--focus); stroke: var(--accent); stroke-width: 1.4; }
    .save { fill: none; stroke: var(--line); stroke-width: 1.8; marker-end: url(#arrow); }
    .read { fill: none; stroke: var(--line); stroke-width: 1.8; stroke-dasharray: 6 5; marker-end: url(#arrow); }
  </style>
  <!-- Image mode inherits the page's color scheme; standalone mode reads its saved choice. -->
  <script><![CDATA[
    try {
      const theme = localStorage.getItem('reading-notes-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch {}
  ]]></script>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--line)"/></marker></defs>
  <rect width="720" height="390" rx="10" fill="var(--bg)"/>
  <text class="heading" x="28" y="39">把一个长旅程，拆成相邻组件的测试</text>
  <text class="sub" x="28" y="67">箭头连接持久化样本，不要求测试按本轮运行顺序串联</text>
  <rect class="node" x="28" y="104" width="190" height="106" rx="7"/>
  <text class="label" x="123" y="136">测试 1：A + B</text>
  <text class="body" x="123" y="165">任务入口 + 任务服务</text>
  <text class="note" x="123" y="190">验证这两个组件的交互</text>
  <rect class="node" x="265" y="104" width="190" height="106" rx="7"/>
  <text class="label" x="360" y="136">测试 2：B + C</text>
  <text class="body" x="360" y="165">任务服务 + 生成服务</text>
  <text class="note" x="360" y="190">验证这两个组件的交互</text>
  <rect class="node" x="502" y="104" width="190" height="106" rx="7"/>
  <text class="label" x="597" y="136">测试 3：C + D</text>
  <text class="body" x="597" y="165">生成服务 + 存储适配器</text>
  <text class="note" x="597" y="190">验证这两个组件的交互</text>
  <rect class="fixture" x="118" y="264" width="218" height="54" rx="7"/>
  <text class="body" x="227" y="297">B 的输出样本</text>
  <path class="save" d="M123 210V239H173V256"/>
  <path class="read" d="M281 264V239H314V218"/>
  <text class="note" x="148" y="234">保存</text>
  <text class="note" x="301" y="234">读取</text>
  <rect class="fixture" x="383" y="264" width="218" height="54" rx="7"/>
  <text class="body" x="492" y="297">C 的输出样本</text>
  <path class="save" d="M407 210V239H438V256"/>
  <path class="read" d="M546 264V239H597V218"/>
  <text class="note" x="425" y="234">保存</text>
  <text class="note" x="572" y="234">读取</text>
  <text class="sub" x="28" y="352">实线：保存输出　　虚线：读取已有样本</text>
  <text class="sub" x="28" y="377">配对测试帮助定位边界问题；全局时序与完整旅程仍需相应验证。</text>
</svg>
