<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">升级期间两版并存，新增依赖仍只有一个选择</title>
  <desc id="desc">从左往右是一次第三方库升级的四个阶段：升级前只有旧版；加入新版，并禁止新增对旧版的依赖；逐个迁移既有调用方；删除旧版，回到稳态。上排是仓库里存放的版本，依次为旧版、旧版和新版、旧版和新版、新版。下排是新增依赖时可选的版本，依次为旧版、新版、新版、新版，每个阶段都只有一个选项，这正是 One-Version 约束的对象。</desc>
  <!-- Original editable hand-written SVG; web export is an identical copy. -->
  <style>
    :root { color-scheme: light dark; --bg: #fcfbf8; --text: #292824; --muted: #655f55; --line: #81786a; --box: #efede7; --focus: #f3e9d9; --accent: #9a4d32; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; } }
    :root[data-theme='dark'] { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; }
    text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .heading { font-size: 22px; font-weight: 600; }
    .sub { font-size: 15px; fill: var(--muted); }
    .label { font-size: 18px; font-weight: 600; text-anchor: middle; }
    .body { font-size: 16px; text-anchor: middle; }
    .row { font-size: 16px; font-weight: 600; }
    .note { font-size: 14px; fill: var(--muted); text-anchor: middle; }
    .node { fill: var(--box); stroke: var(--line); stroke-width: 1.3; }
    .focus { fill: var(--focus); stroke: var(--accent); stroke-width: 1.4; }
    .flow { fill: none; stroke: var(--line); stroke-width: 1.8; marker-end: url(#arrow); }
    .divider { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 4; }
  </style>
  <script><![CDATA[
    try {
      const theme = localStorage.getItem('reading-notes-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch {}
  ]]></script>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--line)"/></marker></defs>
  <rect width="720" height="400" rx="10" fill="var(--bg)"/>
  <text class="heading" x="28" y="40">升级期间两版并存，新增依赖仍只有一个选择</text>
  <text class="sub" x="28" y="69">从左往右是一次第三方库升级的四个阶段；上排看仓库，下排看新增依赖</text>

  <rect class="node" x="28" y="92" width="148" height="70" rx="7"/>
  <text class="label" x="102" y="121">升级前</text>
  <text class="body" x="102" y="148">只有旧版</text>
  <rect class="node" x="200" y="92" width="148" height="70" rx="7"/>
  <text class="label" x="274" y="121">加入新版</text>
  <text class="body" x="274" y="148">禁止新增旧版依赖</text>
  <rect class="node" x="372" y="92" width="148" height="70" rx="7"/>
  <text class="label" x="446" y="121">迁移使用者</text>
  <text class="body" x="446" y="148">逐个改既有调用方</text>
  <rect class="node" x="544" y="92" width="148" height="70" rx="7"/>
  <text class="label" x="618" y="121">删除旧版</text>
  <text class="body" x="618" y="148">回到稳态</text>
  <path class="flow" d="M178 127H194"/>
  <path class="flow" d="M350 127H366"/>
  <path class="flow" d="M522 127H538"/>

  <text class="row" x="28" y="198">仓库里存放的版本</text>
  <rect class="node" x="70" y="210" width="64" height="40" rx="6"/>
  <text class="body" x="102" y="236">旧版</text>
  <rect class="node" x="206" y="210" width="64" height="40" rx="6"/>
  <text class="body" x="238" y="236">旧版</text>
  <rect class="focus" x="278" y="210" width="64" height="40" rx="6"/>
  <text class="body" x="310" y="236">新版</text>
  <rect class="node" x="378" y="210" width="64" height="40" rx="6"/>
  <text class="body" x="410" y="236">旧版</text>
  <rect class="focus" x="450" y="210" width="64" height="40" rx="6"/>
  <text class="body" x="482" y="236">新版</text>
  <rect class="focus" x="586" y="210" width="64" height="40" rx="6"/>
  <text class="body" x="618" y="236">新版</text>

  <path class="divider" d="M28 268H692"/>

  <text class="row" x="28" y="298">新增依赖时可选的版本</text>
  <rect class="node" x="70" y="310" width="64" height="40" rx="6"/>
  <text class="body" x="102" y="336">旧版</text>
  <rect class="focus" x="242" y="310" width="64" height="40" rx="6"/>
  <text class="body" x="274" y="336">新版</text>
  <rect class="focus" x="414" y="310" width="64" height="40" rx="6"/>
  <text class="body" x="446" y="336">新版</text>
  <rect class="focus" x="586" y="310" width="64" height="40" rx="6"/>
  <text class="body" x="618" y="336">新版</text>

  <text class="note" x="360" y="380">两版并存只在受控过渡期；下排每个阶段都只有一个选项，这正是 One-Version 约束的对象</text>
</svg>
