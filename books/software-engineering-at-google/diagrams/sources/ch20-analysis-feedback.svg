<svg xmlns="http://www.w3.org/2000/svg" width="720" height="388" viewBox="0 0 720 388" role="img" aria-labelledby="title desc">
  <title id="title">从待审变更到有益修改的反馈闭环</title>
  <desc id="desc">从左向右，待审版本及其上下文进入分析器，诊断和建议修复显示在评审差异里，作者据此修改并验证。虚线从评审结果回到检查作者，说明不有用的原因，再由作者修订规则或消息。本图为概念流程，不是部署拓扑。</desc>
  <!-- Original editable hand-written SVG; web export is an identical copy. -->
  <style>
    :root { color-scheme: light dark; --bg: #fcfbf8; --text: #292824; --muted: #655f55; --line: #81786a; --box: #efede7; --focus: #f3e9d9; --accent: #9a4d32; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; } }
    :root[data-theme='dark'] { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; }
    text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .heading { font-size: 22px; font-weight: 600; }
    .sub { font-size: 15px; fill: var(--muted); }
    .label { font-size: 19px; font-weight: 600; text-anchor: middle; }
    .body { font-size: 15px; text-anchor: middle; }
    .small { font-size: 14px; text-anchor: middle; }
    .node { fill: var(--box); stroke: var(--line); stroke-width: 1.3; }
    .focus { fill: var(--focus); stroke: var(--accent); stroke-width: 1.3; }
    .flow { fill: none; stroke: var(--line); stroke-width: 1.8; marker-end: url(#arrow); }
    .feedback { fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-dasharray: 6 5; marker-end: url(#feedback-arrow); }
  </style>
  <script><![CDATA[
    try {
      const theme = localStorage.getItem('reading-notes-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch {}
  ]]></script>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--line)"/></marker>
    <marker id="feedback-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--accent)"/></marker>
  </defs>
  <rect width="720" height="388" rx="10" fill="var(--bg)"/>
  <text class="heading" x="24" y="39">结果送到代码旁，反馈回到检查作者</text>
  <text class="sub" x="24" y="69">概念流程：同一份变更上下文贯穿分析与评审</text>
  <rect class="node" x="24" y="110" width="140" height="120" rx="7"/>
  <text class="label" x="94" y="143">待审版本</text>
  <text class="body" x="94" y="177">源码 · 元数据</text>
  <text class="body" x="94" y="204">相关构建上下文</text>
  <rect class="node" x="200" y="110" width="140" height="120" rx="7"/>
  <text class="label" x="270" y="143">分析器</text>
  <text class="body" x="270" y="177">规则与类型信息</text>
  <text class="body" x="270" y="204">诊断 · 建议修复</text>
  <rect class="focus" x="376" y="110" width="140" height="120" rx="7"/>
  <text class="label" x="446" y="143">评审差异</text>
  <text class="body" x="446" y="177">就地显示结果</text>
  <text class="body" x="446" y="204">作者和评审者共见</text>
  <rect class="node" x="552" y="110" width="140" height="120" rx="7"/>
  <text class="label" x="622" y="143">有益修改</text>
  <text class="body" x="622" y="177">应用补丁或调整</text>
  <text class="body" x="622" y="204">作者修改并验证</text>
  <path class="flow" d="M164 170H191"/>
  <path class="flow" d="M340 170H367"/>
  <path class="flow" d="M516 170H543"/>
  <rect class="focus" x="200" y="280" width="140" height="68" rx="7"/>
  <text class="label" x="270" y="306">检查作者</text>
  <text class="small" x="270" y="332">修订规则／消息</text>
  <path class="feedback" d="M446 230V314H349"/>
  <path class="feedback" d="M270 280V239"/>
  <text class="sub" x="463" y="280">Not useful：说明原因</text>
  <text class="sub" x="24" y="373">实线：促成改进的路径　　虚线：持续改进检查的反馈</text>
</svg>
