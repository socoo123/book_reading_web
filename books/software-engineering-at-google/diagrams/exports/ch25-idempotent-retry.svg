<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="title desc">
  <title id="title">超时后用同一标识重试，只留下一个订单</title>
  <desc id="desc">三条竖线从左到右是客户端、任一服务副本和持久订单记录，从上往下按时间读。客户端首次提交时带上自己生成的标识 A17 以及地址和商品，副本记下 A17 并创建订单，持久记录中 A17 对应一个订单。随后后端退出，响应丢失，客户端超时，不知道是否已经下单。客户端重试时仍带 A17，处理重试的副本按 A17 查到已有订单，返回已有结果而不建第二单。去重记录放在各副本共享的持久位置；只记在副本内存里，换了副本就会再下一单。</desc>
  <style>
    :root { color-scheme: light dark; --bg: #fcfbf8; --text: #292824; --muted: #655f55; --line: #81786a; --box: #efede7; --focus: #f3e9d9; --accent: #9a4d32; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; } }
    :root[data-theme='dark'] { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; }
    text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .heading { font-size: 22px; font-weight: 600; }
    .sub { font-size: 15px; fill: var(--muted); }
    .label { font-size: 18px; font-weight: 600; text-anchor: middle; }
    .body { font-size: 16px; text-anchor: middle; }
    .msg { font-size: 15px; text-anchor: middle; }
    .note { font-size: 14px; fill: var(--muted); text-anchor: middle; }
    .node { fill: var(--box); stroke: var(--line); stroke-width: 1.3; }
    .focus { fill: var(--focus); stroke: var(--accent); stroke-width: 1.4; }
    .lifeline { stroke: var(--line); stroke-width: 1; opacity: 0.6; }
    .flow { fill: none; stroke: var(--line); stroke-width: 1.8; marker-end: url(#arrow); }
    .lost { fill: none; stroke: var(--line); stroke-width: 1.8; stroke-dasharray: 5 5; }
    .cross { stroke: var(--accent); stroke-width: 2.2; }
  </style>
  <script><![CDATA[
    try {
      const theme = localStorage.getItem('reading-notes-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch {}
  ]]></script>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--line)"/></marker></defs>
  <rect width="720" height="470" rx="10" fill="var(--bg)"/>
  <text class="heading" x="28" y="40">超时后用同一标识重试，只留下一个订单</text>
  <text class="sub" x="28" y="69">从上往下按时间读；实线是送达的消息，虚线是丢失的响应</text>

  <path class="lifeline" d="M118 132V424"/>
  <path class="lifeline" d="M360 132V424"/>
  <path class="lifeline" d="M602 132V424"/>
  <rect class="node" x="28" y="92" width="180" height="40" rx="7"/>
  <text class="label" x="118" y="118">客户端</text>
  <rect class="node" x="270" y="92" width="180" height="40" rx="7"/>
  <text class="label" x="360" y="118">任一服务副本</text>
  <rect class="focus" x="512" y="92" width="180" height="40" rx="7"/>
  <text class="label" x="602" y="118">持久订单记录</text>

  <text class="msg" x="239" y="162">首次提交：A17＋地址、商品</text>
  <path class="flow" d="M118 172H356"/>
  <text class="msg" x="481" y="198">记下 A17，创建订单</text>
  <path class="flow" d="M360 208H598"/>
  <rect class="focus" x="537" y="222" width="130" height="34" rx="6"/>
  <text class="body" x="602" y="245">A17：1 个订单</text>

  <text class="msg" x="286" y="236">后端退出，响应丢失</text>
  <path class="lost" d="M356 246H212"/>
  <path class="cross" d="M196 238 212 254M212 238 196 254"/>
  <rect class="node" x="28" y="266" width="180" height="36" rx="6"/>
  <text class="body" x="118" y="290">超时，不知是否下单</text>

  <text class="msg" x="239" y="326">重试：仍带 A17</text>
  <path class="flow" d="M118 336H356"/>
  <text class="msg" x="481" y="362">按 A17 查到已有订单</text>
  <path class="flow" d="M360 372H598"/>
  <text class="msg" x="239" y="398">返回已有结果，不建第二单</text>
  <path class="flow" d="M360 408H122"/>

  <text class="note" x="360" y="450">去重记录放在各副本共享的持久位置；只记在副本内存里，换了副本就会再下一单</text>
</svg>
