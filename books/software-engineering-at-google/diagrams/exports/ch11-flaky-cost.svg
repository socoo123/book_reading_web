<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">偶发失败的成本链</title>
  <desc id="desc">上排按书中假设计算：每次执行有 0.1% 的概率误报，每天执行 10,000 次，平均每天约 10 个假红灯。面对假红灯，逐个排查会占用工程时间；自动重跑用机器换人的时间，但根因仍在，不稳定继续积累。两条路径最后都汇到同一处：红灯被当作噪声，真实回归混在其中。实线表示成本继续累积，虚线表示自动重跑这条路径。</desc>
  <!-- Original editable hand-written SVG; web export is an identical copy. -->
  <style>
    :root { color-scheme: light dark; --bg: #fcfbf8; --text: #292824; --muted: #655f55; --line: #81786a; --box: #efede7; --focus: #f3e9d9; --accent: #9a4d32; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; } }
    :root[data-theme='dark'] { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; }
    text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .heading { font-size: 22px; font-weight: 600; }
    .sub { font-size: 15px; fill: var(--muted); }
    .label { font-size: 18px; font-weight: 600; text-anchor: middle; }
    .body { font-size: 16px; text-anchor: middle; }
    .note { font-size: 14px; fill: var(--muted); }
    .op { font-size: 22px; font-weight: 600; fill: var(--muted); text-anchor: middle; }
    .node { fill: var(--box); stroke: var(--line); stroke-width: 1.3; }
    .focus { fill: var(--focus); stroke: var(--accent); stroke-width: 1.4; }
    .flow { fill: none; stroke: var(--line); stroke-width: 1.8; marker-end: url(#arrow); }
    .rerun { stroke-dasharray: 5 5; }
  </style>
  <script><![CDATA[
    try {
      const theme = localStorage.getItem('reading-notes-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch {}
  ]]></script>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--line)"/></marker></defs>
  <rect width="720" height="420" rx="10" fill="var(--bg)"/>
  <text class="heading" x="28" y="40">偶发失败的成本，从时间蔓延到信任</text>
  <text class="sub" x="28" y="69">上排按书中假设计算；两种应对只要不处理根因，最后都会消耗信任</text>

  <rect class="node" x="28" y="92" width="180" height="70" rx="7"/>
  <text class="label" x="118" y="120">单次误报 0.1%</text>
  <text class="body" x="118" y="146">每次执行的概率</text>
  <text class="op" x="228" y="134">×</text>
  <rect class="node" x="248" y="92" width="180" height="70" rx="7"/>
  <text class="label" x="338" y="120">每天 10,000 次</text>
  <text class="body" x="338" y="146">整套测试合计</text>
  <path class="flow" d="M430 127H470"/>
  <rect class="focus" x="480" y="92" width="212" height="70" rx="7"/>
  <text class="label" x="586" y="120">每天约 10 个假红灯</text>
  <text class="body" x="586" y="146">平均每天的期望值</text>

  <path class="flow" d="M586 162V200"/>
  <path class="flow rerun" d="M530 162V186H338V200"/>
  <rect class="node rerun" x="248" y="210" width="180" height="70" rx="7"/>
  <text class="label" x="338" y="238">自动重跑</text>
  <text class="body" x="338" y="264">用机器换人的时间</text>
  <rect class="node" x="480" y="210" width="212" height="70" rx="7"/>
  <text class="label" x="586" y="238">逐个排查</text>
  <text class="body" x="586" y="264">每个都占用工程时间</text>

  <path class="flow" d="M28 233H80"/>
  <text class="note" x="92" y="238">成本累积</text>
  <path class="flow rerun" d="M28 263H80"/>
  <text class="note" x="92" y="268">推迟处理根因</text>

  <path class="flow rerun" d="M338 280V318"/>
  <path class="flow" d="M586 280V318"/>
  <text class="note" x="598" y="304">排查多了</text>
  <rect class="node" x="248" y="328" width="180" height="70" rx="7"/>
  <text class="label" x="338" y="356">根因仍在</text>
  <text class="body" x="338" y="382">不稳定继续积累</text>
  <path class="flow" d="M430 363H470"/>
  <rect class="focus" x="480" y="328" width="212" height="70" rx="7"/>
  <text class="label" x="586" y="356">红灯被当作噪声</text>
  <text class="body" x="586" y="382">真实回归混在其中</text>
</svg>
