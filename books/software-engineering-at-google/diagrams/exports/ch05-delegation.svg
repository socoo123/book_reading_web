<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-labelledby="title desc">
  <title id="title">把一次授权变成下一次独立负责的能力</title>
  <desc id="desc">从左到右，先说清目标与优先级，再由成员独立选择实现方式并推进，最后交换反馈并扩展责任。虚线从反馈回到目标，表示将经验用于下一轮工作。指导、移除障碍与定期确认方向贯穿整个过程。</desc>
  <!-- Original, editable hand-written SVG. The export is an identical web copy. -->
  <style>
    :root { color-scheme: light dark; --bg: #fcfbf8; --text: #292824; --muted: #655f55; --line: #81786a; --box: #efede7; --focus: #f3e9d9; --accent: #9a4d32; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; } }
    :root[data-theme='dark'] { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; }
    text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .heading { font-size: 22px; font-weight: 600; }
    .sub { font-size: 15px; fill: var(--muted); }
    .node { fill: var(--box); stroke: var(--line); stroke-width: 1.2; }
    .focus { fill: var(--focus); stroke: var(--accent); stroke-width: 1.4; }
    .label { font-size: 18px; font-weight: 600; text-anchor: middle; }
    .small { font-size: 16px; fill: var(--muted); text-anchor: middle; }
    .arrow { fill: none; stroke: var(--line); stroke-width: 1.8; marker-end: url(#arrow); }
    .return { fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-dasharray: 6 5; marker-end: url(#return-arrow); }
    .return-label { font-size: 16px; fill: var(--accent); text-anchor: middle; }
  </style>
  <script><![CDATA[
    try {
      const theme = localStorage.getItem('reading-notes-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch {}
  ]]></script>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--line)"/></marker>
    <marker id="return-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--accent)"/></marker>
  </defs>
  <rect width="720" height="350" rx="10" fill="var(--bg)"/>
  <text class="heading" x="32" y="39">一次授权，也为下一次积累能力</text>
  <text class="sub" x="32" y="67">实线：本轮工作向前推进　　虚线：经验进入下一轮</text>
  <rect class="node" x="32" y="104" width="196" height="82" rx="7"/>
  <text class="label" x="130" y="137">对齐目标</text>
  <text class="small" x="130" y="164">说清结果与优先级</text>
  <path class="arrow" d="M236 145H254"/>
  <rect class="focus" x="262" y="104" width="196" height="82" rx="7"/>
  <text class="label" x="360" y="137">成员独立推进</text>
  <text class="small" x="360" y="164">选择实现并承担责任</text>
  <path class="arrow" d="M466 145H484"/>
  <rect class="node" x="492" y="104" width="196" height="82" rx="7"/>
  <text class="label" x="590" y="137">反馈与成长</text>
  <text class="small" x="590" y="164">总结经验，扩展责任</text>
  <path class="return" d="M590 198V235H130V198"/>
  <rect x="196" y="222" width="328" height="27" fill="var(--bg)"/>
  <text class="return-label" x="360" y="241">下轮：据经验调整，逐步扩大责任</text>
  <rect class="node" x="32" y="275" width="656" height="47" rx="7"/>
  <text x="360" y="305" font-size="17" text-anchor="middle">贯穿过程：指导、移除障碍、定期确认方向</text>
</svg>
