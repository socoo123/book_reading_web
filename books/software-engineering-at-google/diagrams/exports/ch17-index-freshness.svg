<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
  <title id="title">同一次提交，两种索引跟上的时间不同</title>
  <desc id="desc">按书中当时的实现：一次提交新增了一个文件。文本索引只需重建触及的文件，提交后中位数不到 10 秒即可见；交叉引用索引因为改动影响沿依赖扩散，需要大范围构建分析，当时每天生成一次。因此在同一时刻查询，文本搜索已能找到新文件，查找引用仍对应上次分析。</desc>
  <!-- Original editable hand-written SVG; web export is an identical copy. -->
  <style>
    :root { color-scheme: light dark; --bg: #fcfbf8; --text: #292824; --muted: #655f55; --line: #81786a; --box: #efede7; --focus: #f3e9d9; --accent: #9a4d32; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; } }
    :root[data-theme='dark'] { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; }
    text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .heading { font-size: 22px; font-weight: 600; }
    .sub { font-size: 15px; fill: var(--muted); }
    .label { font-size: 18px; font-weight: 600; text-anchor: middle; }
    .body { font-size: 16px; text-anchor: middle; }
    .note { font-size: 14px; fill: var(--muted); text-anchor: middle; }
    .lead { font-size: 16px; }
    .node { fill: var(--box); stroke: var(--line); stroke-width: 1.3; }
    .focus { fill: var(--focus); stroke: var(--accent); stroke-width: 1.4; }
    .flow { fill: none; stroke: var(--line); stroke-width: 1.8; marker-end: url(#arrow); }
    .divider { stroke: var(--line); stroke-width: 1; }
  </style>
  <script><![CDATA[
    try {
      const theme = localStorage.getItem('reading-notes-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch {}
  ]]></script>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--line)"/></marker></defs>
  <rect width="720" height="380" rx="10" fill="var(--bg)"/>
  <text class="heading" x="28" y="40">同一次提交，两种索引跟上的时间不同</text>
  <text class="sub" x="28" y="69">按书中当时的实现；箭头是更新路径，右侧是同一时刻查到的结果</text>

  <rect class="node" x="28" y="96" width="120" height="212" rx="7"/>
  <text class="label" x="88" y="196">提交改动</text>
  <text class="body" x="88" y="226">新增一个文件</text>

  <path class="flow" d="M148 144H182"/>
  <path class="flow" d="M148 260H182"/>

  <rect class="node" x="192" y="96" width="236" height="96" rx="7"/>
  <text class="label" x="310" y="128">文本索引</text>
  <text class="body" x="310" y="156">只需重建触及的文件</text>
  <text class="note" x="310" y="180">提交后中位数不到 10 秒可见</text>

  <rect class="node" x="192" y="212" width="236" height="96" rx="7"/>
  <text class="label" x="310" y="244">交叉引用索引</text>
  <text class="body" x="310" y="272">改动影响沿依赖扩散</text>
  <text class="note" x="310" y="296">需大范围构建分析，当时每天一次</text>

  <path class="flow" d="M428 144H462"/>
  <path class="flow" d="M428 260H462"/>

  <rect class="focus" x="472" y="96" width="220" height="212" rx="7"/>
  <text class="note" x="582" y="122">同一时刻查询</text>
  <text class="label" x="582" y="156">文本搜索</text>
  <text class="body" x="582" y="182">已能找到新文件</text>
  <path class="divider" d="M488 208H676"/>
  <text class="label" x="582" y="246">查找引用</text>
  <text class="body" x="582" y="274">仍对应上次分析</text>

  <text class="lead" x="28" y="350">新文件已经能搜到，其中符号的引用关系还要等下一次语义索引。</text>
</svg>
