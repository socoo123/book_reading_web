<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
  <title id="title">A/A、A/B 与 A/B/C 差异比较各自说明什么</title>
  <desc id="desc">三行分别是三种差异比较。A/A：基线版本与同一基线的另一份对比，差异是时间、随机性等本底噪声，虚线箭头表示用它从 A/B 的结果中剔除噪声。A/B：基线版本与候选版本对比，差异包含行为变化和噪声，需要逐条判断是预期变化还是回归。A/B/C：并排上次生产版本、当前基线和待提交变更；当前基线与待提交变更之间的差异是本次变更的影响，上次生产版本与当前基线之间的差异是下一次发布中已累积的变化，一次就能同时看清两种影响。</desc>
  <!-- Original editable hand-written SVG; web export is an identical copy. -->
  <style>
    :root { color-scheme: light dark; --bg: #fcfbf8; --text: #292824; --muted: #655f55; --line: #81786a; --box: #efede7; --focus: #f3e9d9; --accent: #9a4d32; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; } }
    :root[data-theme='dark'] { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; }
    text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .heading { font-size: 22px; font-weight: 600; }
    .sub { font-size: 15px; fill: var(--muted); }
    .label { font-size: 18px; font-weight: 600; text-anchor: middle; }
    .row { font-size: 18px; font-weight: 600; }
    .body { font-size: 16px; text-anchor: middle; }
    .note { font-size: 14px; fill: var(--muted); text-anchor: middle; }
    .note-start { font-size: 14px; fill: var(--muted); }
    .node { fill: var(--box); stroke: var(--line); stroke-width: 1.3; }
    .focus { fill: var(--focus); stroke: var(--accent); stroke-width: 1.4; }
    .flow { fill: none; stroke: var(--line); stroke-width: 1.8; marker-end: url(#arrow); }
    .cleanup { stroke-dasharray: 4 4; }
    .brace { fill: none; stroke: var(--line); stroke-width: 1.4; }
  </style>
  <script><![CDATA[
    try {
      const theme = localStorage.getItem('reading-notes-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch {}
  ]]></script>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--line)"/></marker></defs>
  <rect width="720" height="460" rx="10" fill="var(--bg)"/>
  <text class="heading" x="28" y="40">三种差异比较，各自看清一类变化</text>
  <text class="sub" x="28" y="69">左侧是参与比较的版本，实线箭头指向差异说明什么</text>

  <text class="row" x="28" y="130">A/A</text>
  <rect class="node" x="88" y="92" width="152" height="64" rx="7"/>
  <text class="body" x="164" y="130">基线版本</text>
  <text class="note" x="264" y="129">对比</text>
  <rect class="node" x="288" y="92" width="152" height="64" rx="7"/>
  <text class="body" x="364" y="130">同一基线的另一份</text>
  <path class="flow" d="M442 124H480"/>
  <rect class="focus" x="490" y="92" width="202" height="64" rx="7"/>
  <text class="label" x="591" y="118">差异＝本底噪声</text>
  <text class="body" x="591" y="144">如时间、随机性</text>

  <path class="flow cleanup" d="M591 158V186"/>
  <text class="note-start" x="603" y="178">用来剔除噪声</text>

  <text class="row" x="28" y="234">A/B</text>
  <rect class="node" x="88" y="196" width="152" height="64" rx="7"/>
  <text class="body" x="164" y="234">基线版本</text>
  <text class="note" x="264" y="233">对比</text>
  <rect class="node" x="288" y="196" width="152" height="64" rx="7"/>
  <text class="body" x="364" y="234">候选版本</text>
  <path class="flow" d="M442 228H480"/>
  <rect class="focus" x="490" y="196" width="202" height="64" rx="7"/>
  <text class="label" x="591" y="222">差异＝变化＋噪声</text>
  <text class="body" x="591" y="248">逐条判断：预期还是回归</text>

  <text class="note" x="324" y="284">差异＝本次变更的影响</text>
  <path class="brace" d="M263 306V296H384V306M324 296V290"/>
  <text class="row" x="28" y="350">A/B/C</text>
  <rect class="node" x="86" y="312" width="112" height="64" rx="7"/>
  <text class="body" x="142" y="350">上次生产版本</text>
  <rect class="node" x="207" y="312" width="112" height="64" rx="7"/>
  <text class="body" x="263" y="350">当前基线</text>
  <rect class="node" x="328" y="312" width="112" height="64" rx="7"/>
  <text class="body" x="384" y="350">待提交变更</text>
  <path class="brace" d="M142 382V392H263V382M202 392V398"/>
  <text class="note" x="202" y="416">差异＝下次发布已累积的变化</text>
  <path class="flow" d="M442 344H480"/>
  <rect class="focus" x="490" y="312" width="202" height="64" rx="7"/>
  <text class="label" x="591" y="338">一次看清两种影响</text>
  <text class="body" x="591" y="364">不只看本次变更</text>

  <text class="note" x="360" y="448">虚线箭头：A/A 找出的噪声用于清理 A/B　　括号：A/B/C 中两组相邻的比较</text>
</svg>
