<svg xmlns="http://www.w3.org/2000/svg" width="720" height="388" viewBox="0 0 720 388" role="img" aria-labelledby="title desc">
  <title id="title">让一次求助留下可复用的知识</title>
  <desc id="desc">从左上角顺时针阅读：向社区提出问题，结合具体情境解答，整理为可检索记录，后来者使用与反馈。前三条实线箭头表示知识从提问走向使用，左侧虚线表示新的疑问或过期信息回到讨论。记录可以位于问答页或文档，不限定工具。</desc>
  <!-- Original, editable hand-written SVG. The export is an identical web copy. -->
  <style>
    :root { color-scheme: light dark; --bg: #fcfbf8; --text: #292824; --muted: #655f55; --line: #81786a; --box: #efede7; --focus: #f3e9d9; --accent: #9a4d32; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; } }
    :root[data-theme='dark'] { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; }
    text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .heading { font-size: 22px; font-weight: 600; }
    .sub { font-size: 15px; fill: var(--muted); }
    .node { fill: var(--box); stroke: var(--line); stroke-width: 1.2; }
    .focus { fill: var(--focus); stroke: var(--accent); stroke-width: 1.4; }
    .node-text { font-size: 19px; text-anchor: middle; font-weight: 500; }
    .small { font-size: 15px; fill: var(--muted); text-anchor: middle; }
    .arrow { fill: none; stroke: var(--line); stroke-width: 1.8; marker-end: url(#arrow); }
    .feedback { fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-dasharray: 6 5; marker-end: url(#feedback-arrow); }
    .feedback-label { font-size: 15px; fill: var(--accent); }
  </style>
  <script><![CDATA[
    try {
      const theme = localStorage.getItem('reading-notes-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch {}
  ]]></script>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--line)"/></marker>
    <marker id="feedback-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--accent)"/></marker>
  </defs>
  <rect width="720" height="388" rx="10" fill="var(--bg)"/>
  <text class="heading" x="32" y="39">一次求助，怎样留下可复用的知识？</text>
  <text class="sub" x="32" y="67">从左上角顺时针阅读；记录可以进入问答页或文档</text>
  <rect class="node" x="64" y="104" width="248" height="78" rx="7"/>
  <text class="node-text" x="188" y="135">向社区提出问题</text>
  <text class="small" x="188" y="160">描述目标、观察与疑问</text>
  <path class="arrow" d="M322 143H398"/>
  <rect class="node" x="408" y="104" width="248" height="78" rx="7"/>
  <text class="node-text" x="532" y="135">结合具体情境解答</text>
  <text class="small" x="532" y="160">讨论理由与适用条件</text>
  <path class="arrow" d="M532 192V242"/>
  <text class="sub" x="546" y="222">保存结论</text>
  <rect class="focus" x="408" y="252" width="248" height="78" rx="7"/>
  <text class="node-text" x="532" y="283">整理为可检索记录</text>
  <text class="small" x="532" y="308">问题、答案与适用条件</text>
  <path class="arrow" d="M398 291H322"/>
  <rect class="node" x="64" y="252" width="248" height="78" rx="7"/>
  <text class="node-text" x="188" y="283">后来者使用与反馈</text>
  <text class="small" x="188" y="308">复用答案，也发现缺口</text>
  <path class="feedback" d="M188 242V192"/>
  <text class="feedback-label" x="202" y="222">新疑问／过期信息</text>
  <text class="sub" x="32" y="366">实线：提问、解释、记录、使用　　虚线：把新疑问带回讨论</text>
</svg>
