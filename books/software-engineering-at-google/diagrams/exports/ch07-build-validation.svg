<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" aria-labelledby="title desc">
  <title id="title">构建日志需要与工程师的实际等待核对</title>
  <desc id="desc">日志记录到构建后，现场小问卷发现两种不同情形。左侧是自动工具触发、工程师没有在等待的后台构建，虚线表示从典型等待体验指标中排除此类活动。右侧是构建结果阻塞当前工作的情况，实线表示它与研究目标相关。图示不表示完整过滤规则。</desc>
  <!-- Original, editable hand-written SVG. The export is an identical web copy. -->
  <style>
    :root { color-scheme: light dark; --bg: #fcfbf8; --text: #292824; --muted: #655f55; --line: #81786a; --box: #efede7; --focus: #f3e9d9; --accent: #9a4d32; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; } }
    :root[data-theme='dark'] { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; }
    text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .heading { font-size: 22px; font-weight: 600; }
    .sub { font-size: 15px; fill: var(--muted); }
    .node { fill: var(--box); stroke: var(--line); stroke-width: 1.2; }
    .focus { fill: var(--focus); stroke: var(--accent); stroke-width: 1.4; }
    .label { font-size: 18px; font-weight: 600; text-anchor: middle; }
    .body { font-size: 16px; text-anchor: middle; fill: var(--muted); }
    .arrow { fill: none; stroke: var(--line); stroke-width: 1.8; marker-end: url(#arrow); }
    .exclude { stroke-dasharray: 6 5; }
  </style>
  <script><![CDATA[
    try {
      const theme = localStorage.getItem('reading-notes-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch {}
  ]]></script>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--line)"/></marker></defs>
  <rect width="720" height="450" rx="10" fill="var(--bg)"/>
  <text class="heading" x="28" y="39">一次构建记录，不一定等于一次等待</text>
  <text class="sub" x="28" y="67">原书案例的概念整理，不表示完整埋点或过滤规则</text>
  <rect class="node" x="160" y="96" width="400" height="54" rx="7"/>
  <text class="label" x="360" y="129">日志记录到一次构建</text>
  <text class="body" x="360" y="183">结合现场小问卷，核对当时的工作情境</text>
  <path class="arrow" d="M160 123H96V204"/>
  <path class="arrow" d="M560 123H624V204"/>
  <rect class="node" x="28" y="212" width="306" height="110" rx="7"/>
  <text class="label" x="181" y="245">自动工具触发后台构建</text>
  <text class="body" x="181" y="275">工程师没有启动它</text>
  <text class="body" x="181" y="300">也没有被结果阻塞</text>
  <rect class="focus" x="386" y="212" width="306" height="110" rx="7"/>
  <text class="label" x="539" y="245">构建结果阻塞当前任务</text>
  <text class="body" x="539" y="275">工程师实际需要等待</text>
  <text class="body" x="539" y="300">与目标中的体验相关</text>
  <path class="arrow exclude" d="M181 322V348"/>
  <path class="arrow" d="M539 322V348"/>
  <rect class="node exclude" x="28" y="356" width="306" height="48" rx="7"/>
  <text class="body" x="181" y="386">从该体验指标中排除此类活动</text>
  <rect class="focus" x="386" y="356" width="306" height="48" rx="7"/>
  <text class="body" x="539" y="386">围绕真实等待解释延迟</text>
  <text class="sub" x="28" y="434">虚线：排除与目标无关的活动　　实线：与等待体验相关</text>
</svg>
