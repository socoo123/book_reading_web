<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">从完整动作输入到可复用产物</title>
  <desc id="desc">文件内容、工具、命令、选项、环境与相关平台条件构成动作描述，生成动作键。动作键用于查询动作缓存得到结果元数据，再根据输出摘要从内容寻址存储 CAS 取回字节。输入完整、执行确定和缓存可信共同支撑安全复用。本图只画命中读取路径。</desc>
  <!-- Original editable hand-written SVG; web export is an identical copy. -->
  <style>
    :root { color-scheme: light dark; --bg: #fcfbf8; --text: #292824; --muted: #655f55; --line: #81786a; --box: #efede7; --focus: #f3e9d9; --accent: #9a4d32; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; } }
    :root[data-theme='dark'] { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; }
    text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .heading { font-size: 22px; font-weight: 600; }
    .sub { font-size: 15px; fill: var(--muted); }
    .label { font-size: 19px; font-weight: 600; text-anchor: middle; }
    .body { font-size: 16px; text-anchor: middle; }
    .note { font-size: 14px; fill: var(--muted); text-anchor: middle; }
    .node { fill: var(--box); stroke: var(--line); stroke-width: 1.3; }
    .inputs { fill: var(--focus); stroke: var(--accent); stroke-width: 1.3; }
    .flow { fill: none; stroke: var(--line); stroke-width: 1.8; marker-end: url(#arrow); }
  </style>
  <script><![CDATA[
    try {
      const theme = localStorage.getItem('reading-notes-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch {}
  ]]></script>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--line)"/></marker></defs>
  <rect width="720" height="420" rx="10" fill="var(--bg)"/>
  <text class="heading" x="28" y="40">缓存命中，先要知道是同一项计算</text>
  <text class="sub" x="28" y="69">本图只画读取路径：计算身份 → 结果记录 → 输出字节</text>
  <rect class="inputs" x="28" y="103" width="664" height="97" rx="7"/>
  <text class="label" x="360" y="133">影响输出的完整动作描述</text>
  <text class="body" x="360" y="165">文件内容与工具 · 命令与选项 · 受控环境 · 相关平台条件</text>
  <text class="note" x="360" y="189">图为概念模型，不是协议字段清单</text>
  <path class="flow" d="M123 200V228"/>
  <rect class="node" x="28" y="237" width="190" height="86" rx="7"/>
  <text class="label" x="123" y="270">动作键 K</text>
  <text class="body" x="123" y="302">完整描述的摘要</text>
  <rect class="node" x="265" y="237" width="190" height="86" rx="7"/>
  <text class="label" x="360" y="270">动作缓存</text>
  <text class="body" x="360" y="302">K → 结果元数据</text>
  <rect class="node" x="502" y="237" width="190" height="86" rx="7"/>
  <text class="label" x="597" y="270">CAS</text>
  <text class="body" x="597" y="302">摘要 → 输出字节</text>
  <path class="flow" d="M218 280H256"/>
  <path class="flow" d="M455 280H493"/>
  <text class="note" x="240" y="225">查询</text>
  <text class="note" x="478" y="225">输出摘要</text>
  <text class="sub" x="28" y="362">命中：结果记录及其指向的输出都可取得</text>
  <text class="sub" x="28" y="392">安全复用的前提：输入完整 · 执行确定 · 缓存可信</text>
</svg>
