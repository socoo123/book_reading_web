<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-labelledby="title desc">
  <title id="title">一个未承诺的顺序怎样变成外部依赖</title>
  <desc id="desc">从左向右，哈希容器的遍历顺序进入响应数组，再被下游按位置比较。假设接口只保证成员内容，修改内部实现改变排列后，成员不变，下游比较仍可能失败。箭头表示排列沿数据路径传播，场景为笔记假设。</desc>
  <!-- Original editable hand-written SVG; web export is an identical copy. -->
  <style>
    :root { color-scheme: light dark; --bg: #fcfbf8; --text: #292824; --muted: #655f55; --line: #81786a; --box: #efede7; --focus: #f3e9d9; --accent: #9a4d32; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; } }
    :root[data-theme='dark'] { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; }
    text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .heading { font-size: 22px; font-weight: 600; }
    .sub { font-size: 15px; fill: var(--muted); }
    .label { font-size: 18px; font-weight: 600; text-anchor: middle; }
    .body { font-size: 17px; text-anchor: middle; }
    .note { font-size: 14px; fill: var(--muted); }
    .node { fill: var(--box); stroke: var(--line); stroke-width: 1.3; }
    .focus { fill: var(--focus); stroke: var(--accent); stroke-width: 1.4; }
    .flow { fill: none; stroke: var(--line); stroke-width: 1.8; marker-end: url(#arrow); }
  </style>
  <script><![CDATA[
    try {
      const theme = localStorage.getItem('reading-notes-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch {}
  ]]></script>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--line)"/></marker></defs>
  <rect width="720" height="340" rx="10" fill="var(--bg)"/>
  <text class="heading" x="28" y="40">一个未承诺的顺序，怎样变成外部依赖</text>
  <text class="sub" x="28" y="71">假设接口只保证成员内容；排列仍会被看见并传播</text>
  <rect class="node" x="24" y="110" width="200" height="126" rx="7"/>
  <text class="label" x="124" y="145">容器遍历</text>
  <text class="body" x="124" y="180">a → b → c</text>
  <text class="body" x="124" y="210">来自当前实现</text>
  <path class="flow" d="M232 173H260"/>
  <rect class="node" x="270" y="110" width="180" height="126" rx="7"/>
  <text class="label" x="360" y="145">响应数组</text>
  <text class="body" x="360" y="180">[a, b, c]</text>
  <text class="body" x="360" y="210">顺序被带出去</text>
  <path class="flow" d="M458 173H486"/>
  <rect class="focus" x="496" y="110" width="200" height="126" rx="7"/>
  <text class="label" x="596" y="145">下游按位置比较</text>
  <text class="body" x="596" y="180">与旧快照一致</text>
  <text class="body" x="596" y="210">顺序成了隐含约定</text>
  <text class="body" x="360" y="281">一旦改成 b → a → c，成员不变，下游比较仍可能失败。</text>
  <text class="note" x="28" y="318">箭头：排列沿数据路径传播。此图是解释性假设，不是具体线上事故。</text>
</svg>
