<svg xmlns="http://www.w3.org/2000/svg" width="720" height="515" viewBox="0 0 720 515" role="img" aria-labelledby="title desc">
  <title id="title">三项评审条件与独立的提交检查</title>
  <desc id="desc">至少一个 LGTM、足够的 Approval 与零条未解决评论共同形成评审条件齐备。LGTM 和 Approval 由评审者授予或撤销，作者可在回应处理后解决评论。评审条件齐备之后，还要通过提交时的 presubmit 检查，才能入库。这是原章常规流程的概念解释，团队可以要求更多 LGTM。</desc>
  <!-- Original editable hand-written SVG; web export is an identical copy. -->
  <style>
    :root { color-scheme: light dark; --bg: #fcfbf8; --text: #292824; --muted: #655f55; --line: #81786a; --box: #efede7; --focus: #f3e9d9; --accent: #9a4d32; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; } }
    :root[data-theme='dark'] { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; }
    text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .heading { font-size: 22px; font-weight: 600; }
    .sub { font-size: 15px; fill: var(--muted); }
    .label { font-size: 19px; font-weight: 600; text-anchor: middle; }
    .body { font-size: 16px; text-anchor: middle; }
    .note { font-size: 14px; fill: var(--muted); text-anchor: middle; }
    .node { fill: var(--box); stroke: var(--line); stroke-width: 1.3; }
    .ready { fill: var(--focus); stroke: var(--accent); stroke-width: 1.3; }
    .join { fill: none; stroke: var(--line); stroke-width: 1.8; }
    .flow { fill: none; stroke: var(--line); stroke-width: 1.8; marker-end: url(#arrow); }
  </style>
  <script><![CDATA[
    try {
      const theme = localStorage.getItem('reading-notes-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch {}
  ]]></script>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--line)"/></marker></defs>
  <rect width="720" height="515" rx="10" fill="var(--bg)"/>
  <text class="heading" x="28" y="40">评审就绪，来自三项条件同时满足</text>
  <text class="sub" x="28" y="69">原章常规流程的概念解释；团队也可要求更多 LGTM</text>
  <rect class="node" x="28" y="108" width="205" height="104" rx="7"/>
  <text class="label" x="130" y="139">LGTM ≥ 1</text>
  <text class="body" x="130" y="168">同伴认可实现</text>
  <text class="note" x="130" y="197">评审者授予／撤销</text>
  <rect class="node" x="257" y="108" width="205" height="104" rx="7"/>
  <text class="label" x="359" y="139">Approval 齐备</text>
  <text class="body" x="359" y="168">准入责任已覆盖</text>
  <text class="note" x="359" y="197">评审者授予／撤销</text>
  <rect class="node" x="486" y="108" width="206" height="104" rx="7"/>
  <text class="label" x="589" y="139">未解决评论 = 0</text>
  <text class="body" x="589" y="168">待处理讨论已结束</text>
  <text class="note" x="589" y="197">作者回应后可解决</text>
  <path class="join" d="M130 212V231H589V212M359 212V231"/>
  <path class="flow" d="M359 231V245"/>
  <rect class="ready" x="160" y="252" width="400" height="50" rx="7"/>
  <text class="label" x="360" y="284">评审条件齐备</text>
  <path class="flow" d="M360 308V328"/>
  <rect class="node" x="160" y="335" width="400" height="50" rx="7"/>
  <text class="label" x="360" y="367">提交时 presubmit 检查通过</text>
  <path class="flow" d="M360 391V411"/>
  <rect class="ready" x="240" y="418" width="240" height="50" rx="7"/>
  <text class="label" x="360" y="450">变更入库</text>
  <text class="sub" x="28" y="496">纵向顺序强调：绿色就绪提示之后，仍有提交检查。</text>
</svg>
