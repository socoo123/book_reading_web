<svg xmlns="http://www.w3.org/2000/svg" width="720" height="432" viewBox="0 0 720 432" role="img" aria-labelledby="title desc">
  <title id="title">任务进度独立于工作实例</title>
  <desc id="desc">任务队列把块交给工作进程，完成结果与块记录保存在持久存储中。旧实例失效后平台自动补建新实例，新实例重新领取未确认块，已经确认的结果继续保留。一个块仍可能重复执行。</desc>
  <!-- Original editable hand-written SVG; web export is an identical copy. -->
  <style>
    :root { color-scheme: light dark; --bg: #fcfbf8; --text: #292824; --muted: #655f55; --line: #81786a; --box: #efede7; --focus: #f3e9d9; --accent: #9a4d32; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; } }
    :root[data-theme='dark'] { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; }
    text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .heading { font-size: 22px; font-weight: 600; }
    .sub { font-size: 15px; fill: var(--muted); }
    .label { font-size: 18px; font-weight: 600; text-anchor: middle; }
    .body { font-size: 16px; text-anchor: middle; }
    .note { font-size: 14px; fill: var(--muted); text-anchor: middle; }
    .node { fill: var(--box); stroke: var(--line); stroke-width: 1.3; }
    .focus { fill: var(--focus); stroke: var(--accent); stroke-width: 1.4; }
    .flow { fill: none; stroke: var(--line); stroke-width: 1.8; marker-end: url(#arrow); }
    .replacement { stroke-dasharray: 5 5; }
    .divider { stroke: var(--line); stroke-width: 1; }
  </style>
  <script><![CDATA[
    try {
      const theme = localStorage.getItem('reading-notes-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch {}
  ]]></script>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--line)"/></marker></defs>
  <rect width="720" height="432" rx="10" fill="var(--bg)"/>
  <text class="heading" x="28" y="40">实例可替换，进度留在实例之外</text>
  <text class="sub" x="28" y="69">前提：完成确认独立保存；一个任务块仍可能重复执行</text>
  <rect class="node" x="28" y="98" width="190" height="100" rx="7"/>
  <text class="label" x="123" y="132">待处理任务块</text>
  <text class="body" x="123" y="164">k、k+1、k+2 …</text>
  <rect class="node" x="280" y="98" width="160" height="100" rx="7"/>
  <text class="label" x="360" y="132">旧实例</text>
  <text class="body" x="360" y="164">正在处理第 k 块</text>
  <rect class="focus" x="492" y="98" width="200" height="274" rx="7"/>
  <text class="label" x="592" y="134">持久完成记录</text>
  <text class="body" x="592" y="166">结果 ＋ 已完成块</text>
  <path class="divider" d="M512 204H672"/>
  <text class="body" x="592" y="250">已确认的继续保留</text>
  <text class="body" x="592" y="283">未确认的可以再领</text>
  <text class="note" x="592" y="339">与实例生命周期分离</text>
  <path class="flow" d="M218 148H270"/>
  <text class="note" x="248" y="128">领取</text>
  <path class="flow" d="M440 148H482"/>
  <text class="note" x="466" y="128">确认</text>
  <rect class="node" x="280" y="280" width="160" height="92" rx="7"/>
  <text class="label" x="360" y="315">新实例</text>
  <text class="body" x="360" y="346">接续未确认块</text>
  <path class="flow replacement" d="M360 208V270"/>
  <text class="note" x="298" y="242">失效后补建</text>
  <path class="flow" d="M123 208V326H270"/>
  <text class="note" x="195" y="308">重新领取</text>
  <path class="flow" d="M440 326H482"/>
  <text class="note" x="466" y="306">确认</text>
  <text class="note" x="360" y="409">实线：领取和确认　　虚线：平台自动替换实例</text>
</svg>
