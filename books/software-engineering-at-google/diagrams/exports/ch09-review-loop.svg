<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
  <title id="title">一次代码评审：从上传快照到提交</title>
  <desc id="desc">按书中描述的 Google 流程：作者上传包含说明的变更快照，先看自动检查结果、自己通读一遍，再发送给评审者。评审者约在一个工作日内响应，提出需要处理的意见或仅供了解的 FYI；作者修改、上传新快照并回复，这一段可以往返多轮。评审者满意后给出 LGTM，作者处理完意见、所需批准齐备后提交。一个工作日只约束初次响应，整个评审可以更久。实线表示依次推进，虚线表示修改后回到评审者。</desc>
  <!-- Original editable hand-written SVG; web export is an identical copy. -->
  <style>
    :root { color-scheme: light dark; --bg: #fcfbf8; --text: #292824; --muted: #655f55; --line: #81786a; --box: #efede7; --focus: #f3e9d9; --accent: #9a4d32; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; } }
    :root[data-theme='dark'] { --bg: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #383027; --accent: #e0a98d; }
    text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .heading { font-size: 22px; font-weight: 600; }
    .sub { font-size: 15px; fill: var(--muted); }
    .label { font-size: 18px; font-weight: 600; text-anchor: middle; }
    .body { font-size: 16px; text-anchor: middle; }
    .note { font-size: 14px; fill: var(--muted); }
    .key { fill: var(--accent); font-weight: 600; }
    .mid { text-anchor: middle; }
    .end { text-anchor: end; }
    .node { fill: var(--box); stroke: var(--line); stroke-width: 1.3; }
    .focus { fill: var(--focus); stroke: var(--accent); stroke-width: 1.4; }
    .flow { fill: none; stroke: var(--line); stroke-width: 1.8; marker-end: url(#arrow); }
    .back { stroke-dasharray: 5 5; }
  </style>
  <script><![CDATA[
    try {
      const theme = localStorage.getItem('reading-notes-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch {}
  ]]></script>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--line)"/></marker></defs>
  <rect width="720" height="460" rx="10" fill="var(--bg)"/>
  <text class="heading" x="30" y="40">一次评审怎样从快照走到提交</text>
  <text class="sub" x="30" y="69">按书中描述的 Google 流程　　实线：依次推进　　虚线：修改后回到评审者</text>

  <rect class="node" x="30" y="96" width="180" height="80" rx="7"/>
  <text class="label" x="120" y="128">上传快照</text>
  <text class="body" x="120" y="156">变更、说明与 diff</text>
  <path class="flow" d="M210 136H260"/>
  <rect class="node" x="270" y="96" width="180" height="80" rx="7"/>
  <text class="label" x="360" y="128">自动检查与自审</text>
  <text class="body" x="360" y="156">先看结果，再通读一遍</text>
  <path class="flow" d="M450 136H500"/>
  <rect class="node" x="510" y="96" width="180" height="80" rx="7"/>
  <text class="label" x="600" y="128">发送评审</text>
  <text class="body" x="600" y="156">通知评审者查看</text>

  <path class="flow" d="M600 176V216"/>
  <text class="note key end" x="590" y="201">约一个工作日内响应</text>

  <rect class="node" x="510" y="226" width="180" height="80" rx="7"/>
  <text class="label" x="600" y="258">评审者评论</text>
  <text class="body" x="600" y="286">需处理的意见与 FYI</text>
  <path class="flow" d="M510 266H460"/>
  <text class="note mid" x="480" y="255">满意时</text>
  <rect class="node" x="270" y="226" width="180" height="80" rx="7"/>
  <text class="label" x="360" y="258">LGTM</text>
  <text class="body" x="360" y="286">行为与理解可接受</text>
  <path class="flow" d="M270 266H220"/>
  <rect class="focus" x="30" y="226" width="180" height="80" rx="7"/>
  <text class="label" x="120" y="258">提交</text>
  <text class="body" x="120" y="286">意见已处理、批准齐备</text>

  <path class="flow" d="M580 306V346"/>
  <path class="flow back" d="M620 356V316"/>
  <text class="note end" x="570" y="336">可往返多轮</text>
  <rect class="node" x="510" y="356" width="180" height="80" rx="7"/>
  <text class="label" x="600" y="388">作者修改并回复</text>
  <text class="body" x="600" y="416">上传新快照</text>

  <text class="sub" x="30" y="390">“约一个工作日”只约束初次响应；</text>
  <text class="sub" x="30" y="416">评论与修改的往返可以持续更久。</text>
</svg>
