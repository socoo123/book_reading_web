<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 764 645.85" width="764" height="645.85" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">B-tree的日志持久化、部分刷页与恢复</title><desc id="diagram-desc">时间向下。WAL先可靠保存，即使数据页只刷出一部分，重启也可按恢复协议修复页和引用关系。</desc>
<style>:root{--surface:#fcfbf8;--text:#292824;--muted:#66645d;--soft:#f0ece4;--accent:#386d74}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--soft:#353534;--accent:#94c8cf}}
:root[data-theme="dark"]{--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--soft:#353534;--accent:#94c8cf}</style><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      </style></defs><rect x="0" y="0" width="764" height="645.85" fill="var(--surface)"></rect><g transform="translate(24 24) rotate(0 234.039306640625 14.375)"><text x="0" y="21.12548828125" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="25px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">B-tree：数据页落后时，日志保留恢复依据</text></g><g transform="translate(24 66) rotate(0 238 9.774999999999999)"><text x="0" y="14.365332031249999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">时间向下；示意已提交更新，不表示盲目重做所有未提交记录。</text></g><g transform="translate(24 137) rotate(0 70.203369140625 12.075000000000003)"><text x="0" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">① WAL 已同步</text></g><g stroke-linecap="round" transform="translate(240 118) rotate(0 250 46)"><path d="M0.98 1.3 L501.14 -0.43 L499.49 90.91 L-0.71 90.94" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C163.83 -0.14, 328.41 -0.59, 500 0 M0 0 C111.42 -0.36, 223.14 -0.33, 500 0 M500 0 C498.89 36.26, 501.02 70.51, 500 92 M500 0 C500.66 19.18, 500.52 37.19, 500 92 M500 92 C380.58 90.99, 260.91 90.64, 0 92 M500 92 C326.86 91.03, 153.81 91.12, 0 92 M0 92 C1.05 63.35, 0.47 36.67, 0 0 M0 92 C0.66 56.99, 1.03 20.56, 0 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(374.5 139.85) rotate(0 115.5 24.14999999999999)"><text x="115.5" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">页修改与