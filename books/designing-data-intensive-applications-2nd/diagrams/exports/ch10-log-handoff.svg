nslate(667.079345703125 223.85) rotate(0 51.920654296875 24.14999999999999)"><text x="51.920654296875" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">节点 C</text><text x="51.920654296875" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">尚未收到 X</text></g><g stroke-linecap="round"><g transform="translate(270 250) rotate(0 29 0)"><path d="M0 0 C22.52 0.11, 44.48 -0.32, 58 0 M0 0 C19.07 0.35, 38.66 0.24, 58 0" stroke="var(--muted)" stroke-width="2" fill="none"></path></g></g><mask></mask><g stroke-linecap="round"><g transform="translate(439 312.5) rotate(0 0 73.5)"><path d="M0 0 C0.78 37.46, 0.34 76.09, 0 147 M0 0 C0.52 46.16, 0.41 91.76, 0 147" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(439 312.5) rotate(0 0 73.5)"><path d="M-8.41 123.46 C-5.87 129.08, -4.13 135.89, 0 147 M-8.41 123.46 C-5.38 131.26, -2.88 138.5, 0 147" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(439 312.5) rotate(0 0 73.5)"><path d="M8.69 123.56 C6.82 129.16, 4.15 135.94, 0 147 M8.69 123.56 C6.41 131.32, 3.59 138.53, 0 147" stroke="var(--accent)" stroke-width="2" fill="none"></path></g></g><mask></mask><g transform="translate(460 356) rotate(0 66.5 21.849999999999994)"><text x="0" y="16.055371093749997" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">B 保留 X</text><text x="0" y="37.90537109374999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">并遵守继承规则</text></g><g transform="translate(72 360) rotate(0 71.50341796875 10.349999999999994)"><text x="0" y="15.2103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">A 与其余节点失联</text></g><g stroke-linecap="round" transform="translate(54 466) rotate(0 105 58)"><path d="M0.9 -0.36 L209.86 0.02 L210.83 116.88 L0.87 116.96" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C69.59 0.26, 138.73 0.1, 210 0 M210 0 C211.66 44.84, 210.42 88.1, 210 116 M210 116 C143.82 117.36, 76.6 117.33, 0 116 M0 116 C0.57 79.94, -0.59 43.41, 0 0" stroke="var(--accent)" stroke-width="1.5" fill="none" stroke-dasharray="8 9"></path></g><g transform="translate(96 499.85) rotate(0 63 24.149999999999977)"><text x="63" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">旧主 A</text><text x="63" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">无法独自提交</text></g><g stroke-linecap="round" transform="translate(334 466) rotate(0 105 58)"><path d="M-0.34 -0.65 L209.44 0.85 L210.54 115.79 L1.03 116.79" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C53.84 -0.15, 107.41 0.52, 210 0 M0 0 C83.52 -1.03, 166.34 -0.82, 210 0 M210 0 C211.09 26.61, 211.06 53.73, 210 116 M210 0 C209.94 33.09, 209.81 67.29, 210 116 M210 116 C154.11 116.79, 97.53 116.87, 0 116 M210 116 C151.81 115.56, 94.19 114.89, 0 116 M0 116 C-1.37 83.38, -0.52 50.03, 0 0 M0 116 C0.09 90.48, -0.79 65.52, 0 0" stroke="var(--accent)" stroke-width="3" fill="none"></path></g><g transform="translate(384.162109375 499.85) rotate(0 54.837890625 24.149999999999977)"><text x="54.837890625" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">新主 B</text><text x="54.837890625" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">携带 X 接管</text></g><g stroke-linecap="round" transform="translate(614 466) rotate(0 105 58)"><path d="M-0.65 -0.56 L210.85 0.54 L209.79 117.03 L0.79 116.97" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C60.36 -0.17, 121.22 0.9, 210 0 M0 0 C74.9 -0.73, 150.11 -1.07, 210 0 M210 0 C210.11 44.47, 210.44 87.79, 210 116 M210 0 C209.95 31.83, 210.73 63.5, 210 116 M210 116 C150.17 117.54, 89.63 116.52, 0 116 M210 116 C160.7 116.1, 110.33 115.68, 0 116 M0 116 C0.8 72.77, 0.6 28.58, 0 0 M0 116 C0.33 75.79, 0.61 36.4, 0 0" stroke="var(--accent)" stroke-width="3" fill="none"></path></g><g transform="translate(664.741455078125 499.85) rotate(0 54.258544921875 24.149999999999977)"><text x="54.258544921875" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">节点 C</text><text x="54.258544921875" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">从 B 补齐 X</text></g><g stroke-linecap="round"><g transform="translate(550.5 524) rotate(0 28.5 0)"><path d="M0 0 C18.71 0.75, 38.48 0.52, 57 0 M0 0 C21.76 0.15, 43.23 0.45, 57 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(550.5 524) rotate(0 28.5 0)"><path d="M33.65 8.92 C41.28 6.77, 49.98 3.6, 57 0 M33.65 8.92 C42.52 5.62, 51.13 2.52, 57 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(550.5 524) rotate(0 28.5 0)"><path d="M33.37 -8.17 C41.1 -4.7, 49.89 -2.24, 57 0 M33.37 -8.17 C42.4 -4.94, 51.12 -1.51, 57 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g></g><mask></mask><g transform="translate(24 626) rotate(0 240.064453125 12.074999999999989)"><text x="0" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">任期 8：B + C 形成新多数派；已提交 X 不能被推翻</text></g><g transform="translate(24 686) rotate(0 284.994140625 20.69999999999999)"><text x="0" y="15.2103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">粗框：该阶段多数派　虚框：落后／失联节点</text><text x="0" y="35.9103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">交集还需持久任期、投票限制与日志继承；不是“碰到同一节点就安全”。</text></g><script><![CDATA[try{const t=localStorage.getItem('reading-notes-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch{}]]></script></svg>
