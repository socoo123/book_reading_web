<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 751.4" width="848" height="751.4" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">多数派交接必须保留已提交历史</title><desc id="diagram-desc">任期7的A和B保存当前任期条目X并提交，任期8由携带X的B与C接管；共同节点B需要遵循持久记忆和日志继承规则。</desc>
<style>:root{--surface:#fcfbf8;--text:#292824;--muted:#66645d;--soft:#f0ece4;--accent:#386d74}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--soft:#353534;--accent:#94c8cf}}
:root[data-theme="dark"]{--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--soft:#353534;--accent:#94c8cf}</style><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      </style></defs><rect x="0" y="0" width="848" height="751.4" fill="var(--surface)"></rect><g transform="translate(24 24) rotate(0 187.5 14.375)"><text x="0" y="21.12548828125" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="25px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">日志接管：交集是证据相遇的地方</text></g><g transform="translate(24 68) rotate(0 227.1591796875 9.774999999999999)"><text x="0" y="14.365332031249999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">固定三投票节点，多数派为 2；X 是任期 7、槽位 8 的条目。</text></g><g transform="translate(24 124) rotate(0 231.90234375 12.075000000000003)"><text x="0" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">任期 7：A + B 持久保存当前任期的 X → 可以提交</text></g><g stroke-linecap="round" transform="translate(54 190) rotate(0 105 58)"><path d="M0.33 -0.99 L210.51 -1.05 L210.78 115.44 L-1 115.99" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C64.58 -1.06, 128 -0.55, 210 0 M0 0 C69.43 0.21, 138.64 0.12, 210 0 M210 0 C211.66 44.84, 210.42 88.1, 210 116 M210 0 C209.77 37.07, 209.43 73.85, 210 116 M210 116 C144.75 115.92, 78.04 115.69, 0 116 M210 116 C131.33 116.24, 53.02 116.26, 0 116 M0 116 C-0.74 71.61, 1.07 28.52, 0 0 M0 116 C-0.14 86.64, 0.37 58.14, 0 0" stroke="var(--accent)" stroke-width="3" fill="none"></path></g><g transform="translate(117.579345703125 223.85) rotate(0 41.420654296875 24.14999999999999)"><text x="41.420654296875" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" dir