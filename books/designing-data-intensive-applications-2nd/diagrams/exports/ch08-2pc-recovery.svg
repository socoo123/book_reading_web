anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Q 已提交，</text><text x="0" y="37.90537109374999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">不会因 C 崩溃</text><text x="0" y="59.75537109374999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">自动回滚。</text></g><g stroke-linecap="round"><g transform="translate(414 412.5) rotate(0 0 38.5)"><path d="M0 0 C0.04 24.37, 0.35 48.86, 0 77 M0 0 C-0.24 27.17, 0.22 53.59, 0 77" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(414 412.5) rotate(0 0 38.5)"><path d="M-8.49 53.49 C-5.82 60.6, -2.77 67.87, 0 77 M-8.49 53.49 C-5.94 62.12, -2.54 70, 0 77" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(414 412.5) rotate(0 0 38.5)"><path d="M8.61 53.53 C5.77 60.7, 3.32 67.95, 0 77 M8.61 53.53 C5.23 62.13, 2.71 70, 0 77" stroke="var(--accent)" stroke-width="2" fill="none"></path></g></g><mask></mask><g stroke-linecap="round" transform="translate(294 496) rotate(0 120 47)"><path d="M-0.06 0.69 L239.28 0.35 L239 93.33 L0.22 93.06" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C80.41 0.34, 160.95 0.59, 240 0 M0 0 C86.61 1.11, 172.49 0.72, 240 0 M240 0 C240.43 33.17, 240.98 65.48, 240 94 M240 0 C239.77 32.42, 239.33 64.94, 240 94 M240 94 C145.21 95.62, 50.29 95.1, 0 94 M240 94 C189.65 93.22, 139.03 93.64, 0 94 M0 94 C-0.73 58.64, 0.17 24.75, 0 0 M0 94 C-0.64 60.79, -0.17 27.1, 0 0" stroke="var(--accent)" stroke-width="3" fill="none"></path></g><g transform="translate(324.76025390625 518.85) rotate(0 89.23974609375 24.149999999999977)"><text x="89.23974609375" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">恢复者读取原日志</text><text x="89.23974609375" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">仍为 T → COMMIT</text></g><g stroke-linecap="round"><g transform="translate(288 546.5) rotate(0 -84 38.25)"><path d="M0 0 C-63.67 -1.27, -127.3 -0.15, -168 -0.5 M0 0 C-48.63 0.85, -97.64 0.77, -168 -0.5 M-168 -0.5 C-168.02 24.3, -168.83 48.04, -168 77 M-168 -0.5 C-168.49 15.79, -168.68 32.84, -168 77" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(288 546.5) rotate(0 -84 38.25)"><path d="M-176.83 53.61 C-173.27 61.8, -169.66 72.01, -168 77 M-176.83 53.61 C-174.38 60.54, -172.21 67.38, -168 77" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(288 546.5) rotate(0 -84 38.25)"><path d="M-159.73 53.41 C-162.67 61.63, -165.56 71.92, -168 77 M-159.73 53.41 C-162.23 60.48, -165.01 67.37, -168 77" stroke="var(--accent)" stroke-width="2" fill="none"></path></g></g><mask></mask><g transform="translate(24 506) rotate(0 42.5 9.774999999999977)"><text x="0" y="14.365332031249999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">重发原决定</text></g><g stroke-linecap="round" transform="translate(24 630) rotate(0 96 43)"><path d="M0.35 -1 L191.33 0.22 L191.06 87.12 L0.17 86.78" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C50.05 1.54, 98.86 -0.28, 192 0 M0 0 C75.28 -0.15, 151.55 -0.36, 192 0 M192 0 C190.86 29.07, 190.89 56.29, 192 86 M192 0 C191.16 30.14, 192 59.51, 192 86 M192 86 C129.63 85.41, 66.14