<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 807.55" width="830" height="807.55" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">协调者恢复后重发同一个决定</title><desc id="diagram-desc">C持久记录COMMIT，Q完成但P未获通知，C崩溃；P保留prepared和锁，恢复的C读原日志并重发COMMIT。</desc>
