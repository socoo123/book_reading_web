<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 943 678.7" width="943" height="678.7" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">排序合并连接的一个用户组</title><desc id="diagram-desc">档案先于事件排序，一对多连接保存一份档案并逐条输出，下一阶段改按URL分组。</desc>
