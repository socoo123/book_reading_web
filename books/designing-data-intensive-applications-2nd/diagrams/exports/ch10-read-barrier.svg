<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 772 814.7" width="772" height="814.7" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">线性一致读的三类证据</title><desc id="diagram-desc">新主先建立当前任期提交依据，为当前读记录读位置并获得匹配的多数派确认，再等待状态机应用到读位置，才返回。</desc>
<style>:root{--surface:#fcfbf8;--text:#292824;--muted:#66645d;--soft:#f0ece4;--accent:#386d74}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--soft:#353534;--accent:#94c8cf}}
:root[data-theme="dark"]{--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--soft:#353534;--accent:#94c8cf}</style><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      </style></defs><rect x="0" y="0" width="772" height="814.7" fill="var(--surface)"></rect><g transform="translate(24 24) rotate(0 262.5 14.375)"><text x="0" y="21.12548828125" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="25px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">安全读取：资格、提交知识、应用进度缺一不可</text></g><g transform="translate(24 68) rotate(0 225.287353515625 9.774999999999999)"><text x="0" y="14.365332031249999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">无租约的 Raft ReadIndex 路径；箭头表示完成条件的依赖。</text></g><g stroke-linecap="round" transform="translate(24 132) rotate(0 226 50)"><path d="M-0.5 -0.06 L453.08 0.28 L451.57 99.08 L0.48 100.98" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C139.34 -0.42, 278.82 -1.03, 452 0 M0 0 C125.61 -0.54, 251.99 -0.22, 452 0 M452 0 C451.38 29.87, 452.48 60.65, 452 100 M452 0 C451.87 36.72, 451.66 73.03, 452 100 M452 100 C346.93 99.67, 242.62 99.02, 0 100 M452 100 C291.77 101.38, 131.13 101.35, 0 100 M0 100 C0.52 64.95, -1.36 31.37, 0 0 M0 100 C-0.85 71.54, -0.15 43.18, 0 0" stroke="var(--accent)" stroke-width="1" fill="none"></path></g><g transform="translate(103 157.85) rotate(0 147 24.14999999999999)"><text x="147" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">① 新主建立当前任期提交依据</text><text x="147" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">常用方式：提交当前任期空操作</text></g><g transform="translate(514 152) rotate(0 104.5 21.849999999999994)"><text x="0" y="16.055371093749997" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">通常每任期建立一次，</text><text x="0" y="37.90537109374999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">不是每次读都写空操作。</text></g><g stroke-linecap="round"><g transform="translate(250 238.5) rotate(0 0 26.5)"><path d="M0 0 C0.13 18.7, -0.23 37.89, 0 53 M0 0 C0.11 17, -0.27 33.67, 0 53" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(250 238.5) rotate(0 0 26.5)"><path d="M-8.69 29.56 C-5.42 37.57, -2.64 46.1, 0 53 M-8.69 29.56 C-5.66 37.15, -3.26 44.39, 0 53" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(250 238.5) rotate(0 0 26.5)"><path d="M8.41 29.46 C5.52 37.56, 2.12 46.12, 0 53 M8.41 29.46 C5.97 37, 2.91 44.27, 0 53" stroke="var(--accent)" stroke-width="2" fill="none"></path></g></g><mask></mask><g stroke-linecap="round" transform="translate(24 298) rotate(0 226 60)"><path d="M0.28 -0.43 L451.08 0.48 L452.98 120.43 L-0.62 120.4" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C133.31 -0.31, 266.9 -0.08, 452 0 M0 0 C90.77 -0.97, 181.35 -0.68, 452 0 M452 0 C453.1 32.88, 451.19 64.25, 452 120 M452 0 C453.08 41.6, 452.53 83.78, 452 120 M452 120 C345.22 120.37, 239.31 120.58, 0 120 M452 120 C288.28 119.86, 124.47 119.63, 0 120 M0 120 C0.5 73.77, 1.49 27.13, 0 0 M0 120 C-0.13 90.12, 0.33 61.28, 0 0" stroke="var(--accent)" stroke-width="1" fill="none"></path></g><g transform="translate(113.5 321.775) rotate(0 136.5 36.224999999999994)"><text x="136.5" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">② 为当前读记录安全读位置</text><text x="136.5" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">等待与该读匹配的多数派确认</text><text x="136.5" y="66.04541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">得到可使用的 readIndex</text></g><g transform="translate(514 322) rotate(0 95 21.849999999999994)"><text x="0" y="16.055371093749997" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">隔离旧主：拿不到确认</text><text x="0" y="37.90537109374999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">→ 不能凭“我是主”返回</text></g><g stroke-linecap="round"><g transform="translate(250 424.5) rotate(0 0 26.5)"><path d="M0 0 C-0.45 16.87, -1.1 32.36, 0 53 M0 0 C-0.16 20.29, -0.13 39.64, 0 53" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(250 424.5) rotate(0 0 26.5)"><path d="M-8.7 29.56 C-6.36 37.14, -4.27 43.33, 0 53 M-8.7 29.56 C-5.63 38.8, -2.34 47.11, 0 53" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(250 424.5) rotate(0 0 26.5)"><path d="M8.4 29.45 C5.36 37.05, 2.07 43.27, 0 53 M8.4 29.45 C5.08 38.73, 1.98 47.08, 0 53" stroke="var(--accent)" stroke-width="2" fill="none"></path></g></g><mask></mask><g stroke-linecap="round" transform="translate(24 484) rotate(0 226 50)"><path d="M0.48 0.98 L452.43 -0.62 L452.4 100.36 L-0.13 101.01" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C116.78 -0.13, 232.76 0.87, 452 0 M0 0 C141.54 0.41, 282.54 0.68, 452 0 M452 0 C452.36 39.37, 453.3 77.72, 452 100 M452 0 C451.36 38.37, 451.76 77.54, 452 100 M452 100 C355.5 100.11, 258.31 99.64, 0 100 M452 100 C292.19 101.27, 132.43 100.82, 0 100 M0 100 C-0.74 68.7, -0.49 39.44, 0 0 M0 100 C0.79 78.34, 0.04 55.94, 0 0" stroke="var(--accent)" stroke-width="1" fill="none"></path></g><g transform="translate(132.15185546875 509.85) rotate(0 117.84814453125 24.149999999999977)"><text x="117.84814453125" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">③ 等待本地状态机追上</text><text x="117.84814453125" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">appliedIndex ≥ readIndex</text></g><g transform="translate(514 502) rotate(0 114.552001953125 21.850000000000023)"><text x="0" y="16.055371093749997" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">日志到 50，应用到 48：</text><text x="0" y="37.90537109374999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">→ 仍须等条目 49、50 执行</text></g><g stroke-linecap="round"><g transform="translate(250 590.5) rotate(0 0 26.5)"><path d="M0 0 C-0.94 14.82, 0.18 28.14, 0 53 M0 0 C0.29 14.14, 0.69 28, 0 53" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(250 590.5) rotate(0 0 26.5)"><path d="M-8.12 29.36 C-6.93 36.42, -3.66 41.94, 0 53 M-8.12 29.36 C-5.86 35.84, -3.33 42.03, 0 53" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(250 590.5) rotate(0 0 26.5)"><path d="M8.98 29.67 C5.63 36.56, 4.35 42, 0 53 M8.98 29.67 C6.77 36.04, 4.84 42.15, 0 53" stroke="var(--accent)" stroke-width="2" fill="none"></path></g></g><mask></mask><g stroke-linecap="round" transform="translate(24 650) rotate(0 226 38)"><path d="M-0.62 0.4 L452.36 -0.13 L453.01 76.42 L-1.08 75.86" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C144.85 1.36, 288.83 1.06, 452 0 M0 0 C179.22 0.17, 358.28 -0.29, 452 0 M452 0 C452.41 23.77, 451.41 45.39, 452 76 M452 0 C451.73 19.42, 452.03 39.76, 452 76 M452 76 C274.65 77.13, 97.78 77.28, 0 76 M452 76 C333.88 75.26, 216.14 75.5, 0 76 M0 76 C1.01 57.57, -0.26 41.05, 0 0 M0 76 C-0.57 46.6, 0.38 16.93, 0 0" stroke="var(--accent)" stroke-width="1" fill="none"></path></g><g transform="translate(145 675.925) rotate(0 105 12.074999999999989)"><text x="105" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">读取状态机，然后返回</text></g><g transform="translate(514 658) rotate(0 117 20.69999999999999)"><text x="0" y="15.2103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">从节点也可取得安全读位置，</text><text x="0" y="35.9103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">等自己应用完成后服务读。</text></g><g transform="translate(24 770) rotate(0 234 10.350000000000023)"><text x="0" y="15.2103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">租约读可摊销资格确认，但必须另外证明时间与租约假设。</text></g><script><![CDATA[try{const t=localStorage.getItem('reading-notes-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch{}]]></script></svg>
