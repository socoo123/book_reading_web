<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 813.5 679.4" width="813.5" height="679.4" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">与写并发的两次读，也必须共享同一个顺序</title><desc id="diagram-desc">写W在2到10之间，A在3到4返回1，B在5到6若返回0则矛盾；W必须先于A，而A实时先于B。</desc>
