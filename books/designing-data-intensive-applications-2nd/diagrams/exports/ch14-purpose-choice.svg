<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 729 597.55" width="729" height="597.55" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">同一份病历的不同用途</title><desc id="diagram-desc">患者愿意让研究者为约定研究使用病历；向就业或保险判断扩展用途不由研究同意自动涵盖。</desc>
<style>:root{--surface:#fcfbf8;--text:#292824;--muted:#66645d;--soft:#f0ece4;--accent:#386d74}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--soft:#353534;--accent:#94c8cf}}
:root[data-theme="dark"]{--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--soft:#353534;--accent:#94c8cf}</style><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      </style></defs><rect x="0" y="0" width="729" height="597.55" fill="var(--surface)"></rect><g transform="translate(24 24) rotate(0 200 14.375)"><text x="0" y="21.12548828125" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="25px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">同一份病历，不同用途需要不同判断</text></g><g transform="translate(24 70) rotate(0 212.5 9.774999999999999)"><text x="0" y="14.365332031249999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">原书罕见病案例：愿意帮助研究，不等于放弃用途选择。</text></g><g stroke-linecap="round" transform="translate(24 154) rotate(0 125 50)"><path d="M-0.5 -0.22 L249.2 1.18 L250.87 100.1 L1.28 98.64" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C97.6 0.25, 196.7 -0.04, 250 0 M0 0 C73.61 -0.67, 147.16 -0.2, 250 0 M250 0 C249.23 34.8, 249.76 68.61, 250 100 M250 0 C250.48 25.63, 249.53 51.81, 250 100 M250 100 C170.2 99.3, 91.11 99.55, 0 100 M250 100 C179.03 101.27, 109.41 101.37, 0 100 M0 100 C-1.29 80.03, 0.32 58.38, 0 0 M0 100 C-0.11 60.41, -0.28 19.64, 0 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(54.5 179.85) rotate(0 94.5 24.14999999999999)"><text x="94.5" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">患者的病历</text><text x="94.5" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">由本人作出知情选择</text></g><g stroke-linecap="round" transform="translate(455 154) rotate(0 125 50)"><path d="M-0.22 -0.8 L251.18 0.87 L250.1 101.28 L-1.36 98.66" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C57.6 0.71, 114.61 1.26, 250 0 M0 0 C83.52 -0.09, 167.98 0.04, 250 0 M250 0 C251.05 36.86, 251.09 74.73, 250 100 M250 0 C249.4 30.38, 249.46 61.95, 250 100 M250 100 C171.92 98.3, 94.64 98.87, 0 100 M250 100 C197.18 99.51, 144.04 98.44, 0 100 M0 100 C1.21 62.89, 0.19 25.38, 0 0 M0 100 C0.51 61.86, -0.43 22.85, 0 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(517 179.85) rotate(0 63 24.14999999999999)"><text x="63" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">研究者</text><text x="63" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">用于约定研究</text></g><g stroke-linecap="round" transform="translate(455 369) rotate(0 125 50)"><path d="M-0.8 1.18 L250.87 0.1 L251.28 98.64 L-1.34 101.35" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C75.56 -0.36, 152.29 0.02, 250 0 M0 0 C78.75 1.17, 157.53 1.6, 250 0 M250 0 C248.57 31.29, 248.8 60.57, 250 100 M250 0 C249.89 27.98, 250.53 56.89, 250 100 M250 100 C176.68 98.99, 104.7 98.31, 0 100 M250 100 C160.49 101.54, 69.39 101.49, 0 100 M0 100 C1.25 77.55, 1.74 57.01, 0 0 M0 100 C-0.18 73.07, -0.73 47.43, 0 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(506.5 394.85) rotate(0 73.5 24.150000000000006)"><text x="73.5" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">就业／保险判断</text><text x="73.5" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">另一种用途</text></g><g stroke-linecap="round"><g transform="translate(284.5 204) rotate(0 80 0)"><path d="M0 0 C33.14 0.53, 66.7 0.81, 160 0 M0 0 C50.03 0.09, 100.57 -0.15, 160 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(284.5 204) rotate(0 80 0)"><path d="M136.5 8.53 C141.38 6.77, 146.71 5.29, 160 0 M136.5 8.53 C143.91 6.1, 151.78 3.19, 160 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(284.5 204) rotate(0 80 0)"><path d="M136.52 -8.57 C141.43 -6.79, 146.75 -4.73, 160 0 M136.52 -8.57 C143.82 -5.65, 151.68 -3.22, 160 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g></g><mask></mask><g stroke-linecap="round"><g transform="translate(580 264.5) rotate(0 0 47)"><path d="M0 0 C-0.44 31.28, -0.15 61.74, 0 94" stroke="var(--accent)" stroke-width="2.5" fill="none" stroke-dasharray="8 10"></path></g><g transform="translate(580 264.5) rotate(0 0 47)"><path d="M-8.67 70.55 C-6 78.73, -2.88 86.08, 0 94" stroke="var(--accent)" stroke-width="2.5" fill="none"></path></g><g transform="translate(580 264.5) rotate(0 0 47)"><path d="M8.43 70.46 C5.5 78.68, 3.02 86.06, 0 94" stroke="var(--accent)" stroke-width="2.5" fill="none"></path></g></g><mask></mask><g transform="translate(310 167) rotate(0 36 10.349999999999994)"><text x="0" y="15.2103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">愿意分享</text></g><g transform="translate(600 295) rotate(0 36 10.349999999999994)"><text x="0" y="15.2103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">用途扩展</text></g><g transform="translate(24 359) rotate(0 100 23)"><text x="0" y="16.900390625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">研究同意</text><text x="0" y="39.900390625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">不自动涵盖另一个用途</text></g><g transform="translate(24 519) rotate(0 238 9.774999999999977)"><text x="0" y="14.365332031249999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">实线：约定分享　虚线：需另行判断的用途，不表示已获许可。</text></g><g transform="translate(24 554) rotate(0 187 9.774999999999977)"><text x="0" y="14.365332031249999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">本图说明个人选择；不把同意写成唯一法律依据。</text></g><script><![CDATA[try{const t=localStorage.getItem('reading-notes-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch{}]]></script></svg>
