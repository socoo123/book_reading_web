orm="translate(310 558) rotate(0 68 9.774999999999977)"><text x="0" y="14.365332031249999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">未传递时钟上下文</text></g><g stroke-linecap="round" transform="translate(24 640) rotate(0 395 48)"><path d="M-0.34 -0.77 L788.8 -0.62 L790.4 96.71 L-0.07 95.73" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C298.2 -1.58, 596.15 -1.46, 790 0 M0 0 C174.01 0.37, 347.55 0.72, 790 0 M790 0 C789.88 22.45, 789.83 44.01, 790 96 M790 0 C790.1 25.08, 790.77 50.92, 790 96 M790 96 C539 95.41, 288.27 94.65, 0 96 M790 96 C565.57 97.96, 340.89 97.66, 0 96 M0 96 C0.61 60.86, -0.86 24.08, 0 0 M0 96 C0.69 74.49, 0.12 53.05, 0 0" stroke="var(--accent)" stroke-width="1" fill="none"></path></g><g transform="translate(181.0068359375 663.85) rotate(0 237.9931640625 24.149999999999977)"><text x="237.9931640625" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">快照 13：照片 12 已可见，私密设置 15 却不可见</text><text x="237.9931640625" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">系统仍读到先前的“公开”，违背用户的实际操作顺序</text></g><g transform="translate(24 772) rotate(0 279 10.350000000000023)"><text x="0" y="15.2103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">上方箭头：系统消息依赖　下方箭头：用户行动顺序，非数据库消息。</text></g><script><![CDATA[try{const t=localStorage.getItem('reading-notes-theme');if(t==='light'||t==='dark')document