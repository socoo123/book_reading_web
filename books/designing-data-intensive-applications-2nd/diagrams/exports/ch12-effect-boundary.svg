<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 812 801.55" width="812" height="801.55" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">恰好一次的保证必须跨越实际提交边界</title><desc id="diagram-desc">输入位点、受管状态和输出可由同一处理协议协调；外部邮件支付不自动加入，需稳定业务ID和接收方原子去重或提交合作。</desc>
<style>:root{--surface:#fcfbf8;--text:#292824;--muted:#66645d;--soft:#f0ece4;--accent:#386d74}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--soft:#353534;--accent:#94c8cf}}
:root[data-theme="dark"]{--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--soft:#353534;--accent:#94c8cf}</style><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      </style></defs><rect x="0" y="0" width="812" height="801.55" fill="var(--surface)"></rect><g transform="translate(24 24) rotate(0 212.5 14.375)"><text x="0" y="21.12548828125" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="25px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">恰好一次：先标明协议能管理哪些效果</text></g><g transform="translate(24 68) rotate(0 178.5 9.774999999999999)"><text x="0" y="14.365332031249999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">执行可以重试；要约束的是可见效果是否重复。</text></g><g stroke-linecap="round" transform="translate(24 128) rotate(0 382 143)"><path d="M0 0 C289.96 -1.67, 579.12 -1.44, 764 0 M764 0 C762.67 113.28, 763.9 226.3, 764 286 M764 286 C461.15 287.34, 158.1 287.46, 0 286 M0 286 C1.46 179.98, 0.45 72.71, 0 0" stroke="var(--accent)" stroke-width="1.5" fill="none" stroke-dasharray="8 9"></path></g><g transform="translate(46 150) rotate(0 178.5 12.075000000000003)"><text x="0" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">明确的处理／提交协议范围（概念图）</text></g><g stroke-linecap="round" transform="translate(48 224) rotate(0 104 57)"><path d="M0.08 0.5 L208.7 -1.02 L208.45 113.74 L0.9 113.15" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C76.87 0.56, 154.77 0.51, 208 0 M0 0 C67.37 -0.17, 134.8 -0.34, 208 0 M208 0 C209 41.93, 209.2 80.89, 208 114 M208 0 C207.65 29.83, 208.19 59.18, 208 114 M208 114 C157.57 113.72, 105.1 114.74, 0 114 M208 114 C143.66 114.56, 80.37 113.75, 0 114 M0 114 C0.75 70.92, 0.76 28.53, 0 0 M0 114 C0.13 85.13, 0.17 56, 0 0" stroke="var(--accent)" stroke-width="1" fill="none"></path></g><g transform="translate(78.5 256.85) rotate(0 73.5 24.14999999999999)"><text x="73.5" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">输入位点</text><text x="73.5" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">恢复到正确前缀</text></g><g stroke-linecap="round" transform="translate(302 224) rotate(0 104 57)"><path d="M0.5 0.7 L206.98 0.45 L207.74 114.9 L-0.85 114.01" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C79.21 1.02, 158.72 0.25, 208 0 M0 0 C43.5 0.03, 86.72 -0.16, 208 0 M208 0 C209.25 40.59, 207.19 78.97, 208 114 M208 0 C208.43 36.98, 207.91 73.61, 208 114 M208 114 C165.61 114.91, 124.31 115.09, 0 114 M208 114 C134.06 113.56, 58.98 113.62, 0 114 M0 114 C-0.2 83.89, -0.11 52.16, 0 0 M0 114 C0.76 83.62, 0.72 53.41, 0 0" stroke="var(--accent)" stroke-width="1" fill="none"></path></g><g transform="translate(353.5 256.85) rotate(0 52.5 24.14999999999999)"><text x="52.5" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">受管状态</text><text x="52.5" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">与位点一致</text></g><g stroke-linecap="round" transform="translate(556 224) rotate(0 104 57)"><path d="M0.7 -1.02 L208.45 -0.26 L208.9 113.15 L0.01 114.19" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C46.18 -0.04, 90.58 -0.61, 208 0 M0 0 C68.08 -0.29, 135.45 0.04, 208 0 M208 0 C209.25 38.75, 207.92 80.08, 208 114 M208 0 C207.43 41.22, 207.09 82.94, 208 114 M208 114 C149.47 114.88, 91.21 114.53, 0 114 M208 114 C141.76 114.23, 75.27 114.53, 0 114 M0 114 C0.24 85.96, -0.85 58.52, 0 0 M0 114 C0.06 89.02, 0.16 63.93, 0 0" stroke="var(--accent)" stroke-width="1" fill="none"></path></g><g transform="translate(586.5 256.85) rotate(0 73.5 24.14999999999999)"><text x="73.5" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">输出记录</text><text x="73.5" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">提交或原子去重</text></g><g stroke-linecap="round"><g transform="translate(262.5 280) rotate(0 16.5 0)"><path d="M0 0 C9.68 0.04, 19.29 0.05, 33 0 M0 0 C11.3 0.07, 22.78 0.05, 33 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(262.5 280) rotate(0 16.5 0)"><path d="M17.51 5.7 C22 4.05, 26.41 2.35, 33 0 M17.51 5.7 C22.8 3.83, 28.25 1.85, 33 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(262.5 280) rotate(0 16.5 0)"><path d="M17.48 -5.59 C21.96 -3.86, 26.38 -2.18, 33 0 M17.48 -5.59 C22.78 -3.58, 28.24 -1.69, 33 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g></g><mask></mask><g stroke-linecap="round"><g transform="translate(516.5 280) rotate(0 16.5 0)"><path d="M0 0 C8.92 -0.43, 17.73 0.25, 33 0 M0 0 C10.71 0.13, 21.25 0.15, 33 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(516.5 280) rotate(0 16.5 0)"><path d="M17.55 5.78 C21.75 3.88, 25.88 2.89, 33 0 M17.55 5.78 C22.6 4.03, 27.53 2.2, 33 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(516.5 280) rotate(0 16.5 0)"><path d="M17.45 -5.51 C21.7 -4.4, 25.86 -2.37, 33 0 M17.45 -5.51 C22.56 -3.64, 27.52 -1.86, 33 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g></g><mask></mask><g transform="translate(48 372) rotate(0 198 10.349999999999994)"><text x="0" y="15.2103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">框内不是自动成立：必须有实际事务或恢复协议。</text></g><g stroke-linecap="round"><g transform="translate(660 420.5) rotate(0 0 50.5)"><path d="M0 0 C0.36 26.87, 0.32 53.84, 0 101 M0 0 C0.55 29.27, 0.68 58.34, 0 101" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(660 420.5) rotate(0 0 50.5)"><path d="M-8.28 77.41 C-5.84 84.06, -3.72 90.76, 0 101 M-8.28 77.41 C-5.58 84.44, -3.08 91.3, 0 101" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(660 420.5) rotate(0 0 50.5)"><path d="M8.82 77.61 C6.79 84.12, 4.43 90.78, 0 101 M8.82 77.61 C6.61 84.62, 4.21 91.42, 0 101" stroke="var(--accent)" stroke-width="2" fill="none"></path></g></g><mask></mask><g transform="translate(224 456) rotate(0 126 10.349999999999994)"><text x="0" y="15.2103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">跨界调用不会随状态恢复而撤销</text></g><g stroke-linecap="round" transform="translate(478 528) rotate(0 155 59)"><path d="M0.01 0.19 L308.95 -0.85 L310.47 117.75 L-1.1 117.8" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C64.85 0.25, 129.23 -0.06, 310 0 M0 0 C108.33 -0.43, 215.59 -0.9, 310 0 M310 0 C310.42 38.3, 309.38 75.88, 310 118 M310 0 C309.83 23.95, 310.4 48.06, 310 118 M310 118 C199.84 117.6, 87.84 117.7, 0 118 M310 118 C226.43 118.8, 143.11 118.41, 0 118 M0 118 C1 86.5, 0.91 55.32, 0 0 M0 118 C-0.18 77.6, 0.04 37.03, 0 0" stroke="var(--accent)" stroke-width="1" fill="none"></path></g><g transform="translate(538.5 550.775) rotate(0 94.5 36.224999999999966)"><text x="94.5" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">外部邮件／支付服务</text><text x="94.5" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">执行成功但响应丢失</text><text x="94.5" y="66.04541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">重试是否再次生效？</text></g><g stroke-linecap="round" transform="translate(24 528) rotate(0 175 59)"><path d="M0.19 -1.05 L349.15 0.47 L349.75 116.9 L-0.2 118.13" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C114.45 -0.38, 227.85 0.1, 350 0 M0 0 C122.77 -1.41, 244.82 -0.94, 350 0 M350 0 C349.43 42.14, 348.75 85.29, 350 118 M350 0 C350.59 33.69, 350.69 66.64, 350 118 M350 118 C238.47 118.17, 126.57 118.61, 0 118 M350 118 C265.64 117.16, 180.74 117.19, 0 118 M0 118 C0 92.31, 0.2 66.41, 0 0 M0 118 C0.47 76.2, 0.17 33.5, 0 0" stroke="var(--accent)" stroke-width="1" fill="none"></path></g><g transform="translate(103.03369140625 550.775) rotate(0 95.96630859375 36.224999999999966)"><text x="95.96630859375" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">接收方配合</text><text x="95.96630859375" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">稳定业务 ID</text><text x="95.96630859375" y="66.04541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">原子去重 + 执行动作</text></g><g stroke-linecap="round"><g transform="translate(380.5 586) rotate(0 45.5 0)"><path d="M0 0 C31.12 0.16, 62.98 0.06, 91 0 M0 0 C31.88 -0.52, 64.83 0, 91 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(380.5 586) rotate(0 45.5 0)"><path d="M67.47 8.46 C75.41 6.04, 84.11 3.04, 91 0 M67.47 8.46 C75.33 5.18, 84.29 2.69, 91 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(380.5 586) rotate(0 45.5 0)"><path d="M67.54 -8.64 C75.48 -5.19, 84.14 -2.32, 91 0 M67.54 -8.64 C75.44 -5.85, 84.38 -2.25, 91 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g></g><mask></mask><g transform="translate(24 706) rotate(0 266 10.925000000000011)"><text x="0" y="16.055371093749997" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">保证只能延伸到接收方实际承诺的动作，不能延伸到用户行为。</text></g><g transform="translate(24 758) rotate(0 229.5 9.774999999999977)"><text x="0" y="14.365332031249999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">虚线框：保证范围，不是进程边界　　实线：处理或调用关系</text></g><script><![CDATA[try{const t=localStorage.getItem('reading-notes-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch{}]]></script></svg>
