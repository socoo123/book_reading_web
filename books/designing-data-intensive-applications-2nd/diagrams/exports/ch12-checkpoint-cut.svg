) rotate(0 111 39)"><path d="M-1.1 0.49 L221.88 0.82 L222.18 77.76 L-0.23 77.16" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C54.66 -0.32, 108.36 -1.31, 222 0 M0 0 C71.91 -0.55, 143.3 -1.06, 222 0 M222 0 C220.82 20.22, 221.77 42.17, 222 78 M222 0 C221.49 16.56, 221.91 33.98, 222 78 M222 78 C176.29 76.51, 131.46 76.8, 0 78 M222 78 C152.36 77.47, 82.86 77.05, 0 78 M0 78 C0.05 52.62, 0.66 30.56, 0 0 M0 78 C-0.26 55.12, 0.08 31.63, 0 0" stroke="var(--accent)" stroke-width="1" fill="none"></path></g><g transform="translate(183.325927734375 264.925) rotate(0 53.674072265625 12.074999999999989)"><text x="53.674072265625" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">屏障 n 之前</text></g><g stroke-linecap="round" transform="translate(446 238) rotate(0 111 39)"><path d="M0.49 -0.12 L222.82 0.18 L221.76 77.77 L-0.84 77.34" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C69.35 -0.53, 137.2 -0.3, 222 0 M0 0 C60.68 -0.6, 120.56 -0.95, 222 0 M222 0 C221.21 22.01, 222.55 43.36, 222 78 M222 0 C221.33 20.65, 221.66 40.56, 222 78 M222 78 C168.41 77.21, 115.94 77.55, 0 78 M222 78 C172.44 77.97, 122.5 77.97, 0 78 M0 78 C-1.4 51.69, 0.78 23.6, 0 0 M0 78 C0.05 58.75, -0.06 39.32, 0 0" stroke="var(--accent)" stroke-width="1" fill="none"></path></g><g transform="translate(503.325927734375 264.925) rotate(0 53.674072265625 12.074999999999989)"><text x="53.674072265625" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">屏障 n 之后</text></g><g stroke-linecap="round"><g transform="translate(354.5 276) rotate(0 42.5 0)"><path d="M0 0 C31.55 -0.68, 63.32 -0.49, 85 0 M0 0 C31.81 -0.45, 63.11 -0.31, 85 0" stroke