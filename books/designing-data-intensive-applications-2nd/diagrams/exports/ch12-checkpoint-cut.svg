(24 678) rotate(0 382 51)"><path d="M-0.05 -0.26 L764.76 0.34 L763.36 101.56 L0.83 102.99" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C270.3 0.75, 540.54 0.38, 764 0 M0 0 C203.65 -1.53, 407.61 -1.58, 764 0 M764 0 C762.92 20.84, 763.39 42.56, 764 102 M764 0 C763.97 21.97, 763.63 44.82, 764 102 M764 102 C540.22 100.61, 316.6 100.49, 0 102 M764 102 C607.79 103.44, 451.8 103.36, 0 102 M0 102 C-0.92 63.54, 0.06 24.91, 0 0 M0 102 C-0.3 69.52, -0.28 38.23, 0 0" stroke="var(--accent)" stroke-width="1" fill="none"></path></g><g transform="translate(197.7431640625 704.85) rotate(0 208.2568359375 24.149999999999977)"><text x="208.2568359375" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">故障后同时恢复 n 的源位点与状态</text><text x="208.2568359375" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">未完成检查点不能使用；n 之后输入重新处理</text></g><g transform="translate(24 826) rotate(0 216.9404296875 20.69999999999999)"><text x="0" y="15.2103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">实线：处理或完成确认　　虚线：逻辑恢复切面</text><text x="0" y="35.9103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">只见到屏障 ≠ 检查点已完成；外部输出还需提交协议。</text></g><script><![CDATA[try{const t=localStorage.getItem('reading-notes-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch{}]]></script></svg>
