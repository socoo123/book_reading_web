<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 812 891.4" width="812" height="891.4" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">检查点协调源位置与算子状态</title><desc id="diagram-desc">两路屏障之前的记录共同形成一致恢复切面；收到屏障只是开始或固定快照，所需持久化确认收齐并记录完成后才可恢复。</desc>
<style>:root{--surface:#fcfbf8;--text:#292824;--muted:#66645d;--soft:#f0ece4;--accent:#386d74}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--soft:#353534;--accent:#94c8cf}}
:root[data-theme="dark"]{--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--soft:#353534;--accent:#94c8cf}</style><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      </style></defs><rect x="0" y="0" width="812" height="891.4" fill="var(--surface)"></rect><g transform="translate(24 24) rotate(0 250 14.375)"><text x="0" y="21.12548828125" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="25px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">检查点保存的是一致切面，不是任意两份备份</text></g><g transform="translate(24 68) rotate(0 212.5 9.774999999999999)"><text x="0" y="14.365332031249999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">对齐方案；每路从左向右处理。虚线不是共同墙上时刻。</text></g><g transform="translate(24 138) rotate(0 30.920654296875 12.075000000000003)"><text x="0" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">输入 A</text></g><g stroke-linecap="round" transform="translate(126 114) rotate(0 111 39)"><path d="M-1.05 0.98 L221.64 0.75 L220.9 78.49 L-0.12 78.82" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C46.75 -1.02, 93.34 0.3, 222 0 M0 0 C76.55 0.12, 153.43 0.38, 222 0 M222 0 C221.72 28.16, 222.06 56.18, 222 78 M222 0 C222.32 15.69, 221.63 32.17, 222 78 M222 78 C167.58 77.15, 113.21 77.56, 0 78 M222 78 C166.59 77.85, 111.33 77.56, 0 78 M0 78 C-1.03 55.32, 0.62 33.03, 0 0 M0 78 C0.96 52.81, 0.11 28.18, 0 0" stroke="var(--accent)" stroke-width="1" fill="none"></path></g><g transform="translate(183.325927734375 140.925) rotate(0 53.674072265625 12.075000000000003)"><text x="53.674072265625" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"