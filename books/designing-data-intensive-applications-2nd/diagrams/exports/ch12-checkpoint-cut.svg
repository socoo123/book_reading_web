<g transform="translate(99.53369140625 502.775) rotate(0 85.46630859375 36.224999999999966)"><text x="85.46630859375" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">快照 n</text><text x="85.46630859375" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">源位点 + 算子状态</text><text x="85.46630859375" y="66.04541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">状态可异步上传</text></g><g stroke-linecap="round" transform="translate(466 476) rotate(0 161 63)"><path d="M-0.84 -0.66 L321.19 1.07 L321.95 125.74 L0.76 126.34" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C104.36 -0.52, 207.87 -1.35, 322 0 M0 0 C84.71 0.99, 170.14 1.45, 322 0 M322 0 C321.05 26.55, 321.89 54.82, 322 126 M322 0 C321.22 25.16, 321.41 50.96, 322 126 M322 126 C220.98 125.36, 120.19 124.68, 0 126 M322 126 C222.04 126.33, 122.2 127.08, 0 126 M0 126 C-0.63 89.22, 0.06 51.23, 0 0 M0 126 C0.1 99.87, -0.43 73.44, 0 0" stroke="var(--accent)" stroke-width="1" fill="none"></path></g><g transform="translate(522 502.775) rotate(0 105 36.224999999999966)"><text x="105" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">协调者</text><text x="105" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction