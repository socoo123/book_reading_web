m="translate(24.5 312) rotate(0 341.5 0)"><path d="M683 -15 C683 -11.16, 683 -7.31, 683 0 M683 -15 C683 -9.87, 683 -4.74, 683 0" stroke="var(--text)" stroke-width="2" fill="none"></path></g></g><mask></mask><g transform="translate(178 334) rotate(0 198.270751953125 10.925000000000011)"><text x="0" y="16.055371093749997" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">客户端响应时间：10 + 50 + 5 + 5 + 10 = 80 ms</text></g><g transform="translate(24 394) rotate(0 229.04345703125 9.775000000000006)"><text x="0" y="14.365332031249999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">可以相加单次串行阶段的耗时；不能这样相加各阶段的 p99。</text></g><script><![CDATA[try{const t=localStorage.getItem('reading-notes-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch{}]]></script></svg>
