<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 776 741.4" width="776" height="741.4" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">SSI医生示例中的读写反依赖环</title><desc id="diagram-desc">甲读乙的旧状态要求甲排乙前，乙读甲的旧状态又要求乙排甲前，两要求成环；中止一方并重新读取。</desc>
<style>:root{--surface:#fcfbf8;--text:#292824;--muted:#66645d;--soft:#f0ece4;--accent:#386d74}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--soft:#353534;--accent:#94c8cf}}
:root[data-theme="dark"]{--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--soft:#353534;--accent:#94c8cf}</style><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      </style></defs><rect x="0" y="0" width="776" height="741.4" fill="var(--surface)"></rect><g transform="translate(24 24) rotate(0 157.647705078125 14.375)"><text x="0" y="21.12548828125" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="25px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">SSI：串行顺序的要求形成环</text></g><g transform="translate(24 68) rotate(0 212.5 9.774999999999999)"><text x="0" y="14.365332031249999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">箭头是等价串行顺序约束，不是消息，也不是实际时间。</text></g><g stroke-linecap="round" transform="translate(48 238) rotate(0 126 52)"><path d="M1.04 -0.99 L251.1 1.11 L253.14 104.3 L-0.65 105.1" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C63.11 -1.34, 125.11 -1.02, 252 0 M0 0 C61.79 0.01, 122.59 -0.37, 252 0 M252 0 C250.71 30.97, 251.63 59.16, 252 104 M252 0 C251.78 40.41, 251.5 81.51, 252 104 M252 104 C189.93 103.87, 128.38 103.54, 0 104 M252 104 C157.14 104.61, 62.23 104.68, 0 104 M0 104 C0.14 68.29, -0.75 35.16, 0 0 M0 104 C0.49 62.37, 0.21 21.44, 0 0" stroke="var(--accent)" stroke-width="1" fill="none"></path></g><g transform="translate(79.5 265.85) rotate(0 94.5 24.150000000000006)"><text x="94.5" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">T甲</text><text x="94.5" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">读乙在岗，改甲离岗</text></g><g stroke-linecap="round" transform="translate(500 238) rotate(0 126 52)"><path d="M-0.99 -0.9 L253.11 1.14 L252.3 103.35 L1.1 104.01" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C99.87 -0.47, 200.56 -1.62, 252 0 M0 0 C64.68 -1.18, 128.64 -0.94, 252 0 M252 0 C253.29 27.45, 251.35 56.28, 252 104 M252 0 C251.56 25.99, 252.17 52.03, 252 104 M252 104 C172.55 102.79, 92.25 104.08, 0 104 M252 104 C152.91 104.13, 54.37 104.26, 0 104 M0 104 C-0.67 62.45, 0.89 22.35, 0 0 M0 104 C0.02 76.28, 0.45 49.07, 0 0" stroke="var(--accent)" stroke-width="1" fill="none"></path></g><g transform="translate(531.5 265.85) rotate(0 94.5 24.150000000000006)"><text x="94.5" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">T乙</text><text x="94.5" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">读甲在岗，改乙离岗</text></g><g stroke-linecap="round"><g transform="translate(180 232.5) rotate(0 220 -40.25)"><path d="M0 0 C0.27 -29.74, -0.91 -59.52, 0 -80.5 M0 0 C-0.59 -26.32, -0.34 -52.73, 0 -80.5 M0 -80.5 C163.31 -81.73, 327.2 -81.52, 440 -80.5 M0 -80.5 C106 -80.14, 212.03 -80.32, 440 -80.5 M440 -80.5 C439.23 -60.65, 440.55 -40.28, 440 -1 M440 -80.5 C440.07 -50.07, 440.2 -18.34, 440 -1" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(180 232.5) rotate(0 220 -40.25)"><path d="M431.57 -24.54 C435.39 -16.08, 437.3 -7.69, 440 -1 M431.57 -24.54 C434.12 -16.93, 437.11 -9.37, 440 -1" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(180 232.5) rotate(0 220 -40.25)"><path d="M448.67 -24.45 C446.21 -16.07, 441.85 -7.71, 440 -1 M448.67 -24.45 C445.63 -16.81, 443.04 -9.28, 440 -1" stroke="var(--accent)" stroke-width="2" fill="none"></path></g></g><mask></mask><g transform="translate(264 114) rotate(0 114 10.924999999999997)"><text x="0" y="16.055371093749997" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">甲读乙旧值：甲必须在乙前</text></g><g stroke-linecap="round"><g transform="translate(620 347.5) rotate(0 -220 40.25)"><path d="M0 0 C-0.31 19.45, 0.51 40.51, 0 80.5 M0 0 C-0.29 29.56, 0.12 59.01, 0 80.5 M0 80.5 C-162.56 79.26, -326.31 79.57, -440 80.5 M0 80.5 C-126.61 81.53, -253.08 81.35, -440 80.5 M-440 80.5 C-439.01 53.35, -438.9 24.45, -440 1 M-440 80.5 C-439.86 64.85, -440.31 48.53, -440 1" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(620 347.5) rotate(0 -220 40.25)"><path d="M-431.52 24.52 C-434.25 18.25, -435.52 13.61, -440 1 M-431.52 24.52 C-434.64 15.66, -437.36 6.7, -440 1" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(620 347.5) rotate(0 -220 40.25)"><path d="M-448.62 24.47 C-447.13 18.23, -444.17 13.6, -440 1 M-448.62 24.47 C-445.42 15.63, -441.83 6.69, -440 1" stroke="var(--accent)" stroke-width="2" fill="none"></path></g></g><mask></mask><g transform="translate(264 450) rotate(0 114 10.925000000000011)"><text x="0" y="16.055371093749997" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">乙读甲旧值：乙必须在甲前</text></g><g stroke-linecap="round" transform="translate(48 528) rotate(0 352 55)"><path d="M-0.65 1.1 L704.01 0.8 L703.58 110.18 L-0.83 109.84" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C196.81 1.1, 393.69 0.47, 704 0 M0 0 C205.41 0.37, 410.65 0.55, 704 0 M704 0 C703.88 23.15, 704.44 45.56, 704 110 M704 0 C703.32 42.5, 703.95 85.32, 704 110 M704 110 C479.63 111.58, 253.94 111.58, 0 110 M704 110 C549.71 111.81, 395.49 111.63, 0 110 M0 110 C-1.2 72.6, -1.19 34.06, 0 0 M0 110 C-1.02 74.64, 0 38.31, 0 0" stroke="var(--accent)" stroke-width="1" fill="none"></path></g><g transform="translate(173.66552734375 558.85) rotate(0 226.33447265625 24.149999999999977)"><text x="226.33447265625" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">两个顺序要求无法同时满足</text><text x="226.33447265625" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">示意：甲提交，乙中止 → 乙重读后发现只剩一人</text></g><g transform="translate(24 676) rotate(0 244.50732421875 20.69999999999999)"><text x="0" y="15.2103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">rw 反依赖：旧版本读者 → 改变该值的写者。</text><text x="0" y="35.9103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">这里只画最小环；实际 SSI 还使用危险结构与提交顺序规则。</text></g><script><![CDATA[try{const t=localStorage.getItem('reading-notes-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch{}]]></script></svg>
