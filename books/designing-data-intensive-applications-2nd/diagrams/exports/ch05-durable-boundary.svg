<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 784 795.55" width="784" height="795.55" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">持久化执行：完成记录决定恢复路径</title><desc id="diagram-desc">完成已入历史时重放旧结果；外部扣款已发生但活动完成报告丢失时可能重试，支付方须以同一幂等键去重。</desc>
