nchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">T甲：只改甲行</text><text x="84" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">甲离岗，然后提交</text></g><g stroke-linecap="round" transform="translate(448 386) rotate(0 150 54)"><path d="M0.14 -0.45 L299.58 0.83 L299.28 107.94 L0.55 107.17" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C91.15 0.46, 181.47 -0.26, 300 0 M0 0 C88.59 1.17, 177.44 1.26, 300 0 M300 0 C299.78 33.39, 300.6 64.52, 300 108 M300 0 C299.15 31.17, 299.38 61.98, 300 108 M300 108 C221.74 109.19, 145.32 108.43, 0 108 M300 108 C195.93 108.63, 92.33 108.58, 0 108 M0 108 C0.27 83.68, 0.6 57.59, 0 0 M0 108 C-0.59 78.94, -0.12 51.07, 0 0" stroke="var(--accent)" stroke-width="1" fill="none"></path></g><g transform="translate(514 415.85) rotate(0 84 24.150000000000006)"><text x="84" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">T乙：只改乙行</text><text x="84" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">乙离岗，然后提交</text></g><g stroke-linecap="round"><g transform="translate(202.5 500.5) rotate(0 79.5 36.5)"><path d="M0 0 C63.51 29.06, 126.13 57.63, 159 73 M0 0 C33.22 15.52, 66.69 31.01, 159 73" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(202.5 500.5) rotate(0 79.5 36.5)"><path d="M134.08 71.04 C144.17 72.25, 153.3 72.47, 159 73 M134.08 71.04 C139.43 71.33, 144.75 71.91, 159 73" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(202.5 500.5) rotate(0 79.5 36.5)"><path d="M141.17 55.48 C148.42 62.92, 154.71 69.35, 159 73 M141.17 55.48 C144.97 59.02, 148.81 62.87, 159 73" stroke="var(--accent)" stroke-width="2" fill="none"></path></g></g><mask></mask><g stroke-linecap="round"><g transform="translate(597.5 500.5) rotate(0 -79.5 36.5)"><path d="M0 0 C-43.03 19.57, -87.4 39.45, -159 73 M0 0 C-35.26 16.45, -70.01 32.11, -159 73" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(597.5 500.5) rotate(0 -79.5 36.5)"><path d="M-141.21 55.44 C-145.53 59.62, -150.99 64.23, -159 73 M-141.21 55.44 C-145.34 59.54, -149.07 63.02, -159 73" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(597.5 500.5) rotate(0 -79.5 36.5)"><path d="M-134.08 70.98 C-140.42 70.89, -147.85 71.21, -159 73 M-134.08 70.98 C-139.74 71.68, -145.04 71.75, -159 73" stroke="var(--accent)" stroke-width="2" fill="none"></path></g></g><mask></mask><g stroke-linecap="round" transform="translate(122 580) rotate(0 278 45)"><path d="M0.83 -0.72 L555.94 0.55 L555.17 88.88 L-0.36 89.13" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C207.26 -0.71, 414.73 -1.08, 556 0 M0 0 C140.98 0.47, 281.67 0.3, 556 0 M556 0 C556.67 26.67, 556.03 53.5, 556 90 M556 0 C556.41 18.11, 556.45 37.27, 556 90 M556 90 C428.94 91.08, 302.3 91.11, 0 90 M556 90 C401.06 90.66, 246.16 90.99, 0 90 M0 90 C0.04 62.81, 0 37.47, 0 0 M0 90 C0.69 67.7, 0.18 45.05, 0 0" stroke="var(--accent)" stroke-width="1" fill="none"></path></g><g transform="translate(256.5068359375 600.85) rotate(0 143.4931640625 24.149999999999977)"><text x="143.4931640625" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">最终：甲不在、乙不在</text><text x="143.4931640625" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">写集合不同，却违反“至少一人”</text></g><g transform="translate(24 712) rotate(0 261 10.350000000000023)"><text x="0" y="15.2103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">任何合法串行次序都会让后执行者看到只剩一人，从而拒绝离岗。</text></g><script><![CDATA[try{const t=localStorage.getItem('reading-notes-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch{}]]></script></svg>
