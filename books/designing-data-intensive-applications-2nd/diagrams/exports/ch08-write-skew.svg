<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 756.7" width="800" height="756.7" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">写不同的行仍可能违反共同规则</title><desc id="diagram-desc">两名医生各自从快照读到两人在岗，各自离岗，无同行写冲突，最后无人值班。</desc>
<style>:root{--surface:#fcfbf8;--text:#292824;--muted:#66645d;--soft:#f0ece4;--accent:#386d74}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--soft:#353534;--accent:#94c8cf}}
:root[data-theme="dark"]{--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--soft:#353534;--accent:#94c8cf}</style><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      </style></defs><rect x="0" y="0" width="800" height="756.7" fill="var(--surface)"></rect><g transform="translate(24 24) rotate(0 212.5 14.375)"><text x="0" y="21.12548828125" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="25px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">写偏斜：两个局部正确决定，共同出错</text></g><g transform="translate(24 68) rotate(0 195.5 9.774999999999999)"><text x="0" y="14.365332031249999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">规则：同一班次至少一人在岗。初始甲、乙都在岗。</text></g><g stroke-linecap="round" transform="translate(24 124) rotate(0 376 106)"><path d="M0 0 C171.65 -1.6, 342.66 -0.98, 752 0 M752 0 C753.88 64.12, 753.66 127.22, 752 212 M752 212 C529.18 210.67, 306.65 210.76, 0 212 M0 212 C0.32 149.85, 1.04 85.73, 0 0" stroke="var(--accent)" stroke-width="1.5" fill="none" stroke-dasharray="8 9"></path></g><g transform="translate(44 142) rotate(0 95 10.924999999999997)"><text x="0" y="16.055371093749997" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">规则与读取都涉及两行</text></g><g stroke-linecap="round" transform="translate(52 196) rotate(0 150 53)"><path d="M1 -0.62 L299.1 0.32 L300.57 106.14 L-0.45 105.58" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C112.62 1.37, 225.51 1.52, 300 0 M0 0 C82.89 -0.49, 165.31 -0.6, 300 0 M300 0 C299.28 23.8, 299.68 46.18, 300 106 M300 0 C300.39 24.03, 299.91 47.67, 300 106 M300 106 C213.84 106.82, 128.33 106.9, 0 106 M300 106 C182.77 105.58, 65.19 105.58, 0 106 M0 106 C0.87 68.07, -0.63 30.34, 0 0 M0 106 C0.17 66.68, -0.19 27.06, 0 0" stroke="var(--accent)" stroke-width="1" fill="none"></path></g