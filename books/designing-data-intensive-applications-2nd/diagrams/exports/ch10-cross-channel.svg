<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 838 808.7" width="838" height="808.7" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">通知路径快于文件复制，转码器可能读到旧版本</title><desc id="diagram-desc">先写文件并获得确认，再发队列通知。文件内部复制仍未完成时，转码器已收到通知并读取落后副本。</desc>
