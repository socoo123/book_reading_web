<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 709.1" width="810" height="709.1" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">窗口先输出、迟到更正与最终清理</title><desc id="diagram-desc">处理顺序向右；事件时间窗口为10点到10点01分。水位线10点01分输出2，清理前迟到更正3，水位线10点03分清理后进入旁路。</desc>
