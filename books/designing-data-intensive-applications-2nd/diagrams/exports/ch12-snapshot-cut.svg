ion="ltr" dominant-baseline="alphabetic">错误衔接：装载 S100 后直接读 104，会漏掉三次变化。</text><text x="0" y="37.90537109374999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">错误混合：先应用 A=11，再装入旧快照 A=10，会倒退。</text></g><g transform="translate(24 702) rotate(0 255 9.774999999999977)"><text x="0" y="14.365332031249999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">虚线：快照切点　　上排箭头：源日志顺序　　下排：目标重建步骤</text></g><script><![CDATA[try{const t=localStorage.getItem('reading-notes-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch{}]]></script></svg>
