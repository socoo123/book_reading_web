<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 808 745.55" width="808" height="745.55" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">一致快照与变更日志在位置100衔接</title><desc id="diagram-desc">S100包含A10和B20，依次应用101改A11、102删B、103增C30，最终A11与C30；复制期间保留100之后的变化。</desc>
