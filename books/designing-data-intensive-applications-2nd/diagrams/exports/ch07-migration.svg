<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 798 748.7" width="798" height="748.7" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">迁移中的数据与写入资格交接</title><desc id="diagram-desc">按阶段复制与追赶、停止旧写并应用到最终位点、发布新代次所有者。</desc>
<style>:root{--surface:#fcfbf8;--text:#292824;--muted:#66645d;--soft:#f0ece4;--accent:#386d74}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--soft:#353534;--accent:#94c8cf}}
:root[data-theme="dark"]{--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--soft:#353534;--accent:#94c8cf}</style><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      </style></defs><rect x="0" y="0" width="798" height="748.7" fill="var(--surface)"></rect><g transform="translate(24 24) rotate(0 243.76220703125 14.375)"><text x="0" y="21.12548828125" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="25px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">迁移 S3：数据追上以后，还要交接写入资格</text></g><g transform="translate(24 66) rotate(0 243 10.350000000000001)"><text x="0" y="15.2103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">笔记假设协议；阶段从上到下。允许交接窗口内等待或重试。</text></g><g transform="translate(24 114) rotate(0 180.5712890625 11.5)"><text x="0" y="16.900390625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">01　A 仍是所有者：复制快照并重放增量</text></g><g stroke-linecap="round" transform="translate(24 159) rotate(0 110 46)"><path d="M0.67 0.73 L219.45 -0.76 L220.15 91.91 L-0.16 91.11" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C75.78 -1.81, 152.91 -0.04, 220 0 M0 0 C49.16 1.14, 97.31 1.25, 220 0 M220 0 C220.4 32.08, 219.29 67.02, 220 92 M220 0 C220.41 33.08, 219.88 65.54, 220 92 M220 92 C153.19 92.39, 86.87 92.93, 0 92 M220 92 C142.18 92.18, 63.49 92.01, 0 92 M0 92 C1.08 69.01, 0.84 46.6, 0 0 M0 92 C-0.41 58.71, -0.59 24.77, 0 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(77.330078125 182) rotate(0 56.669921875 23)"><text x="56.669921875" y="16.900390625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">A：继续读写</text><text x="56.669921875" y="39.900390625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">快照位点 40</text></g><g stroke-linecap="round" transform="translate(554 159) rotate(0 110 46)"><path d="M0.73 -0.55 L219.24 0.15 L219.91 91.84 L-0.89 92.35" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C70.6 0.82, 144.01 -0.16, 220 0 M0 0 C67.35 -1.05, 134.53 -0.29, 220 0 M220 0 C218.9 32.75, 220.85 68.39, 220 92 M220 0 C219.68 33.82, 219.1 68.7, 220 92 M220 92 C149.52 93.13, 79.67 92.81, 0 92 M220 92 C145.57 93.11, 70.83 92.74, 0 92 M0 92 C-0.46 70.19, -0.51 48.1, 0 0 M0 92 C0.42 60.57, 0.03 30.23, 0 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(604 182) rotate(0 60 23)"><text x="60" y="16.900390625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">B：准备数据</text><text x="60" y="39.900390625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">尚无写入资格</text></g><g stroke-linecap="round"><g transform="translate(249.5 204) rotate(0 149.5 0)"><path d="M0 0 C110.29 1.61, 219.77 1.12, 299 0 M0 0 C66.9 -0.31, 134.66 -0.34, 299 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(249.5 204) rotate(0 149.5 0)"><path d="M275.49 8.51 C284.35 6.2, 292.06 2.4, 299 0 M275.49 8.51 C280.32 6.91, 286.33 4.96, 299 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(249.5 204) rotate(0 149.5 0)"><path d="M275.52 -8.59 C284.32 -4.6, 292.02 -2.09, 299 0 M275.52 -8.59 C280.38 -6.35, 286.39 -4.45, 299 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g></g><mask></mask><g transform="translate(289 169) rotate(0 64.2568359375 10.349999999999994)"><text x="0" y="15.2103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">快照 + 后续日志</text></g><g transform="translate(24 299) rotate(0 210.01953125 11.5)"><text x="0" y="16.900390625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">02　建立屏障：A 停止接新写，B 追至最终位点</text></g><g stroke-linecap="round" transform="translate(24 344) rotate(0 110 46)"><path d="M-0.09 -0.16 L219.11 0.35 L219.1 91.03 L0.48 92.99" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C69.77 0.11, 139.97 1.44, 220 0 M0 0 C47.04 -0.86, 93.38 -1.06, 220 0 M220 0 C221.36 18.49, 220.49 38.63, 220 92 M220 0 C219.63 19.87, 219.63 39.18, 220 92 M220 92 C135.44 92.69, 51.01 92.89, 0 92 M220 92 C150.82 91.18, 82.57 91.07, 0 92 M0 92 C0.77 60.02, -0.08 29.26, 0 0 M0 92 C0.48 69.95, -0.26 48.53, 0 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(57.330078125 367) rotate(0 76.669921875 23)"><text x="76.669921875" y="16.900390625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">A：排空已接写入</text><text x="76.669921875" y="39.900390625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">最终位点 48</text></g><g stroke-linecap="round" transform="translate(554 344) rotate(0 110 46)"><path d="M-0.16 -0.89 L220.35 -0.9 L219.03 92.48 L0.99 91.51" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C80.87 0.49, 163.86 -0.97, 220 0 M0 0 C82.14 -0.76, 164.26 -1.25, 220 0 M220 0 C219.54 35.69, 220.41 70.33, 220 92 M220 0 C220.28 19.52, 219.97 39.32, 220 92 M220 92 C144.44 93.39, 69.01 92.58, 0 92 M220 92 C156.16 91.68, 92.39 91.57, 0 92 M0 92 C-0.71 69.31, 0.16 46.66, 0 0 M0 92 C-0.58 66.02, -0.23 40.75, 0 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(593.4287109375 367) rotate(0 70.5712890625 23)"><text x="70.5712890625" y="16.900390625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">B：已应用到 48</text><text x="70.5712890625" y="39.900390625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">具备完整基线</text></g><g stroke-linecap="round"><g transform="translate(249.5 389) rotate(0 149.5 0)"><path d="M0 0 C66.82 1.22, 132.23 1.37, 299 0 M0 0 C107.21 0.12, 214.07 0.72, 299 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(249.5 389) rotate(0 149.5 0)"><path d="M275.54 8.65 C281.27 7.35, 285.09 5.64, 299 0 M275.54 8.65 C283.94 5.21, 291.88 2.93, 299 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(249.5 389) rotate(0 149.5 0)"><path d="M275.47 -8.45 C281.22 -5.95, 285.05 -3.87, 299 0 M275.47 -8.45 C283.95 -5.76, 291.92 -1.91, 299 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g></g><mask></mask><g transform="translate(294 354) rotate(0 54 10.349999999999994)"><text x="0" y="15.2103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">最后一段增量</text></g><g transform="translate(24 484) rotate(0 210.01953125 11.5)"><text x="0" y="16.900390625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">03　发布新代次：B 接管，A 的旧写入资格失效</text></g><g stroke-linecap="round" transform="translate(24 529) rotate(0 142.5 46)"><path d="M-0.97 0.48 L285.99 -0.49 L285.28 91.82 L-0.72 92.09" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C101.04 1.67, 201.34 0.81, 285 0 M0 0 C86.58 1.44, 172.69 0.87, 285 0 M285 0 C283.97 27.69, 285.28 55.78, 285 92 M285 0 C285.21 29.79, 285.19 58.95, 285 92 M285 92 C173.49 91.65, 61.66 91.87, 0 92 M285 92 C181.16 92.86, 78.02 92.43, 0 92 M0 92 C-0.5 68.16, 0.49 42.43, 0 0 M0 92 C-0.15 69.8, 0.1 48.03, 0 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(92.0419921875 552) rotate(0 74.4580078125 23)"><text x="74.4580078125" y="16.900390625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">协调层持久记录</text><text x="74.4580078125" y="39.900390625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">新代次：S3 → B</text></g><g stroke-linecap="round" transform="translate(554 529) rotate(0 110 46)"><path d="M0.48 0.99 L219.51 0.28 L219.82 91.28 L0.09 91.5" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C78.32 -0.14, 155.05 -0.82, 220 0 M0 0 C49.78 -0.62, 98.6 -1, 220 0 M220 0 C219.58 28.46, 220.02 56.67, 220 92 M220 0 C220.81 27.04, 220.51 54.15, 220 92 M220 92 C148.15 91.28, 77.16 92.54, 0 92 M220 92 C166 91.53, 111.17 91.16, 0 92 M0 92 C1.01 61.18, -0.2 28.15, 0 0 M0 92 C-0.4 63.4, -0.41 33.97, 0 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(604 552) rotate(0 60 23)"><text x="60" y="16.900390625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">B：新所有者</text><text x="60" y="39.900390625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">开始接受写入</text></g><g stroke-linecap="round"><g transform="translate(314.5 574) rotate(0 117 0)"><path d="M0 0 C50.23 -0.88, 99.33 -1.21, 234 0" stroke="var(--accent)" stroke-width="2.5" fill="none" stroke-dasharray="8 10"></path></g><g transform="translate(314.5 574) rotate(0 117 0)"><path d="M210.45 8.39 C216.09 6.18, 220.44 4.01, 234 0" stroke="var(--accent)" stroke-width="2.5" fill="none"></path></g><g transform="translate(314.5 574) rotate(0 117 0)"><path d="M210.57 -8.71 C216.25 -7.3, 220.57 -5.84, 234 0" stroke="var(--accent)" stroke-width="2.5" fill="none"></path></g></g><mask></mask><g transform="translate(354 539) rotate(0 63 10.350000000000023)"><text x="0" y="15.2103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">发布资格／映射</text></g><g transform="translate(24 664) rotate(0 235.50732421875 10.350000000000023)"><text x="0" y="15.2103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">旧路由到 A：拒绝／重定向／转发；不能再在 A 本地提交。</text></g><g transform="translate(24 704) rotate(0 257.51513671875 10.350000000000023)"><text x="0" y="15.2103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">实线：数据传递　虚线：权威状态发布　B 未到 48 时不得切换。</text></g><script><![CDATA[try{const t=localStorage.getItem('reading-notes-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch{}]]></script></svg>
