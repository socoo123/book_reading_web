<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 734 517.55" width="734" height="517.55" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">混合时间线的两路合并</title><desc id="diagram-desc">普通账号帖子提前投递到小林的物化时间线；小林关注的高粉丝账号帖子在读取时另取，两路结果合并排序后返回。</desc>
