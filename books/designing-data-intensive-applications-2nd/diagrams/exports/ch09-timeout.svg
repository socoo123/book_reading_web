<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 613.85" width="848" height="613.85" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">一个超时观察，多种远端事实</title><desc id="diagram-desc">请求未到、远端暂停、执行后响应丢失都可表现为客户端没有响应；超时无法判断是否已执行。</desc>
<style>:root{--surface:#fcfbf8;--text:#292824;--muted:#66645d;--soft:#f0ece4;--accent:#386d74}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--soft:#353534;--accent:#94c8cf}}
:root[data-theme="dark"]{--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--soft:#353534;--accent:#94c8cf}</style><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      </style></defs><rect x="0" y="0" width="848" height="613.85" fill="var(--surface)"></rect><g transform="translate(24 24) rotate(0 187.5 14.375)"><text x="0" y="21.12548828125" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="25px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">超时：没有响应，不等于没有执行</text></g><g transform="translate(24 70) rotate(0 185.825439453125 9.774999999999999)"><text x="0" y="14.365332031249999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">从左到右读；× 表示未送达，虚线表示仍在等待。</text></g><g stroke-linecap="round" transform="translate(24 130) rotate(0 169 47)"><path d="M-0.87 0.12 L338.27 0.27 L338.77 93.13 L0.4 94.11" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C79.03 -1.09, 157.68 -0.29, 338 0 M0 0 C106.53 -0.32, 213.66 -0.48, 338 0 M338 0 C339.07 26.4, 338.67 53.17, 338 94 M338 0 C338.03 21.13, 337.69 41.5, 338 94 M338 94 C212.09 93.95, 86.08 93.39, 0 94 M338 94 C236.94 94.84, 136.43 94.96, 0 94 M0 94 C-0.69 57.48, 0.55 21.38, 0 0 M0 94 C-0.31 74.04, -0.32 54.77, 0 0" stroke="var(--accent)" stroke-width="1.5" fill="none"></path></g><g transform="translate(110.450927734375 152.85) rotate(0 82.549072265625 24.14999999999999)"><text x="82.549072265625" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">请求在途中丢失 ×</text><text x="82.549072265625" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">远端尚未执行</text></g><g stroke-linecap="round" transform="translate(24 276) rotate(0 169 47)"><path d="M-0.28 -0.5 L337.66 0.76 L337.15 93.93 L-0.02 94.73" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C126.25 -0.33, 253.45 -0.09, 338 0 M338 0 C338.65 35.72, 338.17 70.02, 338 94 M338 94 C217.8 95.19, 97.85 94.4, 0 94 M0 94 C0.74 69.47, -0.33 46.13, 0 0" stroke="var(--accent)" stroke-width="2" fill="none" stroke-dasharray="8 9.5"></path></g><g transform="translate(88 298.85) rotate(0 105 24.150000000000006)"><text x="105" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">请求已到，服务端暂停</text><text x="105" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">稍后可能继续执行</text></g><g stroke-linecap="round" transform="translate(24 422) rotate(0 169 47)"><path d="M0.27 0.27 L338.77 -0.87 L338.4 94.11 L-0.19 93.86" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C129.24 0.9, 258.86 0.75, 338 0 M0 0 C115.63 -0.53, 230.79 -0.33, 338 0 M338 0 C338.79 24.74, 337.6 47.87, 338 94 M338 0 C338.1 22.27, 338.57 45.01, 338 94 M338 94 C252.77 94.81, 168.66 95.35, 0 94 M338 94 C207.34 93.48, 76.59 93.52, 0 94 M0 94 C0.89 74.9, -0.62 53.85, 0 0 M0 94 C-0.03 58.93, -0.03 24.47, 0 0" stroke="var(--accent)" stroke-width="1.5" fill="none"></path></g><g transform="translate(120.950927734375 444.85) rotate(0 72.049072265625 24.150000000000006)"><text x="72.049072265625" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">远端已执行</text><text x="72.049072265625" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">成功响应丢失 ×</text></g><g stroke-linecap="round" transform="translate(548 276) rotate(0 138 50)"><path d="M0.27 0.77 L275.13 0.4 L276.11 99.81 L-0.14 99.02" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C88.4 0.33, 175.89 0.53, 276 0 M0 0 C66.17 -0.73, 132.57 -0.82, 276 0 M276 0 C276.65 37.32, 275.64 75.59, 276 100 M276 0 C275.92 34.88, 276.09 68.8, 276 100 M276 100 C202.49 99.09, 129.65 99.77, 0 100 M276 100 C207.26 100.99, 138.6 100.3, 0 100 M0 100 C0.74 75.66, -0.36 53.88, 0 0 M0 100 C0.2 78.17, 0.54 57.35, 0 0" stroke="var(--accent)" stroke-width="1.5" fill="none"></path></g><g transform="translate(591.5 301.85) rotate(0 94.5 24.150000000000006)"><text x="94.5" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">客户端超时</text><text x="94.5" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">仍然不知道业务结果</text></g><g stroke-linecap="round"><g transform="translate(368.5 177.5) rotate(0 86.5 57.5)"><path d="M0 0 C47.98 31.81, 96.11 62.73, 173 115 M0 0 C59.96 39.95, 119.65 79.78, 173 115" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(368.5 177.5) rotate(0 86.5 57.5)"><path d="M148.69 109.16 C155.55 111.27, 162.49 111.82, 173 115 M148.69 109.16 C157.02 111.4, 165.33 113.52, 173 115" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(368.5 177.5) rotate(0 86.5 57.5)"><path d="M158.13 94.9 C162.36 101, 166.69 105.5, 173 115 M158.13 94.9 C163.24 102.07, 168.28 109.12, 173 115" stroke="var(--accent)" stroke-width="2" fill="none"></path></g></g><mask></mask><g stroke-linecap="round"><g transform="translate(368.5 323) rotate(0 86.5 0)"><path d="M0 0 C49.03 0.22, 96.41 0.26, 173 0" stroke="var(--accent)" stroke-width="2.5" fill="none" stroke-dasharray="8 10"></path></g><g transform="translate(368.5 323) rotate(0 86.5 0)"><path d="M149.53 8.61 C156.66 6.52, 162.16 4.14, 173 0" stroke="var(--accent)" stroke-width="2.5" fill="none"></path></g><g transform="translate(368.5 323) rotate(0 86.5 0)"><path d="M149.49 -8.49 C156.69 -5.8, 162.21 -3.39, 173 0" stroke="var(--accent)" stroke-width="2.5" fill="none"></path></g></g><mask></mask><g stroke-linecap="round"><g transform="translate(368.5 468.5) rotate(0 86.5 -55)"><path d="M0 0 C68.74 -44.44, 137.28 -87.14, 173 -110 M0 0 C51.33 -32.74, 102.93 -65.57, 173 -110" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(368.5 468.5) rotate(0 86.5 -55)"><path d="M157.75 -90.19 C164.11 -98.56, 170.18 -105.44, 173 -110 M157.75 -90.19 C162.12 -95.79, 166.87 -101.83, 173 -110" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(368.5 468.5) rotate(0 86.5 -55)"><path d="M148.58 -104.63 C158.58 -107.31, 168.28 -108.47, 173 -110 M148.58 -104.63 C155.67 -105.96, 163.14 -107.71, 173 -110" stroke="var(--accent)" stroke-width="2" fill="none"></path></g></g><mask></mask><g transform="translate(24 568) rotate(0 266 10.925000000000011)"><text x="0" y="16.055371093749997" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">超时结束的是本次等待；原请求仍可能排队、执行或已经提交。</text></g><script><![CDATA[try{const t=localStorage.getItem('reading-notes-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch{}]]></script></svg>
