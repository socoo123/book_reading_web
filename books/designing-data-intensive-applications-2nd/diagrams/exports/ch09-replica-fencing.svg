<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 589.55" width="850" height="589.55" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">多数副本的新代次决定法定人数读结果</title><desc id="diagram-desc">R1和R2已保存34，R3可能接受33；任意两副本读取均包含34，按代次优先比较胜出，再异步修复R3。</desc>
<style>:root{--surface:#fcfbf8;--text:#292824;--muted:#66645d;--soft:#f0ece4;--accent:#386d74}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--soft:#353534;--accent:#94c8cf}}
:root[data-theme="dark"]{--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--soft:#353534;--accent:#94c8cf}</style><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      </style></defs><rect x="0" y="0" width="850" height="589.55" fill="var(--surface)"></rect><g transform="translate(24 24) rotate(0 225 14.375)"><text x="0" y="21.12548828125" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="25px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">多副本隔离：局部旧写，不成为读取胜者</text></g><g transform="translate(24 70) rotate(0 210.628173828125 9.774999999999999)"><text x="0" y="14.365332031249999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">假设固定 3 副本，成功写 2、读取 2，读者取最大版本。</text></g><g stroke-linecap="round" transform="translate(24 140) rotate(0 117 52)"><path d="M0.27 -0.95 L234.06 0 L233.88 103.51 L0.09 103.75" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C79.4 0.75, 159.92 0.79, 234 0 M0 0 C72.61 -0.58, 144.83 -0.68, 234 0 M234 0 C233.36 29.56, 233.23 57.02, 234 104 M234 0 C233.56 35.33, 233.95 70.51, 234 104 M234 104 C175.7 103.04, 117.75 103.77, 0 104 M234 104 C183.72 104.63, 133.87 104.26, 0 104 M0 104 C0.19 77.79, 0.76 50.38, 0 0 M0 104 C0.37 67.53, 0.08 30.7, 0 0" stroke="var(--accent)" stroke-width="1.5" fill="none"></path></g><g transform="translate(65.731201171875 167.85) rotate(0 75.268798828125 24.14999999999999)"><text x="75.268798828125" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">R1：保存 (34,1)</text><text x="75.268798828125" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">拒绝后来的 33</text></g><g stroke-linecap="round" transform="translate(308 140) rotate(0 117 52)"><path d="M-0.95 0.06 L234 -0.12 L233.51 104.09 L-0.25 104.53" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C77.41 0.82, 155.06 0.48, 234 0 M0 0 C78.9 -0.51, 157.43 -0.85, 234 0 M234 0 C235.05 33.14, 233.6 68.49, 234 104 M234 0 C234.18 22.3, 234.08 43.52, 234 104 M234 104 C171.41 102.87, 109.93 102.72, 0 104 M234 104 C157.08 103.2, 79.62 103.16, 0 104 M0 104 C0.73 76.26, 0.01 47.81, 0 0 M0 104 C0.49 78.76, 0.45 54.12, 0 0" stroke="var(--accent)" stroke-width="1.5" fill="none"></path></g><g transform="translate(349.731201171875 167.85) rotate(0 75.268798828125 24.14999999999999)"><text x="75.268798828125" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">R2：保存 (34,1)</text><text x="75.268798828125" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">拒绝后来的 33</text></g><g stroke-linecap="round" transform="translate(592 140) rotate(0 117 52)"><path d="M-0.59 -0.56 L233.55 -0.69 L234.42 103.14 L0.29 104.46" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C48.06 0.07, 95.35 0.54, 234 0 M234 0 C234.99 40.62, 234.18 80.67, 234 104 M234 104 C144.8 103.96, 57.47 103.89, 0 104 M0 104 C0.8 70.35, -0.55 36.53, 0 0" stroke="var(--accent)" stroke-width="2" fill="none" stroke-dasharray="8 9.5"></path></g><g transform="translate(622.052001953125 167.85) rotate(0 86.947998046875 24.14999999999999)"><text x="86.947998046875" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">R3：暂存 (33,999)</text><text x="86.947998046875" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">还没见过 34</text></g><g transform="translate(24 290) rotate(0 265.772705078125 10.925000000000011)"><text x="0" y="16.055371093749997" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">比较规则：(代次, 代内序号)；先比代次，故 (34,1) &gt; (33,999)。</text></g><g stroke-linecap="round" transform="translate(24 362) rotate(0 117 45)"><path d="M-0.12 -0.49 L234.09 -0.25 L234.53 90.83 L0.67 90.67" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C64.75 0.5, 130.07 0.84, 234 0 M0 0 C85.08 -0.3, 170.67 -0.74, 234 0 M234 0 C233.98 31.94, 233.82 65.72, 234 90 M234 0 C234.11 27.92, 234.08 55.91, 234 90 M234 90 C173.64 90.66, 115.13 89.85, 0 90 M234 90 C154.05 89.43, 74.27 89.56, 0 90 M0 90 C0.26 57.97, -0.6 27.24, 0 0 M0 90 C0.35 56.72, 0.24 24.38, 0 0" stroke="var(--accent)" stroke-width="1.5" fill="none"></path></g><g transform="translate(88.771728515625 382.85) rotate(0 52.228271484375 24.150000000000006)"><text x="52.228271484375" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">读 R1 + R2</text><text x="52.228271484375" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">选 (34,1)</text></g><g stroke-linecap="round" transform="translate(308 362) rotate(0 117 45)"><path d="M-0.49 0.09 L233.75 0.53 L234.83 90.67 L0.67 89.73" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C82.15 0.64, 164.33 0.45, 234 0 M0 0 C84.1 0.55, 167.63 0.49, 234 0 M234 0 C232.74 18.99, 233.69 37.65, 234 90 M234 0 C233.79 34.1, 233.68 68.57, 234 90 M234 90 C180.1 89.54, 125.14 89.49, 0 90 M234 90 C171.54 89.38, 109.33 89.78, 0 90 M0 90 C-0.5 57.09, 0.22 25.46, 0 0 M0 90 C-0.73 67.2, -0.26 44.28, 0 0" stroke="var(--accent)" stroke-width="1.5" fill="none"></path></g><g transform="translate(372.771728515625 382.85) rotate(0 52.228271484375 24.150000000000006)"><text x="52.228271484375" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">读 R1 + R3</text><text x="52.228271484375" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">选 (34,1)</text></g><g stroke-linecap="round" transform="translate(592 362) rotate(0 117 45)"><path d="M0.09 -0.25 L234.53 0.83 L234.67 90.67 L-0.27 90.88" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C66.32 0.29, 131.71 0.14, 234 0 M0 0 C80.33 -0.6, 160.27 -0.66, 234 0 M234 0 C234.4 19.82, 234.3 40.37, 234 90 M234 0 C233.47 26, 233.54 52.21, 234 90 M234 90 C154.42 89.72, 74.42 90.01, 0 90 M234 90 C174.41 89.75, 115.41 89.99, 0 90 M0 90 C-0.56 65.11, 0.4 39.53, 0 0 M0 90 C-0.09 57.86, -0.18 25.48, 0 0" stroke="var(--accent)" stroke-width="1.5" fill="none"></path></g><g transform="translate(656.771728515625 382.85) rotate(0 52.228271484375 24.150000000000006)"><text x="52.228271484375" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">读 R2 + R3</text><text x="52.228271484375" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">选 (34,1)</text></g><g stroke-linecap="round"><g transform="translate(430.5 250) rotate(0 136.5 0)"><path d="M0 0 C84.81 -0.34, 169.04 -0.47, 273 0" stroke="var(--accent)" stroke-width="2.5" fill="none" stroke-dasharray="8 10"></path></g><g transform="translate(430.5 250) rotate(0 136.5 0)"><path d="M249.48 8.48 C257.35 6.29, 264.47 3.49, 273 0" stroke="var(--accent)" stroke-width="2.5" fill="none"></path></g><g transform="translate(430.5 250) rotate(0 136.5 0)"><path d="M249.53 -8.62 C257.41 -5.53, 264.52 -3.04, 273 0" stroke="var(--accent)" stroke-width="2.5" fill="none"></path></g></g><mask></mask><g transform="translate(552 266) rotate(0 47.227294921875 9.775000000000006)"><text x="0" y="14.365332031249999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">之后修复 R3</text></g><g transform="translate(24 510) rotate(0 264.974853515625 10.925000000000011)"><text x="0" y="16.055371093749997" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">每组读集合都与新写集合 {R1,R2} 相交；只读 R3 没有此保证。</text></g><g transform="translate(24 546) rotate(0 229.5 9.774999999999977)"><text x="0" y="14.365332031249999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">图中保护的是可归并的存储状态，不回滚外部邮件等副作用。</text></g><script><![CDATA[try{const t=localStorage.getItem('reading-notes-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch{}]]></script></svg>
