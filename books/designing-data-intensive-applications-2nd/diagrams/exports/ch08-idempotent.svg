<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 857.4" width="820" height="857.4" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">消息ID、业务写和结果在同一个数据库事务内</title><desc id="diagram-desc">先用唯一消息ID去重，首次处理写业务和结果，重复处理读取原结果；两分支提交后都确认，提交后确认前崩溃通过重投恢复。</desc>
