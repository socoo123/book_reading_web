      </style></defs><rect x="0" y="0" width="810" height="915.55" fill="var(--surface)"></rect><g transform="translate(24 24) rotate(0 237.5 14.375)"><text x="0" y="21.12548828125" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="25px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">连接的差别：保存什么，什么变化触发输出</text></g><g transform="translate(24 68) rotate(0 127.5 9.774999999999999)"><text x="0" y="14.365332031249999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">三行是语义对照；不是部署拓扑。</text></g><g transform="translate(24 118) rotate(0 47.5 10.924999999999997)"><text x="0" y="16.055371093749997" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">输入／触发</text></g><g transform="translate(306 118) rotate(0 47.5 10.924999999999997)"><text x="0" y="16.055371093749997" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">受管理状态</text></g><g transform="translate(600 118) rotate(0 19 10.924999999999997)"><text x="0" y="16.055371093749997" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">输出</text></g><g stroke-linecap="round" transform="translate(24 170) rotate(0 113 64)"><path d="M0.94 0.04 L225.85 0.04 L226.06 127.16 L0.68 128.14" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C67.8 0.71, 136.74 -0.28, 226 0 M0 0 C89.32 0.71, 178.48 0.02, 226 0 M226 0 C225.61 31.5, 224