<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 915.55" width="810" height="915.55" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">三类流连接保存什么状态、谁触发输出</title><desc id="diagram-desc">流流缓存两侧近期事件；流表由档案CDC维护本地表并由活动触发丰富；表表保存两侧当前表，由任一侧变化维护结果。</desc>
<style>:root{--surface:#fcfbf8;--text:#292824;--muted:#66645d;--soft:#f0ece4;--accent:#386d74}
