, 0.05 54.07, 0 0" stroke="var(--accent)" stroke-width="1" fill="none"></path></g><g transform="translate(617.5 455.85) rotate(0 73.5 24.150000000000006)"><text x="73.5" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">丰富后的活动</text><text x="73.5" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">通常不追溯改写</text></g><g stroke-linecap="round"><g transform="translate(256.5 478) rotate(0 18.5 0)"><path d="M0 0 C10.22 -0.18, 21 -0.09, 37 0 M0 0 C11.54 0.03, 22.86 -0.07, 37 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(256.5 478) rotate(0 18.5 0)"><path d="M19.6 6.29 C24.2 4.28, 29.33 2.56, 37 0 M19.6 6.29 C25.11 4.33, 30.39 2.31, 37 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(256.5 478) rotate(0 18.5 0)"><path d="M19.63 -6.37 C24.23 -4.72, 29.35 -2.8, 37 0 M19.63 -6.37 C25.1 -4.42, 30.38 -2.55, 37 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g></g><mask></mask><g stroke-linecap="round"><g transform="translate(552.5 478) rotate(0 18.5 0)"><path d="M0 0 C12.53 -0.23, 25.4 0.12, 37 0 M0 0 C8.21 0.01, 16.38 0.02, 37 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(552.5 478) rotate(0 18.5 0)"><path d="M19.62 6.34 C25.41 3.9, 31.49 2.04, 37 0 M19.62 6.34 C23.46 4.96, 27.25 3.55, 37 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(552.5 478) rotate(0 18.5 0)"><path d="M19.61 -6.32 C25.39 -4.39, 31.47 -1.88, 37 0 M19.61 -6.32 C23.42 -4.87, 27.22 -3.45, 37 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g></g><mask></mask><g transform=