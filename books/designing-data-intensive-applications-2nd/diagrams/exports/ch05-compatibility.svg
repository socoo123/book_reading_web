, 193 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g></g><mask></mask><g transform="translate(320 164) rotate(0 27 10.349999999999994)"><text x="0" y="15.2103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">旧数据</text></g><g transform="translate(24 288) rotate(0 79.92919921875 12.074999999999989)"><text x="0" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">向前兼容 forward</text></g><g stroke-linecap="round" transform="translate(24 330) rotate(0 125 45)"><path d="M0.63 -0.81 L249.59 -0.72 L249.44 88.92 L0.06 90.43" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C83.55 0.96, 166.05 -0.26, 250 0 M0 0 C77.74 -1.19, 155.95 -1.58, 250 0 M250 0 C249.96 28.42, 249.02 53.87, 250 90 M250 0 C249.23 19.52, 249.04 38.96, 250 90 M250 90 C187.12 90.03, 124.8 90.19, 0 90 M250 90 C178.67 90.16, 108.34 90.08, 0 90 M0 90 C0.4 56.75, -0.4 21.77, 0 0 M0 90 C-0.31 58.66, -0.01 26.59, 0 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(96.5 350.85) rotate(0 52.5 24.150000000000006)"><text x="52.5" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">新代码写入</text><text x="52.5" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">v2 数据</text></g><g stroke-linecap="round" transform="translate(480 330) rotate(0 125 45)"><path d="M-0.81 -0.41 L249.28 -