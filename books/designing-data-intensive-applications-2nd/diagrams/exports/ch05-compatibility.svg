<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 754 665.85" width="754" height="665.85" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">兼容方向：先标写者与读者</title><desc id="diagram-desc">向后兼容是旧写者到新读者；向前兼容是新写者到旧读者。旧版读改写还需保留未知字段。</desc>
