inant-baseline="alphabetic">新数据</text></g><g stroke-linecap="round" transform="translate(24 472) rotate(0 353 56)"><path d="M0.52 -0.34 L706.71 -0.2 L704.93 112.16 L-0.98 111.98" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C240.36 1.64, 481.04 1.13, 706 0 M706 0 C705.92 31.06, 705.37 63.88, 706 112 M706 112 C438.08 110.12, 170.83 110.18, 0 112 M0 112 C0.03 82.65, 0.25 51.46, 0 0" stroke="var(--accent)" stroke-width="2.5" fill="none" stroke-dasharray="8 10"></path></g><g transform="translate(124.384765625 503.85) rotate(0 252.615234375 24.149999999999977)"><text x="252.615234375" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">读得懂 ≠ 无损写回</text><text x="252.615234375" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">旧版若重新构造整条记录，未知 photoURL 仍可能丢失</text></g><g transform="translate(24 620) rotate(0 223.77880859375 10.925000000000011)"><text x="0" y="16.055371093749997" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">旧客户端 → 新服务：请求向后兼容；响应向前兼容。</text></g><script><![CDATA[try{const t=localStorage.getItem('reading-notes-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch{}]]></script></svg>
