<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 684 599.55" width="684" height="599.55" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">计算与长期存储分离</title><desc id="diagram-desc">两个计算节点经网络访问独立持久存储。本地缓存可重建，扩算仍受网络、冷缓存和存储吞吐约束。</desc>
