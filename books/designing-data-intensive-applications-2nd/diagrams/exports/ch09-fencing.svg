<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 858 763.55" width="858" height="763.55" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">隔离在资源接受新代次后生效</title><desc id="diagram-desc">A持有33，B取得34后在资源完成代次推进；资源保存34并拒绝33，同代次后续写可继续。</desc>
<style>:root{--surface:#fcfbf8;--text:#292824;--muted:#66645d;--soft:#f0ece4;--accent:#386d74}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--soft:#353534;--accent:#94c8cf}}
:root[data-theme="dark"]{--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--soft:#353534;--accent:#94c8cf}</style><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      </style></defs><rect x="0" y="0" width="858" height="763.55" fill="var(--surface)"></rect><g transform="translate(24 24) rotate(0 225 14.375)"><text x="0" y="21.12548828125" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="25px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">隔离令牌：授权在服务端，拒绝在资源端</text></g><g transform="translate(24 70) rotate(0 225.72314453125 9.774999999999999)"><text x="0" y="14.365332031249999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">按 ①—⑤ 读；每次资源操作的检查与修改必须原子、持久。</text></g><g stroke-linecap="round" transform="translate(280 124) rotate(0 150 44)"><path d="M0.01 -0.93 L299.36 -0.79 L300.03 88.3 L-0.53 88.59" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C78.97 0.06, 158.85 0.05, 300 0 M0 0 C86.75 -1.1, 173.37 -0.74, 300 0 M300 0 C298.69 30.64, 299.05 62.8, 300 88 M300 0 C300.39 18.99, 300.16 37.62, 300 88 M300 88 C217.86 87.89, 136.51 88.03, 0 88 M300 88 C207.41 86.63, 114.51 86.95, 0 88 M0 88 C0.46 65.09, -0.53 39.72, 0 0 M0 88 C0.02 54.26, -0.11 21.38, 0 0" stroke="var(--accent)" stroke-width="1.5" fill="none"></path></g><g transform="translate(335.5 143.85) rotate(0 94.5 24.14999999999999)"><text x="94.5" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">租约服务</text><text x="94.5" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">每次新授权递增令牌</text></g><g stroke-linecap="round" transform="translate(24 304) rotate(0 140 50)"><path d="M-0.93 -0.64 L279.21 0.03 L280.3 99.47 L0.59 100.59" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C89.75 0.84, 179.57 0.18, 280 0 M0 0 C86.36 -0.1, 173.43 0.36, 280 0 M280 0 C279.22 20.73, 280.39 41.76, 280 100 M280 0 C280.07 39.67, 279.69 79.75, 280 100 M280 100 C187.27 98.44, 94.66 99.09, 0 100 M280 100 C189.5 100.59, 99.64 100.42, 0 100 M0 100 C1.35 78.52, -0.16 59.72, 0 0 M0 100 C-0.45 66.52, 0.11 32.97, 0 0" stroke="var(--accent)" stroke-width="1.5" fill="none"></path></g><g transform="translate(90.5 329.85) rotate(0 73.5 24.150000000000006)"><text x="73.5" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">① A 得到 33</text><text x="73.5" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">暂停／请求延迟</text></g><g stroke-linecap="round" transform="translate(554 304) rotate(0 140 50)"><path d="M-0.64 -0.79 L280.03 0.3 L279.47 100.59 L0.59 99.76" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C80.97 0.02, 160.7 0.2, 280 0 M0 0 C103.24 0.99, 207.19 0.63, 280 0 M280 0 C278.97 22.55, 278.7 44.49, 280 100 M280 0 C279.67 31.31, 279.81 63.57, 280 100 M280 100 C198.96 100.22, 119.14 100.22, 0 100 M280 100 C223.42 99.16, 166.62 98.77, 0 100 M0 100 C-0.97 77.28, 0.78 56.01, 0 0 M0 100 C-0.14 67.46, -0.17 33.96, 0 0" stroke="var(--accent)" stroke-width="1.5" fill="none"></path></g><g transform="translate(631 329.85) rotate(0 63 24.150000000000006)"><text x="63" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">② B 得到 34</text><text x="63" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">准备建立隔离</text></g><g stroke-linecap="round"><g transform="translate(309.5 218.5) rotate(0 -72.5 39.5)"><path d="M0 0 C-40.12 22.13, -79.92 44.56, -145 79 M0 0 C-41.6 22.34, -83.31 44.32, -145 79" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(309.5 218.5) rotate(0 -72.5 39.5)"><path d="M-128.61 60.12 C-133.24 65.29, -137.58 71.14, -145 79 M-128.61 60.12 C-133.33 65.67, -138.37 70.51, -145 79" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(309.5 218.5) rotate(0 -72.5 39.5)"><path d="M-120.31 75.07 C-127.22 76.14, -133.85 77.87, -145 79 M-120.31 75.07 C-127.34 76.33, -134.75 76.91, -145 79" stroke="var(--accent)" stroke-width="2" fill="none"></path></g></g><mask></mask><g stroke-linecap="round"><g transform="translate(548.5 218.5) rotate(0 72.5 39.5)"><path d="M0 0 C42.02 22.96, 84.52 45.57, 145 79 M0 0 C30.46 16.21, 60.38 32.79, 145 79" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(548.5 218.5) rotate(0 72.5 39.5)"><path d="M120.29 75.23 C127.35 76.41, 135.12 77.3, 145 79 M120.29 75.23 C125.68 75.67, 130.33 76.44, 145 79" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(548.5 218.5) rotate(0 72.5 39.5)"><path d="M128.49 60.23 C133.23 65.73, 138.64 70.96, 145 79 M128.49 60.23 C132.12 63.82, 135.05 67.74, 145 79" stroke="var(--accent)" stroke-width="2" fill="none"></path></g></g><mask></mask><g stroke-linecap="round" transform="translate(280 498) rotate(0 150 66)"><path d="M0.3 -0.53 L300.59 0.59 L299.76 132.71 L0.54 131.4" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C112.69 0.63, 225.13 -0.54, 300 0 M0 0 C69.4 -0.88, 139.11 -0.71, 300 0 M300 0 C301.52 32.3, 300.43 64.22, 300 132 M300 0 C299.63 32.18, 299.01 64.5, 300 132 M300 132 C232.6 131.38, 165.25 131.51, 0 132 M300 132 C205.61 131.4, 111.93 132.03, 0 132 M0 132 C0.72 105.13, 0.72 77.09, 0 0 M0 132 C-0.8 91.02, -0.73 50.69, 0 0" stroke="var(--accent)" stroke-width="1.5" fill="none"></path></g><g transform="translate(328.183837890625 527.775) rotate(0 101.816162109375 36.224999999999966)"><text x="101.816162109375" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">③ 成功记录 max = 34</text><text x="101.816162109375" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">④ 之后拒绝 33</text><text x="101.816162109375" y="66.04541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">⑤ 允许同代次 34</text></g><g stroke-linecap="round"><g transform="translate(693.5 410.5) rotate(0 -77.5 40.5)"><path d="M0 0 C-43.95 23.18, -89.7 46, -155 81 M0 0 C-47.58 23.87, -94.82 48.8, -155 81" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(693.5 410.5) rotate(0 -77.5 40.5)"><path d="M-138.29 62.41 C-142.53 67.63, -148.6 72.54, -155 81 M-138.29 62.41 C-143.69 67.67, -148.62 73.5, -155 81" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(693.5 410.5) rotate(0 -77.5 40.5)"><path d="M-130.25 77.5 C-136.79 78.39, -145.17 78.98, -155 81 M-130.25 77.5 C-138.14 78.11, -145.53 79.33, -155 81" stroke="var(--accent)" stroke-width="2" fill="none"></path></g></g><mask></mask><g transform="translate(620 450) rotate(0 48.51123046875 10.349999999999994)"><text x="0" y="15.2103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">推进代次 34</text></g><g stroke-linecap="round"><g transform="translate(164.5 410.5) rotate(0 77.5 40.5)"><path d="M0 0 C47.5 24.63, 96.26 50.67, 155 81" stroke="var(--accent)" stroke-width="2.5" fill="none" stroke-dasharray="8 10"></path></g><g transform="translate(164.5 410.5) rotate(0 77.5 40.5)"><path d="M130.21 77.75 C137.18 78.23, 145.62 80.19, 155 81" stroke="var(--accent)" stroke-width="2.5" fill="none"></path></g><g transform="translate(164.5 410.5) rotate(0 77.5 40.5)"><path d="M138.1 62.57 C142.67 67.75, 148.67 74.41, 155 81" stroke="var(--accent)" stroke-width="2.5" fill="none"></path></g></g><mask></mask><g transform="translate(42 450) rotate(0 66.51123046875 10.349999999999994)"><text x="0" y="15.2103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">迟到的 33：拒绝</text></g><g transform="translate(24 684) rotate(0 249.115234375 10.925000000000011)"><text x="0" y="16.055371093749997" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">③ 完成是交接屏障；B 应在此后读取最新状态并继续业务。</text></g><g transform="translate(24 720) rotate(0 246.5 9.774999999999977)"><text x="0" y="14.365332031249999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">只发令牌、不检查资源，无法阻挡陈旧写；同代次乱序另需处理。</text></g><script><![CDATA[try{const t=localStorage.getItem('reading-notes-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch{}]]></script></svg>
