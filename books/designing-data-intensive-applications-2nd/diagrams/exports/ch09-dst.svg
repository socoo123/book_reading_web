<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 579.55" width="848" height="579.55" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">随机探索，确定性重放</title><desc id="diagram-desc">种子和故障计划控制模拟网络时钟磁盘调度，实际协议代码产生历史，性质检查器记录失败并通过相同环境重放。</desc>
<style>:root{--surface:#fcfbf8;--text:#292824;--muted:#66645d;--soft:#f0ece4;--accent:#386d74}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--soft:#353534;--accent:#94c8cf}}
:root[data-theme="dark"]{--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--soft:#353534;--accent:#94c8cf}</style><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      </style></defs><rect x="0" y="0" width="848" height="579.55" fill="var(--surface)"></rect><g transform="translate(24 24) rotate(0 237.5 14.375)"><text x="0" y="21.12548828125" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="25px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">确定性模拟测试：控制环境，检查真实代码</text></g><g transform="translate(24 70) rotate(0 221 9.774999999999999)"><text x="0" y="14.365332031249999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">实线：本次执行与记录；虚线：保留条件后重放失败历史。</text></g><g stroke-linecap="round" transform="translate(24 136) rotate(0 127 54)"><path d="M0.7 -0.7 L254.02 -0.8 L253.63 107.86 L-0.21 108.78" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C85.18 0.01, 168.97 -0.67, 254 0 M0 0 C69.03 -1.32, 138.34 -1.16, 254 0 M254 0 C254.72 32.48, 254.62 64.96, 254 108 M254 0 C254.23 29.38, 253.3 58.62, 254 108 M254 108 C202.49 108.42, 149.89 107.89, 0 108 M254 108 C170.45 108.27, 87.32 108.31, 0 108 M0 108 C-0.89 72.25, -1.26 36.06, 0 0 M0 108 C0.15 77.21, -0.03 46.31, 0 0" stroke="var(--accent)" stroke-width="1.5" fill="none"></path></g><g transform="translate(76.03369140625 165.85) rotate(0 74.96630859375 24.14999999999999)"><text x="74.96630859375" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">种子 + 初始状态</text><text x="74.96630859375" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">版本 + 故障计划</text></g><g stroke-linecap="round" transform="translate(494 136) rotate(0 165 54)"><path d="M-0.7 0.02 L329.2 -0.37 L329.86 107.79 L0.78 108.7" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C76.15 -0.99, 151.71 -1.04, 330 0 M0 0 C84.98 0.55, 170.38 0.82, 330 0 M330 0 C330.23 42.72, 330.06 84.92, 330 108 M330 0 C330.48 27.87, 330.58 56.25, 330 108 M330 108 C199.04 108.19, 67.37 108.69, 0 108 M330 108 C209.39 106.76, 88.95 107.11, 0 108 M0 108 C0.17 65.69, -0.52 24.87, 0 0 M0 108 C-0.19 69.41, -0.03 30.58, 0 0" stroke="var(--accent)" stroke-width="1.5" fill="none"></path></g><g transform="translate(543.5 165.85) rotate(0 115.5 24.14999999999999)"><text x="115.5" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">确定性环境</text><text x="115.5" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">网络／时钟／磁盘／调度</text></g><g stroke-linecap="round"><g transform="translate(284.5 190) rotate(0 101.5 0)"><path d="M0 0 C61.14 -0.6, 122.36 -0.32, 203 0 M0 0 C79.56 0.46, 159.69 0.98, 203 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(284.5 190) rotate(0 101.5 0)"><path d="M179.6 8.8 C186.48 5.5, 193.48 3.15, 203 0 M179.6 8.8 C188.52 5.22, 198.04 2.34, 203 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(284.5 190) rotate(0 101.5 0)"><path d="M179.42 -8.3 C186.4 -6.43, 193.46 -3.62, 203 0 M179.42 -8.3 C188.36 -5.15, 197.95 -1.31, 203 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g></g><mask></mask><g transform="translate(330 158) rotate(0 54 10.349999999999994)"><text x="0" y="15.2103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">决定事件顺序</text></g><g stroke-linecap="round" transform="translate(494 344) rotate(0 165 50)"><path d="M-0.37 -0.14 L329.79 0.78 L330.7 99.82 L-0.6 99.39" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C99.85 0.62, 200.71 0.41, 330 0 M0 0 C70.04 0.89, 140.33 0.64, 330 0 M330 0 C329.76 27.81, 330.51 57.23, 330 100 M330 0 C329.03 35.24, 329.56 69.72, 330 100 M330 100 C218.93 100.12, 107.76 99.07, 0 100 M330 100 C243.5 99.99, 156.54 99.55, 0 100 M0 100 C0.28 73.21, 1.24 46.18, 0 0 M0 100 C0.05 64.38, -0.29 29.06, 0 0" stroke="var(--accent)" stroke-width="1.5" fill="none"></path></g><g transform="translate(564.5 369.85) rotate(0 94.5 24.150000000000006)"><text x="94.5" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">实际协议代码</text><text x="94.5" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">生成操作与响应历史</text></g><g stroke-linecap="round"><g transform="translate(658 250.5) rotate(0 0 43.5)"><path d="M0 0 C-0.61 25.14, -0.86 48.09, 0 87 M0 0 C0.2 19.63, -0.09 38.57, 0 87" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(658 250.5) rotate(0 0 43.5)"><path d="M-8.55 63.51 C-6.56 70.85, -4.41 75.99, 0 87 M-8.55 63.51 C-6.32 69.03, -4.71 73.87, 0 87" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(658 250.5) rotate(0 0 43.5)"><path d="M8.55 63.51 C5.74 70.83, 3.1 75.97, 0 87 M8.55 63.51 C6.98 69.03, 4.79 73.87, 0 87" stroke="var(--accent)" stroke-width="2" fill="none"></path></g></g><mask></mask><g stroke-linecap="round" transform="translate(24 344) rotate(0 127 50)"><path d="M-0.21 0.78 L254.7 -0.18 L253.4 99.39 L0.47 100.65" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C56.66 -0.16, 111.09 -0.2, 254 0 M0 0 C63.78 -0.89, 126.86 -0.93, 254 0 M254 0 C254.3 27.31, 254.32 51.9, 254 100 M254 0 C253.58 37.04, 253.71 73.41, 254 100 M254 100 C185.49 99.96, 116.02 100.08, 0 100 M254 100 C184.3 100.69, 115.14 100.54, 0 100 M0 100 C0.9 80.47, 0.59 59.62, 0 0 M0 100 C-0.34 61.16, -0.53 23.05, 0 0" stroke="var(--accent)" stroke-width="1.5" fill="none"></path></g><g transform="translate(46 369.85) rotate(0 105 24.150000000000006)"><text x="105" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">性质检查器</text><text x="105" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">例如：接受代次不回退</text></g><g stroke-linecap="round"><g transform="translate(487.5 394) rotate(0 -101.5 0)"><path d="M0 0 C-55.93 0.05, -111.37 0.32, -203 0 M0 0 C-61.31 0.49, -122.73 0.43, -203 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(487.5 394) rotate(0 -101.5 0)"><path d="M-179.47 -8.45 C-186.49 -6.76, -192.95 -4.15, -203 0 M-179.47 -8.45 C-186.47 -5.9, -193.62 -3.41, -203 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(487.5 394) rotate(0 -101.5 0)"><path d="M-179.54 8.65 C-186.51 5.67, -192.96 3.61, -203 0 M-179.54 8.65 C-186.58 6.03, -193.72 3.35, -203 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g></g><mask></mask><g transform="translate(340 360) rotate(0 36 10.349999999999994)"><text x="0" y="15.2103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">检查历史</text></g><g stroke-linecap="round"><g transform="translate(150 337.5) rotate(0 0 -43.5)"><path d="M0 0 C-0.37 -34.62, 0.27 -67.68, 0 -87" stroke="var(--accent)" stroke-width="2.5" fill="none" stroke-dasharray="8 10"></path></g><g transform="translate(150 337.5) rotate(0 0 -43.5)"><path d="M8.61 -63.53 C4.67 -73.19, 1.92 -81.26, 0 -87" stroke="var(--accent)" stroke-width="2.5" fill="none"></path></g><g transform="translate(150 337.5) rotate(0 0 -43.5)"><path d="M-8.49 -63.49 C-5.71 -73.11, -1.73 -81.2, 0 -87" stroke="var(--accent)" stroke-width="2.5" fill="none"></path></g></g><mask></mask><g transform="translate(170 282) rotate(0 36 10.349999999999994)"><text x="0" y="15.2103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">失败重放</text></g><g transform="translate(24 500) rotate(0 266 10.925000000000011)"><text x="0" y="16.055371093749997" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">随机选择用于发现新路径；相同受控输入用于复现同一条路径。</text></g><g transform="translate(24 536) rotate(0 238 9.774999999999977)"><text x="0" y="14.365332031249999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">模拟通过不等于全部执行已证明，也不代替真实硬件性能测试。</text></g><script><![CDATA[try{const t=localStorage.getItem('reading-notes-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch{}]]></script></svg>
