<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 818 643.7" width="818" height="643.7" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">固定分片与扩容</title><desc id="diagram-desc">三个旧节点各迁出一个逻辑分片给新节点；键到分片的映射保持不变。</desc>
