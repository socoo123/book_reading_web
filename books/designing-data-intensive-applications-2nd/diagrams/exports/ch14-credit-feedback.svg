l, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">雇主按信用筛选</text></g><g stroke-linecap="round" transform="translate(24 354) rotate(0 120 45)"><path d="M0.84 -1 L239.24 0.95 L239.71 89.15 L1.22 88.63" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C58.86 0.05, 117.1 -1.41, 240 0 M0 0 C90.63 -0.05, 182.44 -0.12, 240 0 M240 0 C240.91 18.75, 238.8 37.05, 240 90 M240 0 C240.06 19.11, 240.31 39.66, 240 90 M240 90 C160.39 89.51, 78.32 88.29, 0 90 M240 90 C153.62 88.93, 66.15 89.54, 0 90 M0 90 C-0.39 63.16, -0.52 36, 0 0 M0 90 C0.79 70.54, 0.64 50.58, 0 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(81 374.85) rotate(0 63 24.150000000000006)"><text x="63" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">收入更难恢复</text><text x="63" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">处境继续恶化</text></g><g stroke-linecap="round"><g transform="translate(274.5 189) rotate(0 62.5 0)"><path d="M0 0 C36.78 -0.73, 70.72 1.11, 125 0 M0 0 C41.52 0.91, 83.27 0.17, 125 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(274.5 189) rotate(0 62.5 0)"><path d="M101.56 8.7 C109.3 5.49, 114.24 4.85, 125 0 M101.56 8.7 C109.1 6.03, 116.87 2.37, 125 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(274.5 189) rotate(0 62.5 0)"><path d="M101.45 -8.4 C109.29 -6.72, 114.26 -2.48, 125 0 M101.45 -8.4 C109.01 -5.35, 116.82 -3.28, 125 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><