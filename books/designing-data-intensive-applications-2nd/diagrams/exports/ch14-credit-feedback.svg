@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--soft:#353534;--accent:#94c8cf}}
:root[data-theme="dark"]{--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--soft:#353534;--accent:#94c8cf}</style><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      </style></defs><rect x="0" y="0" width="674" height="571.55" fill="var(--surface)"></rect><g transform="translate(24 24) rotate(0 175 14.375)"><text x="0" y="21.12548828125" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="25px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">一次不幸，怎样被反馈循环延长</text></g><g transform="translate(24 70) rotate(0 212.5 9.774999999999999)"><text x="0" y="14.365332031249999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">前提：雇主使用信用分筛选；外部冲击先造成还款困难。</text></g><g stroke-linecap="round" transform="translate(24 144) rotate(0 120 45)"><path d="M1.13 0.06 L241.25 0.84 L239 89.24 L0.95 89.71" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C87.66 -0.57, 177.31 -0.39, 240 0 M0 0 C91.01 0.87, 181 0.12, 240 0 M240 0 C238.75 22.08, 241.23 47.31, 240 90 M240 0 C239.08 28.59, 239.14 57.42, 240 90 M240 90 C187.12 91.04, 132.36 91.82, 0 90 M240 90 C152.95 89.33, 64.8 89.84, 0 90 M0 90 C0.2 66.49, 0.57 41.26, 0 0 M0 90 C-0.48 65.4, 0.3 42.32, 0 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(102 164.85) rotate(0 42 24.14999999999999)"><text x="42" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">还款困难</text><text x="42" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">错过账单</text></g><g stroke-linecap="round" transform="translate(410 144) rotate(0 120 45)"><path d="M0.06 1.25 L240.84 -1 L239.24 90.