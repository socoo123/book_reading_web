<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 674 571.55" width="674" height="571.55" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">一次不幸怎样被反馈循环延长</title><desc id="diagram-desc">还款困难使信用下降；若雇主按信用筛选，就业减少、收入难恢复，再导致后续还款困难。虚线表示反馈。</desc>
