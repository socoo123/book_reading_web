chor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">实线：本例影响路径　虚线：处境返回输入；不是普遍因果定律。</text></g><script><![CDATA[try{const t=localStorage.getItem('reading-notes-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch{}]]></script></svg>
