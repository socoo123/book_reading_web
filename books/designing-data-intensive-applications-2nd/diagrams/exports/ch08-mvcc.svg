hor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">实线：当前快照可见　　虚线：被旧快照过滤</text><text x="0" y="37.90537109374999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">版本能否回收，取决于是否仍有有效快照需要它。</text></g><script><![CDATA[try{const t=localStorage.getItem('reading-notes-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch{}]]></script></svg>
