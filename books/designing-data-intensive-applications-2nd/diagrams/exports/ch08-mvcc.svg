:root[data-theme="dark"]{--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--soft:#353534;--accent:#94c8cf}</style><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      </style></defs><rect x="0" y="0" width="802" height="625.7" fill="var(--surface)"></rect><g transform="translate(24 24) rotate(0 149.30419921875 14.375)"><text x="0" y="21.12548828125" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="25px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">MVCC：同一行的两个版本</text></g><g transform="translate(24 68) rotate(0 260.677734375 9.774999999999999)"><text x="0" y="14.365332031249999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">插入／删除标记为教学模型；事务 13 已提交，但旧快照不因此改变。</text></g><g stroke-linecap="round" transform="translate(24 138) rotate(0 124 56)"><path d="M1.2 0.53 L248.25 -0.68 L248.63 112.12 L0.75 111.9" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C57.93 0.48, 117.2 0.42, 248 0 M0 0 C78.5 0.86, 157.66 0.08, 248 0 M248 0 C246.93 26.48, 247.8 54.49, 248 112 M248 0 C247.73 42.61, 247.05 83.99, 248 112 M248 112 C189.86 111.93, 129.91 113.32, 0 112 M248 112 C170.04 111.28, 92.15 111.46, 0 112 M0 112 C0.07 75.35, 0.57 35.57, 0 0 M0 112 C1.01 82.86, 0.47 53.41, 0 0" stroke="var(--accent)" stroke-width="1" fill="none"></path></g><g transform="translate(46.486328125 169.85) rotate(0 101.513671875 24.14999999999999)"><text x="101.513671875" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">旧快照</text><text x="101.513671875" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">在事务 13 开始前取点</text></g><g stroke-linecap="round