<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 802 625.7" width="802" height="625.7" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">MVCC按快照选择版本</title><desc id="diagram-desc">旧快照读取500并忽略事务13的删除和插入，新快照读取400；插入删除标记是教学模型。</desc>
