ont-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">资源已接受 B 的写</text><text x="86.337890625" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">又收到 A 的旧写</text><text x="86.337890625" y="66.04541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">凭什么拒绝？</text></g><g stroke-linecap="round"><g transform="translate(696 224.5) rotate(0 0 65.5)"><path d="M0 0 C-0.7 33.21, -1.06 66.77, 0 131 M0 0 C0.09 37.29, 0.62 73.48, 0 131" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(696 224.5) rotate(0 0 65.5)"><path d="M-8.4 107.45 C-6.75 113.57, -4.99 120.05, 0 131 M-8.4 107.45 C-6.29 114.45, -3.38 120.34, 0 131" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(696 224.5) rotate(0 0 65.5)"><path d="M8.7 107.56 C6.04 113.66, 3.49 120.11, 0 131 M8.7 107.56 C5.99 114.53, 4.08 120.4, 0 131" stroke="var(--accent)" stroke-width="2" fill="none"></path></g></g><mask></mask><g transform="translate(712 268) rotate(0 42.5 9.775000000000006)"><text x="0" y="14.365332031249999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">先完成新写</text></g><g stroke-linecap="round"><g transform="translate(362.5 356.5) rotate(0 100.5 21.5)"><path d="M0 0 C62.9 14.1, 127.13 27.63, 201 43" stroke="var(--accent)" stroke-width="2.5" fill="none" stroke-dasharray="8 10"></path></g><g transform="translate(362.5 356