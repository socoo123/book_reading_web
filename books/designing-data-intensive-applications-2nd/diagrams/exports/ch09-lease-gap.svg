<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 669.85" width="848" height="669.85" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">授权转移后，两条陈旧写路径仍然存在</title><desc id="diagram-desc">锁服务将租约从A转移给B，但A恢复的写或A崩溃前已发送的延迟写仍能到达资源。</desc>
