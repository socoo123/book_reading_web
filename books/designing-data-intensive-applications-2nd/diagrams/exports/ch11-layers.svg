<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 818 758.7" width="818" height="758.7" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">批处理的三种职责</title><desc id="diagram-desc">工作流与资源调度控制计算任务，计算读取只读输入并写新版本输出；虚线为控制，实线为数据。</desc>
<style>:root{--surface:#fcfbf8;--text:#292824;--muted:#66645d;--soft:#f0ece4;--accent:#386d74}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--soft:#353534;--accent:#94c8cf}}
:root[data-theme="dark"]{--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--soft:#353534;--accent:#94c8cf}</style><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      </style></defs><rect x="0" y="0" width="818" height="758.7" fill="var(--surface)"></rect><g transform="translate(24 24) rotate(0 169 14.95)"><text x="0" y="21.9705078125" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="26px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">同一条批管道，三个不同职责</text></g><g transform="translate(24 69) rotate(0 225 10.350000000000001)"><text x="0" y="15.2103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">虚线是运行控制；实线是数据读写。方框表示逻辑角色。</text></g><g stroke-linecap="round" transform="translate(24 139) rotate(0 140 50)"><path d="M-0.89 -0.94 L280.77 0.67 L280.07 100.6 L0.78 99.94" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C67.18 0.51, 134.64 -0.13, 280 0 M0 0 C96.78 0.39, 193.92 -0.26, 280 0 M280 0 C279.75 36.75, 279.32 72.01, 280 100 M280 0 C279.86 26.56, 279.8 54.05, 280 100 M280 100 C207.03 99.47, 132.18 99.09, 0 100 M280 100 C194.69 99.13, 109.95 99.37, 0 100 M0 100 C0.13 71.07, -0.27 40.74, 0 0 M0 100 C0 70.26, 0.65 41.64, 0 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(69.5 164.85) rotate(0 94.5 24.14999999999999)"><text x="94.5" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">工作流编排</text><text x="94.5" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">依赖就绪才提交作业</text></g><g stroke-linecap="round" transform="translate(514 139) rotate(0 140 50)"><path d="M-0.94 0.77 L280.67 0.07 L280.6 100.78 L-0.06 99.58" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C59.48 0.08, 117.93 0.83, 280 0 M0 0 C96.45 0.39, 191.91 0.32, 280 0 M280 0 C280.61 23.32, 280.06 47.05, 280 100 M280 0 C280.01 25.02, 280.62 49.76, 280 100 M280 100 C177.93 100.34, 75.81 100.94, 0 100 M280 100 C215.68 99.57, 151.61 99.41, 0 100 M0 100 C0.49 72.01, -0.1 44.72, 0 0 M0 100 C0.11 75.46, 0.86 49.7, 0 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(543.160400390625 164.85) rotate(0 110.839599609375 24.14999999999999)"><text x="110.839599609375" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">资源调度</text><text x="110.839599609375" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">分配 CPU／内存／GPU</text></g><g stroke-linecap="round"><g transform="translate(309.5 189) rotate(0 99.5 0)"><path d="M0 0 C57 -0.83, 115.49 -0.07, 199 0" stroke="var(--accent)" stroke-width="2.5" fill="none" stroke-dasharray="8 10"></path></g><g transform="translate(309.5 189) rotate(0 99.5 0)"><path d="M175.48 8.49 C181.78 5.65, 189.55 3.95, 199 0" stroke="var(--accent)" stroke-width="2.5" fill="none"></path></g><g transform="translate(309.5 189) rotate(0 99.5 0)"><path d="M175.53 -8.62 C181.78 -6.51, 189.54 -3.26, 199 0" stroke="var(--accent)" stroke-width="2.5" fill="none"></path></g></g><mask></mask><g transform="translate(354 154) rotate(0 36 10.349999999999994)"><text x="0" y="15.2103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">提交作业</text></g><g stroke-linecap="round" transform="translate(24 349) rotate(0 140 50)"><path d="M0.07 0.6 L280.78 -0.06 L279.58 99.41 L-0.55 100.93" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C98.61 0.68, 196.48 0.28, 280 0 M0 0 C109.08 0.63, 217.47 0.9, 280 0 M280 0 C279.51 38.81, 280.47 78.85, 280 100 M280 0 C279.86 23.96, 279.96 47.7, 280 100 M280 100 C208.3 98.45, 135.91 98.58, 0 100 M280 100 C196.21 100.59, 112.69 100.69, 0 100 M0 100 C0.13 61.33, -0.76 23.16, 0 0 M0 100 C-0.84 76.9, -0.01 55.07, 0 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(90.5 374.85) rotate(0 73.5 24.150000000000006)"><text x="73.5" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">存储：输入快照</text><text x="73.5" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">固定清单，只读</text></g><g stroke-linecap="round" transform="translate(514 349) rotate(0 140 50)"><path d="M0.6 0.78 L279.94 -0.42 L279.41 99.45 L0.93 99.17" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C69.8 -0.53, 138.87 0.19, 280 0 M0 0 C105.12 -0.87, 210.75 -0.27, 280 0 M280 0 C279.69 27.03, 280.42 52.12, 280 100 M280 0 C280.61 30.87, 280.72 61.69, 280 100 M280 100 C216.45 99.42, 153.57 100.04, 0 100 M280 100 C185.13 100.22, 90.45 100.29, 0 100 M0 100 C-0.62 72.9, -0.63 46.97, 0 0 M0 100 C-0.85 62.5, -0.04 24.27, 0 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(558.3310546875 374.85) rotate(0 95.6689453125 24.150000000000006)"><text x="95.6689453125" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">计算任务</text><text x="95.6689453125" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">扫描 → 连接 → 聚合</text></g><g stroke-linecap="round"><g transform="translate(654 244.5) rotate(0 0 49.5)"><path d="M0 0 C0.18 26.38, 1.11 53.7, 0 99" stroke="var(--accent)" stroke-width="2.5" fill="none" stroke-dasharray="8 10"></path></g><g transform="translate(654 244.5) rotate(0 0 49.5)"><path d="M-8.21 75.39 C-6.01 81.6, -2.88 88.76, 0 99" stroke="var(--accent)" stroke-width="2.5" fill="none"></path></g><g transform="translate(654 244.5) rotate(0 0 49.5)"><path d="M8.89 75.63 C6.52 81.81, 5.08 88.91, 0 99" stroke="var(--accent)" stroke-width="2.5" fill="none"></path></g></g><mask></mask><g transform="translate(684 279) rotate(0 45 10.349999999999994)"><text x="0" y="15.2103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">分配／启动</text></g><g stroke-linecap="round"><g transform="translate(309.5 399) rotate(0 99.5 0)"><path d="M0 0 C69.19 0.85, 135.8 0.67, 199 0 M0 0 C47.6 -0.25, 94.45 -0.22, 199 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(309.5 399) rotate(0 99.5 0)"><path d="M175.49 8.51 C184.45 6.36, 190.82 3.26, 199 0 M175.49 8.51 C181.55 6.3, 186.84 4.31, 199 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(309.5 399) rotate(0 99.5 0)"><path d="M175.52 -8.59 C184.47 -4.87, 190.83 -2.1, 199 0 M175.52 -8.59 C181.52 -6.75, 186.8 -4.69, 199 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g></g><mask></mask><g transform="translate(349 364) rotate(0 36 10.349999999999994)"><text x="0" y="15.2103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">读取记录</text></g><g stroke-linecap="round" transform="translate(514 564) rotate(0 140 50)"><path d="M-0.55 0.93 L279.17 -0.81 L280.69 99.22 L0.64 99.9" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C80.96 -0.37, 162.67 -1.31, 280 0 M0 0 C86.06 0.27, 171.65 0.64, 280 0 M280 0 C280.28 31.93, 280.32 64.43, 280 100 M280 0 C279.31 38.52, 279.43 76.6, 280 100 M280 100 C211.54 100.39, 141.92 100.92, 0 100 M280 100 C195.78 99.56, 111.19 99.22, 0 100 M0 100 C1.12 74.24, -0.57 51.02, 0 0 M0 100 C0.36 63.26, -0.24 26.28, 0 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(559.5 589.85) rotate(0 94.5 24.149999999999977)"><text x="94.5" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">存储：新版本输出</text><text x="94.5" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">完整确认后交给下游</text></g><g stroke-linecap="round"><g transform="translate(654 454.5) rotate(0 0 52)"><path d="M0 0 C0.98 39.8, -0.24 80.94, 0 104 M0 0 C-0.34 40.63, 0.14 81.88, 0 104" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(654 454.5) rotate(0 0 52)"><path d="M-8.55 80.51 C-4.56 89.04, -2.45 98.88, 0 104 M-8.55 80.51 C-5.39 89.48, -1.54 99.08, 0 104" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(654 454.5) rotate(0 0 52)"><path d="M8.55 80.51 C5.9 88.97, 1.35 98.81, 0 104 M8.55 80.51 C4.99 89.51, 2.11 99.11, 0 104" stroke="var(--accent)" stroke-width="2" fill="none"></path></g></g><mask></mask><g transform="translate(684 489) rotate(0 36 10.349999999999994)"><text x="0" y="15.2103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">写入结果</text></g><g transform="translate(24 569) rotate(0 110.8271484375 32.77499999999998)"><text x="0" y="16.055371093749997" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">工作流决定“何时可消费”。</text><text x="0" y="37.90537109374999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">计算引擎决定“如何计算”。</text><text x="0" y="59.75537109374999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">存储保存数据与版本。</text></g><g transform="translate(24 714) rotate(0 225 10.350000000000023)"><text x="0" y="15.2103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">三种职责可由多个工具协作，也可集成于同一托管服务。</text></g><script><![CDATA[try{const t=localStorage.getItem('reading-notes-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch{}]]></script></svg>
