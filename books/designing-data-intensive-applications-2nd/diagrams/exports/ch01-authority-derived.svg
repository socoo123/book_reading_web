<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 567.55" width="670" height="567.55" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">权威记录与派生数据</title><desc id="diagram-desc">商品修改先进入权威记录，再分别更新搜索索引与分析汇总。实线为写入，虚线为可能滞后的派生传播，没有共同事务。</desc>
