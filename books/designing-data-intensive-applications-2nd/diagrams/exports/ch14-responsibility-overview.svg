<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 674 563.7" width="674" height="563.7" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">把责任从数据管道接回人的生活</title><desc id="diagram-desc">顺时针从人的行为进入采集保留、分析决策和生活结果，再返回人的处境；采集与决策分别需要选择权与问责。</desc>
