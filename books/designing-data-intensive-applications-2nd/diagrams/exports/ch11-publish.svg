<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 803 768.7" width="803" height="768.7" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">派生版本的完整性屏障与发布</title><desc id="diagram-desc">V18暂存不可见，核对全部分片与结束位点后原子切换当前引用，失败时继续服务V17。</desc>
<style>:root{--surface:#fcfbf8;--text:#292824;--muted:#66645d;--soft:#f0ece4;--accent:#386d74}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--soft:#353534;--accent:#94c8cf}}
:root[data-theme="dark"]{--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--soft:#353534;--accent:#94c8cf}</style><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      </style></defs><rect x="0" y="0" width="803" height="768.7" fill="var(--surface)"></rect><g transform="translate(24 24) rotate(0 156.74267578125 14.95)"><text x="0" y="21.9705078125" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="26px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">发布 V18：先完整，再切换</text></g><g transform="translate(24 69) rotate(0 234 10.350000000000001)"><text x="0" y="15.2103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">笔记教学协议；实线为数据访问，虚线为完成证据与发布控制。</text></g><g stroke-linecap="round" transform="translate(24 139) rotate(0 117.5 50)"><path d="M-0.16 0.17 L234.39 -0.23 L234.38 99.11 L-0.42 100.63" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C62.74 1.18, 126.51 0.54, 235 0 M0 0 C87.2 0.97, 174.38 0.61, 235 0 M235 0 C235.15 35.7, 234.79 72.3, 235 100 M235 0 C234.53 34.32, 234.73 68.93, 235 100 M235 100 C164.1 99.51, 92.05 100.63, 0 100 M235 100 C155.19 99.52, 74.66 99.38, 0 100 M0 100 C0.56 79.6, 0.41 57.82, 0 0 M0 100 C0.68 77.22, -0.23 53.91, 0 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(67.400146484375 164.85) rotate(0 74.099853515625 24.14999999999999)"><text x="74.099853515625" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">批任务／导入器</text><text x="74.099853515625" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">输出带版本 V18</text></g><g stroke-linecap="round" transform="translate(439 139) rotate(0 170 50)"><path d="M0.17 -0.61 L339.77 -0.62 L339.11 99.58 L0.63 100.75" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C109.81 0.72, 218.65 1.02, 340 0 M0 0 C92.2 0.14, 183.96 0.6, 340 0 M340 0 C339.14 34.62, 339.49 70.63, 340 100 M340 0 C339.33 23.47, 339.4 46.84, 340 100 M340 100 C257.94 100.83, 177.3 101.07, 0 100 M340 100 C263.94 100.8, 187.76 100.55, 0 100 M0 100 C0.14 74.13, -1.04 47.12, 0 0 M0 100 C0.15 73.97, -0.36 48.76, 0 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(525 164.85) rotate(0 84 24.14999999999999)"><text x="84" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">V18 暂存空间</text><text x="84" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">对在线查询不可见</text></g><g stroke-linecap="round"><g transform="translate(264.5 189) rotate(0 84.5 0)"><path d="M0 0 C40.65 -0.65, 81.47 -0.87, 169 0 M0 0 C37.13 -0.59, 75.32 -0.13, 169 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(264.5 189) rotate(0 84.5 0)"><path d="M145.49 8.49 C151.4 6.31, 157.46 4.06, 169 0 M145.49 8.49 C150.35 6.36, 156.25 4.92, 169 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(264.5 189) rotate(0 84.5 0)"><path d="M145.53 -8.61 C151.39 -6.71, 157.44 -4.87, 169 0 M145.53 -8.61 C150.35 -6.95, 156.24 -4.59, 169 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g></g><mask></mask><g transform="translate(304 154) rotate(0 45 10.349999999999994)"><text x="0" y="15.2103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">文件或日志</text></g><g stroke-linecap="round" transform="translate(439 344) rotate(0 170 62.5)"><path d="M-0.62 -0.89 L339.58 0.63 L340.75 125.18 L-0.58 124.14" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C125.59 -0.11, 249.71 -0.14, 340 0 M0 0 C117.79 0.62, 234.96 0.41, 340 0 M340 0 C340.16 29.93, 338.81 60.9, 340 125 M340 0 C340.09 31.72, 340.16 64.4, 340 125 M340 125 C265.54 125.1, 190.21 126.12, 0 125 M340 125 C237.37 124.51, 135.4 124.76, 0 125 M0 125 C-0.85 84.56, -0.39 45.93, 0 0 M0 125 C0.48 87.08, 0.26 48.88, 0 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(504 370.275) rotate(0 105 36.224999999999994)"><text x="105" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">完整性屏障</text><text x="105" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">全部预期分片已完成</text><text x="105" y="66.04541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">消费位点／清单已核对</text></g><g stroke-linecap="round"><g transform="translate(609 244.5) rotate(0 0 47)"><path d="M0 0 C-0.33 30.01, -0.38 62.03, 0 94" stroke="var(--accent)" stroke-width="2.5" fill="none" stroke-dasharray="8 10"></path></g><g transform="translate(609 244.5) rotate(0 0 47)"><path d="M-8.74 70.58 C-6.18 77.44, -3.36 86.35, 0 94" stroke="var(--accent)" stroke-width="2.5" fill="none"></path></g><g transform="translate(609 244.5) rotate(0 0 47)"><path d="M8.36 70.44 C5.32 77.41, 2.53 86.36, 0 94" stroke="var(--accent)" stroke-width="2.5" fill="none"></path></g></g><mask></mask><g transform="translate(639 279) rotate(0 54 10.349999999999994)"><text x="0" y="15.2103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">提交完成证据</text></g><g transform="translate(24 354) rotate(0 95 43.69999999999999)"><text x="0" y="16.055371093749997" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">构建失败或数据未齐：</text><text x="0" y="37.90537109374999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">继续服务 V17。</text><text x="0" y="59.75537109374999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">收到完成通知，不等于</text><text x="0" y="81.60537109375" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">已经应用所有分片。</text></g><g stroke-linecap="round" transform="translate(439 579) rotate(0 170 47.5)"><path d="M0.75 0.18 L339.42 -0.86 L340.74 95.64 L-0.74 94.74" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C92.35 -0.11, 183.83 0.8, 340 0 M0 0 C119.12 -0.03, 238.53 0.27, 340 0 M340 0 C339.14 22.35, 339.28 44.52, 340 95 M340 0 C339.69 22.8, 340.35 45.76, 340 95 M340 95 C263.94 95.73, 187.65 95.24, 0 95 M340 95 C251.39 95.49, 162.32 95.18, 0 95 M0 95 C0.16 69.8, -0.86 46.