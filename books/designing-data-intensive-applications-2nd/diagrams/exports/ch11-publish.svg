C163.49 94.35, 93.65 94.99, 0 95 M235 95 C159.5 93.84, 84.51 94.41, 0 95 M0 95 C0.26 66.29, -0.18 37.01, 0 0 M0 95 C0.74 72.76, 0.51 49.49, 0 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(36.5 602.35) rotate(0 105 24.149999999999977)"><text x="105" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">在线读者</text><text x="105" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">每次查询固定一个版本</text></g><g stroke-linecap="round"><g transform="translate(264.5 626) rotate(0 84.5 0)"><path d="M0 0 C38.57 -1.14, 76.01 -1.08, 169 0 M0 0 C42.49 -0.83, 85.51 -0.6, 169 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(264.5 626) rotate(0 84.5 0)"><path d="M145.45 8.4 C151.28 5.82, 155.97 3.99, 169 0 M145.45 8.4 C151.1 5.77, 157.26 3.87, 169 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(264.5 626) rotate(0 84.5 0)"><path d="M145.56 -8.7 C151.33 -7.43, 155.99 -5.41, 169 0 M145.56 -8.7 C151.16 -7, 157.29 -4.56, 169 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g></g><mask></mask><g transform="translate(304 594) rotate(0 36 10.350000000000023)"><text x="0" y="15.2103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">选择版本</text></g><g transform="translate(24 724) rotate(0 279.51416015625 10.350000000000023)"><text x="0" y="15.2103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">V17 在旧读者退出且回滚保留期结束后清理；不是多个系统共同事务。</text></g><script><![CDATA[try{const t=localStorage.getItem('reading-notes-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch{}]]></script></svg>
