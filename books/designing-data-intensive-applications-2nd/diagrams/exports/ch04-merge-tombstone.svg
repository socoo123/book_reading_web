<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 784 573.55" width="784" height="573.55" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">局部合并为什么必须保留删除标记</title><desc id="diagram-desc">S1和S2合并后保留b的墓碑，未参加合并的S0仍保存b等于2。</desc>
<style>:root{--surface:#fcfbf8;--text:#292824;--muted:#66645d;--soft:#f0ece4;--accent:#386d74}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--soft:#353534;--accent:#94c8cf}}
:root[data-theme="dark"]{--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--soft:#353534;--accent:#94c8cf}</style><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      </style></defs><rect x="0" y="0" width="784" height="573.55" fill="var(--surface)"></rect><g transform="translate(24 24) rotate(0 187.5 14.375)"><text x="0" y="21.12548828125" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="25px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">局部合并：删除标记仍有工作要做</text></g><g transform="translate(24 66) rotate(0 211.10546875 9.774999999999999)"><text x="0" y="14.365332031249999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">S0 最旧，S2 最新；† 表示删除。本例不保留历史快照。</text></g><g stroke-linecap="round" transform="translate(24 122) rotate(0 105 54)"><path d="M1.12 -1.18 L210.57 -0.4 L210.2 107.35 L-1.34 108.09" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C64.02 1.18, 126.83 0.74, 210 0 M210 0 C210.97 33.25, 209.91 66.05, 210 108 M210 108 C145.41 107.13, 82.38 108.59, 0 108 M0 108 C0.31 68.29, 0.78 25.6, 0 0" stroke="var(--accent)" stroke-width="2.5" fill="none" stroke-dasharray="8 10"></path></g><g transform="translate(63.656982421875 151.85) rotate(0 65.343017578125 24.14999999999999)"><text x="65.343017578125" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">S0（未参与）</text><text x="65.343017578125" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">b = 2</text></g><g stroke-linecap="round" transform="translate(292 122) rotate(0 105 54)"><path d="M0.99 0.3 L208.83 -1.08 L209.36 109.37 L0.48 106.91" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C73.01 -0.36, 145.33 -0.85, 210 0 M0 0 C65.26 -0.9, 130.32 -0.78, 210 0 M210 0 C208.87 33.78, 210.52 65.91, 210 108 M210 0 C209.96 22.79, 208.91 46.04, 210 108 M210 108 C164.92 107.06, 118.3 107.71, 0 108 M210 108 C127.85 107.76, 45.02 106.88, 0 108 M0 108 C-0.7 82.21, -1.03 57.38, 0 0 M0 108 C-0.33 68.48, -0.13 29.26, 0 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(322.56689453125 151.85) rotate(0 74.43310546875 24.14999999999999)"><text x="74.43310546875" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">S1</text><text x="74.43310546875" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">a=1，b=4，d=6</text></g><g stroke-linecap="round" transform="translate(550 122) rotate(0 105 54)"><path d="M0.3 -1.17 L208.92 -0.64 L211.37 108.48 L-1.09 107.71" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C48.75 -0.45, 96.43 -0.14, 210 0 M0 0 C55.65 -0.2, 111.48 -0.02, 210 0 M210 0 C211.24 34.98, 210.95 67.97, 210 108 M210 0 C209.85 24.89, 210.36 50.4, 210 108 M210 108 C137.9 107, 67.02 109.33, 0 108 M210 108 C137.68 108.91, 63.95 108.41, 0 108 M0 108 C-0.67 73.7, -0.18 42.28, 0 0 M0 108 C0.4 70.21, 0.89 32.38, 0 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(609.467529296875 151.85) rotate(0 45.532470703125 24.14999999999999)"><text x="45.532470703125" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">S2</text><text x="45.532470703125" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">b=†，c=5</text></g><g transform="translate(24 269) rotate(0 82.00634765625 31.05000000000001)"><text x="0" y="15.2103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">更旧的 b 仍在这里。</text><text x="0" y="35.9103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">虚线框表示它不参加</text><text x="0" y="56.6103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">这一次压缩合并。</text></g><g stroke-linecap="round" transform="translate(316 340) rotate(0 210 50)"><path d="M-1.08 -0.64 L421.37 0.48 L418.91 99.71 L-0.72 101.17" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C134.85 0.31, 269.32 0.7, 420 0 M0 0 C126.87 0.44, 253.77 0.39, 420 0 M420 0 C421.74 19.56, 419.78 41.25, 420 100 M420 0 C420.61 35.68, 420.33 72.34, 420 100 M420 100 C288.17 99.19, 156.58 98.05, 0 100 M420 100 C267.41 99.98, 115.28 100.33, 0 100 M0 100 C0.26 75.5, 0.97 48.7, 0 0 M0 100 C0.49 69.5, -0.03 37.42, 0 0" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(423.845458984375 365.85) rotate(0 102.154541015625 24.150000000000006)"><text x="102.154541015625" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">合并输出</text><text x="102.154541015625" y="41.895410156249994" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">a=1，b=†，c=5，d=6</text></g><g stroke-linecap="round"><g transform="translate(397.5 236.5) rotate(0 24.5 48.5)"><path d="M0 0 C17.03 33.2, 34.66 67.28, 49 97 M0 0 C13.94 28.03, 27.96 55.28, 49 97" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(397.5 236.5) rotate(0 24.5 48.5)"><path d="M30.77 79.9 C37.2 85.4, 44.16 91.77, 49 97 M30.77 79.9 C35.99 84.94, 41.15 89.19, 49 97" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(397.5 236.5) rotate(0 24.5 48.5)"><path d="M46.03 72.18 C47.16 80.37, 48.83 89.42, 49 97 M46.03 72.18 C46.84 79.45, 47.61 85.92, 49 97" stroke="var(--accent)" stroke-width="2" fill="none"></path></g></g><mask></mask><g stroke-linecap="round"><g transform="translate(654.5 236.5) rotate(0 -24.5 48.5)"><path d="M0 0 C-14.35 28.47, -27.89 55.24, -49 97 M0 0 C-13.15 26.27, -27.14 53.29, -49 97" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(654.5 236.5) rotate(0 -24.5 48.5)"><path d="M-46.08 72.17 C-47.32 80.02, -47.71 86.2, -49 97 M-46.08 72.17 C-46.74 78.83, -48.21 86.24, -49 97" stroke="var(--accent)" stroke-width="2" fill="none"></path></g><g transform="translate(654.5 236.5) rotate(0 -24.5 48.5)"><path d="M-30.8 79.86 C-36.4 85.52, -41.16 89.51, -49 97 M-30.8 79.86 C-35.62 84.43, -41.24 89.75, -49 97" stroke="var(--accent)" stroke-width="2" fill="none"></path></g></g><mask></mask><g transform="translate(452 275) rotate(0 68 9.775000000000006)"><text x="0" y="14.365332031249999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">同键保留较新版本</text></g><g transform="translate(24 490) rotate(0 262.07568359375 10.925000000000011)"><text x="0" y="16.055371093749997" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">若输出不保留 †，读取可能继续命中 S0 的 b=2，让旧值复活。</text></g><g transform="translate(24 530) rotate(0 238 9.774999999999977)"><text x="0" y="14.365332031249999" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">只有确认旧版本已处理、且无需保留历史状态，才能移除墓碑。</text></g><script><![CDATA[try{const t=localStorage.getItem('reading-notes-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch{}]]></script></svg>
