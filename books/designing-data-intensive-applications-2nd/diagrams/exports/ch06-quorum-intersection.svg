:root[data-theme="dark"]{--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--soft:#353534;--accent:#94c8cf}</style><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      </style></defs><rect x="0" y="0" width="788" height="628.7" fill="var(--surface)"></rect><g transform="translate(24 24) rotate(0 187.5 14.375)"><text x="0" y="21.12548828125" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="25px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">固定三副本：写二、读二必有交集</text></g><g transform="translate(24 66) rotate(0 198 10.350000000000001)"><text x="0" y="15.2103515625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18px" fill="var(--muted)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">前提：写已完成，副本没有丢失版本，随后再读。</text></g><g stroke-linecap="round" transform="translate(24 116) rotate(0 370 190)"><path d="M0 0 C152.67 -1.56, 305.31 -2.24, 740 0 M0 0 C183.64 1.93, 366.95 1.85, 740 0 M740 0 C739.04 107.44, 739.59 215.26, 740 380 M740 0 C739.36 85.26, 739 170.68, 740 380 M740 380 C534.04 379.23, 327.53 378.95, 0 380 M740 380 C576.6 378.37, 412.9 378.43, 0 380 M0 380 C0.37 293.61, 0.77 206.9, 0 0 M0 380 C-1.18 272.07, -0.76 164.31, 0 0" stroke="var(--accent)" stroke-width="1.5" fill="none"></path></g><g transform="translate(44 132) rotate(0 113.763427734375 10.924999999999997)"><text x="0" y="16.055371093749997" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19px" fill="var(--text)" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">同一副本集合 N = {A, B, C}</text></g><g stroke-linecap="round" transform="translate(49 182) rotate(0 225 85)"><path d="M0 0 C174.36 -1.23, 349.15 -1.26, 450 0 M0 0 C90.53 0.37, 181.21 0.48, 450 0 M450 0 C449.65 58.88, 448.36 118.24, 450 170 M450 0 C450.98 45.65, 450.85 92.02, 450 170 M450 170 C330.36 169.5, 211.19 169.91, 0 170 M450 170 C348.25 169.53, 246.81 169.3, 0 170 M0 170 C0.46 125.26, 0.94 81.85, 0 0 M0 170 C0.9 134.74, 1.07 97.96, 0 0" stroke="var(--accen