<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 788 628.7" width="788" height="628.7" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">固定三副本上的读写交集</title><desc id="diagram-desc">完成写集合AB与随后读集合BC在B相交；依赖版本未丢失和固定成员。</desc>
