necap="round" transform="translate(324 269) rotate(0 70 30)"><path d="M-1.36 1.06 L138.64 -1.25 L140.13 59.45 L1.05 59.5" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C35.36 0.42, 69.01 0.02, 140 0 M0 0 C39.38 -0.82, 79.57 -0.83, 140 0 M140 0 C140.91 13.1, 139.71 26.7, 140 60 M140 0 C140.36 16.65, 139.75 33.02, 140 60 M140 60 C109.27 58.86, 77.02 59.16, 0 60 M140 60 C107.46 59.7, 75.93 59.51, 0 60 M0 60 C-0.87 43.19, 0.51 26.96, 0 0 M0 60 C0.39 37.74, -0.3 14.65, 0 0" stroke="var(--accent)" stroke-width="1.5" fill="none"></path></g><g transform="translate(357.244873046875 286.925) rotate(0 36.755126953125 12.074999999999989)"><text x="36.755126953125" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">B · 新值</text></g><g stroke-linecap="round" transform="translate(564 269) rotate(0 70 30)"><path d="M1.06 -1.36 L138.75 0.13 L139.45 61.05 L-0.5 60.12" stroke="none" stroke-width="0" fill="var(--soft)"></path><path d="M0 0 C30.61 -0.88, 61.36 -0.67, 140 0 M0 0 C36.87 0.6, 74.06 -0.05, 140 0 M140 0 C139.49 14.26, 139.61 28.27, 140 60 M140 0 C139.8 21.38, 139.46 43.26, 140 60 M140 60 C96.96 59, 54.63 59.12, 0 60 M140 60 C108.51 58.69, 76.76 58.93, 0 60 M0 60 C0.62 39.03, 1.44 17.63, 0 0 M0 60 C0.35 45.35, 0.01 31.17, 0 0" stroke="var(--accent)" stroke-width="1.5" fill="none"></path></g><g transform="translate(596.66552734375 286.925) rotate(0 37.33447265625 12.074999999999989)"><text x="37.33447265625" y="17.74541015625" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21px" fill="var(--text)" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">C · 旧值</text></g><g transform="translate(309 452) rotate(0 87.615234375 10.925000000000011)"><text x="0" y="16.055371093749997" font-family="Helvetica, Arial, Pi