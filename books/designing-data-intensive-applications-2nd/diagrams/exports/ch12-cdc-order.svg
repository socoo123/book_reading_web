<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 808 777.7" width="808" height="777.7" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">独立双写与CDC的顺序差别</title><desc id="diagram-desc">独立双写中数据库最终B、索引最终A；CDC让数据库的A到B顺序成为下游应用的依据，但传播仍然异步。</desc>
