<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">工单分派与投递的反馈闭环</title>
  <desc id="desc">一个工单分派服务包含分派、投递、共享代码组件。分派选择专家后立即投递，投递失败则重新选择专家；暂时没有专家时工单回队列等待。</desc>
  <style>
    :root{--surface:#fcfbf8;--text:#292824;--muted:#66645d;--line:#969187;--soft:#f0ece4;--accent:#386d74}
    @media(prefers-color-scheme:dark){:root:not([data-theme='light']){--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--line:#8c8982;--soft:#353534;--accent:#94c8cf}}
    :root[data-theme='dark']{--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--line:#8c8982;--soft:#353534;--accent:#94c8cf}
    .bg{fill:var(--surface)}text{fill:var(--text);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:17px}.heading{font-size:21px;font-weight:600}.small{font-size:15px;fill:var(--muted)}.box{fill:var(--soft);stroke:var(--line);stroke-width:1.5}.boundary{fill:var(--surface);stroke:var(--accent);stroke-width:2}.edge{fill:none;stroke:var(--accent);stroke-width:2;marker-end:url(#arrow)}.feedback{stroke-dasharray:6 5}.arrow{fill:var(--accent)}
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="arrow" d="M0 0 8 4 0 8Z"/></marker></defs>
  <rect class="bg" width="720" height="400"/>
  <text class="heading" x="28" y="36">不同活动，共同完成一次分派</text>
  <text class="small" x="28" y="65">实线：正常推进　虚线：投递失败后重新选择专家</text>
  <rect class="boundary" x="28" y="88" width="664" height="263" rx="12"/>
  <text x="50" y="118">一个工单分派服务 · 一个部署边界</text>
  <rect class="box" x="70" y="148" width="210" height="70" rx="8"/>
  <text x="175" y="176" text-anchor="middle">分派组件</text><text class="small" x="175" y="200" text-anchor="middle">按技能、位置、可用性选人</text>
  <rect class="box" x="440" y="148" width="210" height="70" rx="8"/>
  <text x="545" y="176" text-anchor="middle">投递组件</text><text class="small" x="545" y="200" text-anchor="middle">送达移动应用并短信提醒</text>
  <path class="edge" d="M280 175H432"/><text class="small" x="360" y="159" text-anchor="middle">选中后立即投递</text>
  <path class="edge feedback" d="M545 219V256H175V226"/><text class="small" x="360" y="246" text-anchor="middle">投递失败：返回重选</text>
  <rect class="box" x="70" y="283" width="580" height="43" rx="8"/><text x="360" y="311" text-anchor="middle">共享代码组件 · 与两类行为分别组织</text>
  <text class="small" x="360" y="380" text-anchor="middle">没有可用专家时工单回队列；外部设备与短信不因此成为本地事务</text>
  <script><![CDATA[try { const t = localStorage.getItem('reading-notes-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch {}]]></script>
</svg>
