<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" role="img" aria-labelledby="title desc">
  <title id="title">调查数据归调查服务，工单完成通过消息交接</title>
  <desc id="desc">工单完成服务直接写工单数据域，通过已有异步消息传递完成时间、专家和必要工单信息；调查服务接收后独自写调查数据域。两侧分别提交，图中没有发件箱实现或全局事务。</desc>
  <style>
    :root{--surface:#fcfbf8;--text:#292824;--muted:#66645d;--line:#969187;--soft:#f0ece4;--accent:#386d74}
    @media(prefers-color-scheme:dark){:root:not([data-theme='light']){--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--line:#8c8982;--soft:#353534;--accent:#94c8cf}}
    :root[data-theme='dark']{--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--line:#8c8982;--soft:#353534;--accent:#94c8cf}
    .bg{fill:var(--surface)}text{fill:var(--text);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:17px}.heading{font-size:21px;font-weight:600}.small{font-size:14px;fill:var(--muted)}.box{fill:var(--soft);stroke:var(--line);stroke-width:1.5}.boundary{fill:none;stroke:var(--line);stroke-width:1.5}.data{fill:var(--surface);stroke:var(--accent);stroke-width:2}.edge{fill:none;stroke:var(--accent);stroke-width:2;marker-end:url(#arrow)}.message{stroke-dasharray:6 5}.arrow{fill:var(--accent)}
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="arrow" d="M0 0 8 4 0 8Z"/></marker></defs>
  <rect class="bg" width="720" height="430"/>
  <text class="heading" x="28" y="36">已有通知，承接跨域数据责任</text>
  <text class="small" x="28" y="63">实线：直接写入 · 虚线：异步消息 · 两侧分别提交</text>
  <rect class="box" x="28" y="118" width="213" height="77" rx="10"/><text x="134" y="151" text-anchor="middle">工单完成服务</text><text class="small" x="134" y="177" text-anchor="middle">完成状态被系统接受</text>
  <rect class="boundary" x="479" y="90" width="213" height="254" rx="12"/><text class="small" x="585" y="111" text-anchor="middle">调查的单一写责任</text>
  <rect class="box" x="494" y="128" width="183" height="67" rx="9"/><text x="585" y="157" text-anchor="middle">调查服务</text><text class="small" x="585" y="181" text-anchor="middle">创建并维护调查记录</text>
  <path class="edge message" d="M241 155H488"/>
  <text x="360" y="118" text-anchor="middle">已有启动调查消息</text>
  <text class="small" x="360" y="191" text-anchor="middle">携带完成时间、专家</text><text class="small" x="360" y="214" text-anchor="middle">及必要工单信息</text>
  <path class="edge" d="M134 195V261"/><text class="small" x="151" y="239">本地提交</text>
  <rect class="data" x="28" y="269" width="213" height="65" rx="9"/><text x="134" y="296" text-anchor="middle">工单数据域</text><text class="small" x="134" y="321" text-anchor="middle">仍由工单三服务共用</text>
  <path class="edge" d="M585 195V261"/><text class="small" x="600" y="239">本地提交</text>
  <rect class="data" x="494" y="269" width="183" height="59" rx="9"/><text x="585" y="294" text-anchor="middle">调查数据域</text><text class="small" x="585" y="317" text-anchor="middle">Survey 数据</text>
  <text class="small" x="28" y="376">工单完成服务不再直接写 Survey；创建／分派服务在本图中省略。</text>
  <text class="small" x="28" y="402">代价：消息需带足信息；完成与调查建档之间的失败仍需恢复。</text>
  <script><![CDATA[try { const t = localStorage.getItem('reading-notes-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch {}]]></script>
</svg>
