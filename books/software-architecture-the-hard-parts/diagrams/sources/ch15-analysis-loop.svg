<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
<title id="title">三步权衡分析及证据反馈</title><desc id="desc">业务目标与约束进入识别维度、候选建模和变化评估三个步骤；试验与记录反馈修正假设。实线是推理推进，虚线是反馈。</desc>
<style>:root{--surface:#fcfbf8;--text:#292824;--muted:#66645d;--line:#969187;--soft:#f0ece4;--accent:#386d74}@media(prefers-color-scheme:dark){:root:not([data-theme='light']){--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--line:#8c8982;--soft:#353534;--accent:#94c8cf}}:root[data-theme='dark']{--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--line:#8c8982;--soft:#353534;--accent:#94c8cf}.bg{fill:var(--surface)}text{fill:var(--text);font:17px system-ui,-apple-system,'PingFang SC',sans-serif}.heading{font-size:22px;font-weight:600}.small{font-size:15px;fill:var(--muted)}.box{fill:var(--soft);stroke:var(--line);stroke-width:1.5}.edge{fill:none;stroke:var(--accent);stroke-width:2;marker-end:url(#arrow)}.feedback{stroke-dasharray:6 5}.arrow{fill:var(--accent)}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="arrow" d="M0 0 8 4 0 8Z"/></marker></defs>
<rect class="bg" width="720" height="460"/><text class="heading" x="28" y="38">先把问题拆清楚，再用证据收敛</text>
<rect class="box" x="220" y="66" width="280" height="50" rx="9"/><text x="360" y="98" text-anchor="middle">业务目标、实际约束与领域场景</text><path class="edge" d="M360 116V140H128V159"/>
<rect class="box" x="28" y="166" width="200" height="112" rx="10"/><text x="128" y="196" text-anchor="middle">① 识别纠缠维度</text><text class="small" x="128" y="228" text-anchor="middle">哪些选择互相牵制？</text><text class="small" x="128" y="254" text-anchor="middle">产物：依赖图与维度</text>
<path class="edge" d="M232 222H251"/><rect class="box" x="260" y="166" width="200" height="112" rx="10"/><text x="360" y="196" text-anchor="middle">② 分析耦合点</text><text class="small" x="360" y="228" text-anchor="middle">每个候选怎样工作？</text><text class="small" x="360" y="254" text-anchor="middle">产物：拓扑与失败路径</text>
<path class="edge" d="M464 222H483"/><rect class="box" x="492" y="166" width="200" height="112" rx="10"/><text x="592" y="196" text-anchor="middle">③ 评估变化影响</text><text class="small" x="592" y="228" text-anchor="middle">哪些收益与代价重要？</text><text class="small" x="592" y="254" text-anchor="middle">产物：有条件的选择</text>
<path class="edge" d="M592 278V330H510"/><rect class="box" x="220" y="302" width="280" height="65" rx="9"/><text x="360" y="330" text-anchor="middle">局部试验 · ADR · 持续观察</text><text class="small" x="360" y="354" text-anchor="middle">把假设转成证据，保存后果与理由</text>
<path class="edge feedback" d="M220 335H128V288"/><text class="small" x="28" y="395">实线 → 分析推进　　虚线 ⇢ 发现新条件后回看假设</text><text class="small" x="28" y="427">不是按步骤填表一次结束，而是缩小关键未知后再决定。</text>
<script><![CDATA[try{const t=localStorage.getItem('reading-notes-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch{}]]></script>
</svg>
