<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" role="img" aria-labelledby="title desc">
  <title id="title">工单与分派：同步等待，或异步受理后完成</title>
  <desc id="desc">同步时工单服务请求分派并等待结果。异步时工单服务向队列提交任务后可报告已受理，分派稍后消费并通知结果。异步没有消除分派工作，也没有无限增加吞吐能力。</desc>
  <!-- Original editable SVG; the export is an identical copy. -->
  <style>
    :root { color-scheme: light dark; --surface: #fcfbf8; --text: #292824; --muted: #655f55; --line: #81786a; --box: #efede7; --focus: #e5eee9; --accent: #346b59; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --surface: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #293b33; --accent: #9dc9b6; } }
    :root[data-theme='dark'] { --surface: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #293b33; --accent: #9dc9b6; }
    text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 18px; } .heading { font-size: 22px; font-weight: 600; } .label { font-size: 19px; font-weight: 600; } .sub { fill: var(--muted); font-size: 16px; } .center { text-anchor: middle; }
    .panel { fill: none; stroke: var(--line); } .box { fill: var(--box); stroke: var(--line); } .focus { fill: var(--focus); stroke: var(--accent); stroke-width: 1.5; }
    .arrow { fill: none; stroke: var(--line); stroke-width: 1.8; marker-end: url(#arrow); } .message { fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-dasharray: 6 4; marker-end: url(#message); }
  </style>
  <script><![CDATA[try { const t = localStorage.getItem('reading-notes-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch {}]]></script>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--line)"/></marker><marker id="message" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--accent)"/></marker></defs>
  <rect width="720" height="500" rx="10" fill="var(--surface)"/>
  <text class="heading" x="28" y="38">服务可独立发布，工作流仍可能共同等待</text>
  <text class="sub" x="28" y="66">比较未来工单／分派协作；不是已经落地的迁移结果</text>
  <rect class="panel" x="24" y="88" width="672" height="151" rx="10"/>
  <text class="label" x="44" y="118">同步：当前流程要等分派结果</text>
  <rect class="box" x="52" y="144" width="172" height="58" rx="8"/><text class="center" x="138" y="179">工单服务</text>
  <rect class="box" x="496" y="144" width="172" height="58" rx="8"/><text class="center" x="582" y="179">分派服务</text>
  <path class="arrow" d="M224 153H496"/><text class="sub center" x="360" y="143">请求分派</text>
  <path class="arrow" d="M496 193H224"/><text class="sub center" x="360" y="218">返回结果后，结束当前请求</text>
  <rect class="panel" x="24" y="255" width="672" height="189" rx="10"/>
  <text class="label" x="44" y="285">异步：“已受理”先于“已分派”</text>
  <rect class="box" x="52" y="318" width="172" height="58" rx="8"/><text class="center" x="138" y="353">工单服务</text>
  <rect class="focus" x="300" y="318" width="120" height="58" rx="8"/><text class="center" x="360" y="353">队列缓冲</text>
  <rect class="box" x="496" y="318" width="172" height="58" rx="8"/><text class="center" x="582" y="353">分派服务</text>
  <path class="message" d="M224 347H300"/><path class="message" d="M420 347H496"/>
  <text class="sub center" x="138" y="309">交付后可继续其他工作</text>
  <text class="sub center" x="582" y="309">按处理能力消费</text>
  <path class="message" d="M582 376V417H138V376"/><text class="sub center" x="360" y="406">完成后另行通知结果（回复通道省略）</text>
  <text class="sub" x="28" y="477">实线＝同步请求／结果　虚线＝异步消息　队列不改变下游处理上限</text>
</svg>
