<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" aria-labelledby="title desc">
<title id="title">逻辑领域提取为领域服务</title><desc id="desc">左侧报表与其他领域处于同一个单体；右侧报表单独部署，用户界面远程访问它，其他领域暂留单体。右侧两个部署单元仍共同依赖同一个数据库。</desc>
<style>:root{--surface:#fcfbf8;--text:#292824;--muted:#66645d;--line:#969187;--soft:#f0ece4;--accent:#386d74}@media(prefers-color-scheme:dark){:root:not([data-theme='light']){--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--line:#8c8982;--soft:#353534;--accent:#94c8cf}}:root[data-theme='dark']{--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--line:#8c8982;--soft:#353534;--accent:#94c8cf}.bg{fill:var(--surface)}text{fill:var(--text);font:17px system-ui,-apple-system,'PingFang SC',sans-serif}.title{font-size:22px;font-weight:600}.small{font-size:15px;fill:var(--muted)}.box{fill:var(--soft);stroke:var(--line);stroke-width:1.5}.deploy{fill:none;stroke:var(--accent);stroke-width:2}.logic{fill:var(--soft);stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 4}.edge{fill:none;stroke:var(--accent);stroke-width:2;marker-end:url(#a)}.arrow{fill:var(--accent)}</style>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="arrow" d="M0 0 8 4 0 8Z"/></marker></defs><rect class="bg" width="720" height="450"/>
<text class="title" x="28" y="38">一次提取，改变部署边界</text><text class="small" x="28" y="66">实线外框：部署范围；虚线内框：单体内的逻辑领域</text>
<rect class="deploy" x="28" y="105" width="226" height="220" rx="10"/><text x="44" y="134">整理后的单体</text><rect class="box" x="44" y="150" width="194" height="40" rx="6"/><text x="141" y="177" text-anchor="middle">用户界面</text><rect class="logic" x="44" y="208" width="194" height="42" rx="6"/><text x="141" y="236" text-anchor="middle">其他领域</text><rect class="logic" x="44" y="267" width="194" height="42" rx="6"/><text x="141" y="295" text-anchor="middle">报表领域</text>
<path class="edge" d="M268 221H319"/><text class="small" x="293" y="199" text-anchor="middle">提取</text>
<rect class="box" x="338" y="105" width="354" height="42" rx="7"/><text x="515" y="133" text-anchor="middle">用户界面 · 改为远程访问</text><path class="edge" d="M416 147V192"/><path class="edge" d="M611 147V192"/>
<rect class="deploy" x="338" y="201" width="166" height="113" rx="9"/><text x="421" y="238" text-anchor="middle">保留的单体</text><text class="small" x="421" y="268" text-anchor="middle">其他领域</text><text class="small" x="421" y="294" text-anchor="middle">单独的部署范围</text>
<rect class="deploy" x="532" y="201" width="160" height="113" rx="9"/><text x="612" y="238" text-anchor="middle">报表领域服务</text><text class="small" x="612" y="268" text-anchor="middle">四个报表组件</text><text class="small" x="612" y="294" text-anchor="middle">单独的部署范围</text>
<path class="edge" d="M421 314V342H478V359"/><path class="edge" d="M612 314V342H554V359"/><rect class="box" x="400" y="367" width="232" height="44" rx="10"/><text x="516" y="396" text-anchor="middle">仍共享的数据库</text><text class="small" x="28" y="389">数据边界尚未改变</text><text class="small" x="28" y="430">这是一种过渡结构；后续可继续提取领域，并另行处理数据归属与粒度</text>
<script><![CDATA[try{const t=localStorage.getItem('reading-notes-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch{}]]></script>
</svg>
