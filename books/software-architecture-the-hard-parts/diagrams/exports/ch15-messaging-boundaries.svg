<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540" role="img" aria-labelledby="title desc">
<title id="title">消息分发方式与契约运行边界</title><desc id="desc">原书共同主题便于增加订阅者，独立发送关系便于各自约定契约。只画跟踪与新增历史两个代表消费者。发布订阅也可拥有独立队列，实际边界需另查。</desc>
<style>:root{--surface:#fcfbf8;--text:#292824;--muted:#66645d;--line:#969187;--soft:#f0ece4;--accent:#386d74}@media(prefers-color-scheme:dark){:root:not([data-theme='light']){--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--line:#8c8982;--soft:#353534;--accent:#94c8cf}}:root[data-theme='dark']{--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--line:#8c8982;--soft:#353534;--accent:#94c8cf}.bg{fill:var(--surface)}text{fill:var(--text);font:17px system-ui,-apple-system,'PingFang SC',sans-serif}.heading{font-size:21px;font-weight:600}.small{font-size:15px;fill:var(--muted)}.box{fill:var(--soft);stroke:var(--line);stroke-width:1.5}.new{stroke-dasharray:6 4}.edge{fill:none;stroke:var(--accent);stroke-width:2;marker-end:url(#arrow)}.arrow{fill:var(--accent)}.rule{stroke:var(--line)}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="arrow" d="M0 0 8 4 0 8Z"/></marker></defs>
<rect class="bg" width="720" height="540"/><text class="heading" x="28" y="38">比较两种关系安排，而不是只比较“是否解耦”</text>
<text x="28" y="83">原书候选 A：共同主题广播</text><rect class="box" x="28" y="127" width="130" height="55" rx="8"/><text x="93" y="162" text-anchor="middle">生产者</text><path class="edge" d="M166 154H230"/><rect class="box" x="242" y="127" width="140" height="55" rx="8"/><text x="312" y="162" text-anchor="middle">共同主题</text>
<path class="edge" d="M390 154H436V122H482"/><path class="edge" d="M436 154V198H482"/><rect class="box" x="494" y="96" width="194" height="52" rx="8"/><text x="591" y="129" text-anchor="middle">出价跟踪</text><rect class="box new" x="494" y="172" width="194" height="52" rx="8"/><text x="591" y="205" text-anchor="middle">新增出价历史</text><text class="small" x="28" y="247">新增订阅容易；共同载荷、权限与运行配置仍需检查。</text>
<path class="rule" d="M28 271H692"/><text x="28" y="305">原书候选 B：按消费者分别发送</text><rect class="box" x="28" y="354" width="130" height="55" rx="8"/><text x="93" y="389" text-anchor="middle">生产者</text><path class="edge" d="M166 382H204V351H230"/><path class="edge" d="M204 382V427H230"/>
<rect class="box" x="242" y="326" width="140" height="52" rx="8"/><text x="312" y="359" text-anchor="middle">跟踪队列</text><rect class="box" x="242" y="402" width="140" height="52" rx="8"/><text x="312" y="435" text-anchor="middle">历史队列</text><path class="edge" d="M390 352H482"/><path class="edge" d="M390 428H482"/>
<rect class="box" x="494" y="326" width="194" height="52" rx="8"/><text x="591" y="359" text-anchor="middle">出价跟踪</text><rect class="box new" x="494" y="402" width="194" height="52" rx="8"/><text x="591" y="435" text-anchor="middle">新增出价历史</text><text class="small" x="28" y="482">分别约定契约与运行边界；新增关系及交付责任也要维护。</text><text class="small" x="28" y="514">注意：发布—订阅也能配独立队列。箭头表示消息交付，虚线框表示新增。</text>
<script><![CDATA[try{const t=localStorage.getItem('reading-notes-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch{}]]></script>
</svg>
