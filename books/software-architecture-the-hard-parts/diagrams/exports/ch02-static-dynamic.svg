<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" aria-labelledby="title desc">
  <title id="title">同一个消息代理，出现在两种依赖视图中</title>
  <desc id="desc">左侧实线表示工单服务依赖运行时与库、数据库、消息代理的存在或契约。右侧虚线表示工单服务在运行时通过消息代理向分派服务发送工作请求。本图不划分量子数量。</desc>
  <!-- Original editable SVG; the export is an identical copy. -->
  <style>
    :root { color-scheme: light dark; --surface: #fcfbf8; --text: #292824; --muted: #655f55; --line: #81786a; --box: #efede7; --focus: #e5eee9; --accent: #346b59; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --surface: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #293b33; --accent: #9dc9b6; } }
    :root[data-theme='dark'] { --surface: #252524; --text: #e6e3dc; --muted: #b9b3a8; --line: #a49b8c; --box: #30302c; --focus: #293b33; --accent: #9dc9b6; }
    text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 17px; }
    .heading { font-size: 22px; font-weight: 600; } .label { font-size: 19px; font-weight: 600; } .sub { fill: var(--muted); font-size: 16px; } .center { text-anchor: middle; }
    .panel { fill: none; stroke: var(--line); } .box { fill: var(--box); stroke: var(--line); } .focus { fill: var(--focus); stroke: var(--accent); stroke-width: 1.5; }
    .arrow { fill: none; stroke: var(--line); stroke-width: 1.7; marker-end: url(#arrow); } .message { fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-dasharray: 6 4; marker-end: url(#message); }
  </style>
  <script><![CDATA[try { const t = localStorage.getItem('reading-notes-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch {}]]></script>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--line)"/></marker><marker id="message" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--accent)"/></marker></defs>
  <rect width="720" height="450" rx="10" fill="var(--surface)"/>
  <text class="heading" x="28" y="38">“需要它存在”与“通过它协作”</text>
  <text class="sub" x="28" y="66">消息代理的存在是静态依赖；实际消息交换是动态协作</text>
  <rect class="panel" x="24" y="88" width="328" height="306" rx="10"/>
  <rect class="panel" x="368" y="88" width="328" height="306" rx="10"/>
  <text class="label" x="44" y="120">静态视图：启动与运行所需</text>
  <text class="label" x="388" y="120">动态视图：一条工作流</text>
  <rect class="focus" x="112" y="140" width="152" height="44" rx="7"/><text class="center" x="188" y="168">工单服务</text>
  <path class="arrow" d="M112 162H67V228H94"/><path class="arrow" d="M112 174H80V279H94"/><path class="arrow" d="M264 162H314V338H282"/>
  <rect class="box" x="94" y="206" width="188" height="44" rx="7"/><text class="center" x="188" y="234">Java、框架与库</text>
  <rect class="box" x="94" y="257" width="188" height="44" rx="7"/><text class="center" x="188" y="285">数据库及其契约</text>
  <rect class="focus" x="94" y="316" width="188" height="44" rx="7"/><text class="center" x="188" y="344">消息代理</text>
  <rect class="box" x="444" y="140" width="176" height="44" rx="7"/><text class="center" x="532" y="168">工单服务</text>
  <path class="message" d="M532 184V228"/><text class="sub" x="545" y="213">发送请求</text>
  <rect class="focus" x="444" y="231" width="176" height="44" rx="7"/><text class="center" x="532" y="259">消息代理</text>
  <path class="message" d="M532 275V317"/><text class="sub" x="545" y="304">交付消息</text>
  <rect class="box" x="444" y="320" width="176" height="44" rx="7"/><text class="center" x="532" y="348">分派服务</text>
  <text class="sub" x="28" y="424">实线＝依赖存在或契约　虚线＝消息流向　此图不用于计算量子数量</text>
</svg>
