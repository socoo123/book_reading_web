<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540" role="img" aria-labelledby="title desc">
<title id="title">用三种支付场景检验服务粒度</title><desc id="desc">修改信用卡处理与新增积分支付揭示独立变更优势；混合付款使多个服务共同达成一个业务目标，带来协调和恢复责任。</desc>
<style>:root{--surface:#fcfbf8;--text:#292824;--muted:#66645d;--line:#969187;--soft:#f0ece4;--accent:#386d74}@media(prefers-color-scheme:dark){:root:not([data-theme='light']){--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--line:#8c8982;--soft:#353534;--accent:#94c8cf}}:root[data-theme='dark']{--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--line:#8c8982;--soft:#353534;--accent:#94c8cf}.bg{fill:var(--surface)}text{fill:var(--text);font:17px system-ui,-apple-system,'PingFang SC',sans-serif}.heading{font-size:22px;font-weight:600}.small{font-size:15px;fill:var(--muted)}.box{fill:var(--soft);stroke:var(--line);stroke-width:1.5}.edge{fill:none;stroke:var(--accent);stroke-width:2;marker-end:url(#arrow)}.arrow{fill:var(--accent)}.rule{stroke:var(--line);stroke-width:1}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="arrow" d="M0 0 8 4 0 8Z"/></marker></defs>
<rect class="bg" width="720" height="540"/><text class="heading" x="28" y="38">不要只画服务框：让真实变化穿过边界</text><text class="small" x="28" y="68">左侧是场景；右侧是拆分方案暴露出的主要影响。</text>
<rect class="box" x="28" y="98" width="225" height="72" rx="9"/><text x="140" y="128" text-anchor="middle">① 修改信用卡处理</text><text class="small" x="140" y="153" text-anchor="middle">其他支付类型不变</text><path class="edge" d="M263 134H317"/><rect class="box" x="330" y="98" width="360" height="72" rx="9"/><text x="510" y="128" text-anchor="middle">变化集中到信用卡服务</text><text class="small" x="510" y="153" text-anchor="middle">收益取决于契约、数据和部署真能独立</text>
<rect class="box" x="28" y="198" width="225" height="72" rx="9"/><text x="140" y="228" text-anchor="middle">② 增加积分支付</text><text class="small" x="140" y="253" text-anchor="middle">新增一种业务能力</text><path class="edge" d="M263 234H317"/><rect class="box" x="330" y="198" width="360" height="72" rx="9"/><text x="510" y="228" text-anchor="middle">增加积分服务及接入关系</text><text class="small" x="510" y="253" text-anchor="middle">功能可扩展性 ≠ 负载承载能力</text>
<path class="rule" d="M28 294H692"/><rect class="box" x="28" y="326" width="225" height="100" rx="9"/><text x="140" y="358" text-anchor="middle">③ 一笔混合付款</text><text class="small" x="140" y="386" text-anchor="middle">多个类型共同达成目标</text><text class="small" x="140" y="412" text-anchor="middle">部分成功之后怎么办？</text>
<path class="edge" d="M263 376H330V338H366"/><path class="edge" d="M330 376V414H366"/><rect class="box" x="378" y="312" width="290" height="52" rx="8"/><text x="523" y="345" text-anchor="middle">礼品卡服务及其数据</text><rect class="box" x="378" y="388" width="290" height="52" rx="8"/><text x="523" y="421" text-anchor="middle">信用卡服务及其数据</text>
<text class="small" x="28" y="480">分叉箭头 → 需要协调的参与者，不指定同步方式或并行顺序</text><text x="28" y="515">独立变化的收益，需要与跨边界协调、恢复成本一起比较。</text>
<script><![CDATA[try{const t=localStorage.getItem('reading-notes-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch{}]]></script>
</svg>
