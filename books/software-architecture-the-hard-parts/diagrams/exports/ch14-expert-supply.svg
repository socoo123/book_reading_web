<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
<title id="title">专家供给 DPQ 的三个分析输入</title><desc id="desc">工单长期视图、专家每日快照和调查结果日志异步进入专家供给DPQ，支持机器学习与每日供给建议、技能趋势分析。此图不表示模型已经上线。</desc>
<style>:root{--surface:#fcfbf8;--text:#292824;--muted:#66645d;--line:#969187;--soft:#f0ece4;--accent:#386d74}@media(prefers-color-scheme:dark){:root:not([data-theme='light']){--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--line:#8c8982;--soft:#353534;--accent:#94c8cf}}:root[data-theme='dark']{--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--line:#8c8982;--soft:#353534;--accent:#94c8cf}.bg{fill:var(--surface)}text{fill:var(--text);font:17px system-ui,-apple-system,"PingFang SC",sans-serif}.heading{font-size:21px;font-weight:600}.small{font-size:15px;fill:var(--muted)}.box{fill:var(--soft);stroke:var(--line);stroke-width:1.5}.edge{fill:none;stroke:var(--accent);stroke-width:2;marker-end:url(#arrow)}.async{stroke-dasharray:6 5}.arrow{fill:var(--accent)}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="arrow" d="M0 0 8 4 0 8Z"/></marker></defs>
<rect class="bg" width="720" height="480"/><text class="heading" x="28" y="36">组合分析产品，支持专家供给规划</text><text class="small" x="28" y="65">虚线 → 异步输入　　实线 → 分析产出关系</text>
<rect class="box" x="28" y="94" width="274" height="78" rx="9"/><text x="165" y="124" text-anchor="middle">Tickets DPQ</text><text class="small" x="165" y="153" text-anchor="middle">已提出／已解决工单的长期视图</text>
<rect class="box" x="28" y="204" width="274" height="78" rx="9"/><text x="165" y="234" text-anchor="middle">用户维护 DPQ</text><text class="small" x="165" y="263" text-anchor="middle">全体专家资料的每日快照</text>
<rect class="box" x="28" y="314" width="274" height="78" rx="9"/><text x="165" y="344" text-anchor="middle">Survey DPQ</text><text class="small" x="165" y="373" text-anchor="middle">客户调查结果日志</text>
<path class="edge async" d="M310 133H358V218H414"/><path class="edge async" d="M310 243H414"/><path class="edge async" d="M310 353H358V268H414"/>
<rect class="box" x="424" y="190" width="268" height="108" rx="9"/><text x="558" y="221" text-anchor="middle">Experts Supply DPQ</text><text class="small" x="558" y="250" text-anchor="middle">按契约组合输入</text><text class="small" x="558" y="276" text-anchor="middle">支持机器学习与趋势分析</text>
<path class="edge" d="M558 306V343"/><rect class="box" x="424" y="352" width="268" height="66" rx="9"/><text x="558" y="379" text-anchor="middle">每日供给建议</text><text class="small" x="558" y="405" text-anchor="middle">专家技能趋势分析</text>
<text class="small" x="28" y="455">三个输入各有时间口径；原书未给出模型、端点细节和上线指标。</text>
<script><![CDATA[try{const t=localStorage.getItem('reading-notes-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch{}]]></script>
</svg>
