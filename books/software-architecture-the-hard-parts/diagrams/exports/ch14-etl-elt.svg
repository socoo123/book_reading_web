<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
<title id="title">ETL 与 ELT：转换的时机与责任</title><desc id="desc">ETL先转换为分析模型再装载；ELT先装载近原始数据再按用途转换。两者都需要语义解释和质量维护。</desc>
<style>:root{--surface:#fcfbf8;--text:#292824;--muted:#66645d;--line:#969187;--soft:#f0ece4;--accent:#386d74}@media(prefers-color-scheme:dark){:root:not([data-theme='light']){--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--line:#8c8982;--soft:#353534;--accent:#94c8cf}}:root[data-theme='dark']{--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--line:#8c8982;--soft:#353534;--accent:#94c8cf}.bg{fill:var(--surface)}text{fill:var(--text);font:17px system-ui,-apple-system,"PingFang SC",sans-serif}.heading{font-size:21px;font-weight:600}.small{font-size:15px;fill:var(--muted)}.box{fill:var(--soft);stroke:var(--line);stroke-width:1.5}.edge{fill:none;stroke:var(--accent);stroke-width:2;marker-end:url(#arrow)}.arrow{fill:var(--accent)}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="arrow" d="M0 0 8 4 0 8Z"/></marker></defs>
<rect class="bg" width="720" height="400"/><text class="heading" x="28" y="36">转换延后，工作与责任并没有消失</text>
<text x="28" y="82">ETL · 先为分析建模</text>
<rect class="box" x="28" y="100" width="176" height="64" rx="9"/><text x="116" y="138" text-anchor="middle">抽取运营数据</text>
<path class="edge" d="M212 132H261"/><rect class="box" x="270" y="100" width="176" height="64" rx="9"/><text x="358" y="138" text-anchor="middle">转换为分析模型</text>
<path class="edge" d="M454 132H503"/><rect class="box" x="512" y="100" width="180" height="64" rx="9"/><text x="602" y="138" text-anchor="middle">装载后提供查询</text>
<text class="small" x="28" y="194">责任重心：预先确定口径；维护源模型到分析模型的映射</text>
<text x="28" y="240">ELT · 先保存，再按用途建模</text>
<rect class="box" x="28" y="258" width="176" height="64" rx="9"/><text x="116" y="296" text-anchor="middle">抽取源数据</text>
<path class="edge" d="M212 290H261"/><rect class="box" x="270" y="258" width="176" height="64" rx="9"/><text x="358" y="296" text-anchor="middle">装载近原始数据</text>
<path class="edge" d="M454 290H503"/><rect class="box" x="512" y="258" width="180" height="64" rx="9"/><text x="602" y="296" text-anchor="middle">按用途转换分析</text>
<text class="small" x="28" y="353">责任重心：保留探索空间；消费方承担更多发现、解释与转换</text>
<text class="small" x="28" y="382">箭头表示处理顺序；两行是典型安排，不是存储产品的硬性分类。</text>
<script><![CDATA[try{const t=localStorage.getItem('reading-notes-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch{}]]></script>
</svg>
