<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">工单共享库减少一层远程依赖，保留共同数据库</title>
  <desc id="desc">工单创建、工单分派、工单完成各自携带共享数据库逻辑库，三条数据库访问箭头指向同一个工单数据域。各实例管理连接池，库版本可以分别选择，数据库依赖仍在。</desc>
  <style>
    :root{--surface:#fcfbf8;--text:#292824;--muted:#66645d;--line:#969187;--soft:#f0ece4;--accent:#386d74}
    @media(prefers-color-scheme:dark){:root:not([data-theme='light']){--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--line:#8c8982;--soft:#353534;--accent:#94c8cf}}
    :root[data-theme='dark']{--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--line:#8c8982;--soft:#353534;--accent:#94c8cf}
    .bg{fill:var(--surface)}text{fill:var(--text);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:17px}.heading{font-size:21px;font-weight:600}.small{font-size:15px;fill:var(--muted)}.box{fill:var(--soft);stroke:var(--line);stroke-width:1.5}.core{fill:var(--surface);stroke:var(--accent);stroke-width:2}.edge{fill:none;stroke:var(--accent);stroke-width:2;marker-end:url(#arrow)}.arrow{fill:var(--accent)}
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="arrow" d="M0 0 8 4 0 8Z"/></marker></defs>
  <rect class="bg" width="720" height="400"/>
  <text class="heading" x="28" y="36">采用共享库，没有新增 Ticket Data 服务</text>
  <text class="small" x="28" y="63">Sysops Squad 的决定 · 箭头表示数据库访问</text>
  <rect class="box" x="28" y="91" width="204" height="140" rx="10"/><text x="130" y="123" text-anchor="middle">工单创建</text><text class="small" x="130" y="147" text-anchor="middle">客户入口</text>
  <rect class="box" x="258" y="91" width="204" height="140" rx="10"/><text x="360" y="123" text-anchor="middle">工单分派</text><text class="small" x="360" y="147" text-anchor="middle">含分派与投递</text>
  <rect class="box" x="488" y="91" width="204" height="140" rx="10"/><text x="590" y="123" text-anchor="middle">工单完成</text><text class="small" x="590" y="147" text-anchor="middle">完成处理</text>
  <rect class="core" x="42" y="170" width="176" height="43" rx="7"/><text x="130" y="198" text-anchor="middle">数据库逻辑 DLL</text>
  <rect class="core" x="272" y="170" width="176" height="43" rx="7"/><text x="360" y="198" text-anchor="middle">数据库逻辑 DLL</text>
  <rect class="core" x="502" y="170" width="176" height="43" rx="7"/><text x="590" y="198" text-anchor="middle">数据库逻辑 DLL</text>
  <rect class="box" x="236" y="299" width="248" height="59" rx="10"/><text x="360" y="326" text-anchor="middle">共同的工单数据域</text><text class="small" x="360" y="347" text-anchor="middle">schema 与容量仍需协调</text>
  <path class="edge" d="M130 231V329H227"/><path class="edge" d="M360 231V290"/><path class="edge" d="M590 231V329H493"/>
  <text class="small" x="360" y="386" text-anchor="middle">各服务选用库版本、测试并部署；各实例维护连接池</text>
  <script><![CDATA[try { const t = localStorage.getItem('reading-notes-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch {}]]></script>
</svg>
