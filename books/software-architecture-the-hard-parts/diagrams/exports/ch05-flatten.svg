<svg xmlns="http://www.w3.org/2000/svg" width="720" height="510" viewBox="0 0 720 510" role="img" aria-labelledby="title desc">
<title id="title">展平组件的两种方向</title><desc id="desc">原结构的 ss.survey 父节点和 templates 子节点都包含代码。选择一将模板并入父节点，使 survey 成为叶组件；选择二将父节点代码分到 create 和 process，保留 templates，父节点不再装代码。</desc>
<style>:root{--surface:#fcfbf8;--text:#292824;--muted:#66645d;--line:#969187;--soft:#f0ece4;--accent:#386d74}@media(prefers-color-scheme:dark){:root:not([data-theme='light']){--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--line:#8c8982;--soft:#353534;--accent:#94c8cf}}:root[data-theme='dark']{--surface:#252524;--text:#e6e3dc;--muted:#b6b1a7;--line:#8c8982;--soft:#353534;--accent:#94c8cf}.bg{fill:var(--surface)}text{fill:var(--text);font:17px system-ui,-apple-system,'PingFang SC',sans-serif}.title{font-size:22px;font-weight:600}.small{font-size:15px;fill:var(--muted)}.box{fill:var(--soft);stroke:var(--accent);stroke-width:1.5}.empty{fill:var(--surface);stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 4}.line{fill:none;stroke:var(--line);stroke-width:1.5}</style>
<rect class="bg" width="720" height="510"/><text class="title" x="28" y="38">代码归入叶节点；路径不必等长</text><text class="small" x="28" y="66">所有路径省略共同前缀 ss；连线表示包含，不表示调用</text>
<text x="34" y="123">原结构：父子都装代码</text><rect class="box" x="34" y="155" width="226" height="75" rx="8"/><text x="52" y="185">survey</text><text class="small" x="52" y="211">有代码：5 个类（孤儿）</text><path class="line" d="M147 230V270"/><rect class="box" x="34" y="270" width="226" height="75" rx="8"/><text x="52" y="300">survey.templates</text><text class="small" x="52" y="326">有代码：7 个类</text>
<path class="line" d="M294 101V461"/>
<text x="330" y="123">选择一：简单能力合并</text><rect class="box" x="330" y="145" width="356" height="74" rx="8"/><text x="348" y="175">survey · 叶组件</text><text class="small" x="348" y="201">包含原来的 12 个类；不再有子节点</text>
<text x="330" y="275">选择二：父级职责拆到新叶组件</text><rect class="empty" x="330" y="295" width="356" height="63" rx="8"/><text x="348" y="321">survey · 子领域</text><text class="small" x="348" y="345">无代码，仅组织下属组件</text><path class="line" d="M508 358V377M382 377H630M382 377V397M508 377V397M630 377V397"/>
<rect class="box" x="330" y="397" width="108" height="61" rx="8"/><text x="384" y="423" text-anchor="middle">create</text><text class="small" x="384" y="446" text-anchor="middle">有代码</text>
<rect class="box" x="454" y="397" width="108" height="61" rx="8"/><text x="508" y="423" text-anchor="middle">process</text><text class="small" x="508" y="446" text-anchor="middle">有代码</text>
<rect class="box" x="578" y="397" width="108" height="61" rx="8"/><text x="632" y="423" text-anchor="middle">templates</text><text class="small" x="632" y="446" text-anchor="middle">有代码</text><text class="small" x="28" y="488">两种候选都满足叶节点规则；实际选择还要看职责、复杂度与变化方式</text>
<script><![CDATA[try{const t=localStorage.getItem('reading-notes-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch{}]]></script>
</svg>
