name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage website files
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/
          # Keep paths intact; publish only web files, never notes or original books.
          find assets books \
            -type d \( -name notes -o -name sources -o -name originals \) -prune -o \
            -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \
              -o -name '*.svg' -o -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' \
              -o -name '*.webp' -o -name '*.avif' -o -name '*.gif' -o -name '*.ico' \
              -o -name '*.woff' -o -name '*.woff2' \) \
            -exec cp --parents -t _site {} +

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
